 "tr": "ʿIndamā taqaʿu al-azmatu yajibu an naḥtafiẓa bi-hudūʾinā wa nuḥaddida al-awlawiyyāti.", "id": "Ketika krisis terjadi, kita harus tetap tenang dan menentukan prioritas.", "t": 14, "em": "😌"}, {"n": "2482", "ar": "لَا يُمْكِنُ حَلُّ الْمُشْكِلَةِ إِلَّا إِذَا فَهِمْنَا جَذْرَهَا.", "tr": "Lā yumkinu ḥallu al-mushkilati illā idhā fahimnā jadhrahā.", "id": "Masalah tidak dapat diselesaikan kecuali kita memahami akarnya.", "t": 14, "em": ""}, {"n": "2483", "ar": "عَلَى الْمُدِيرِ أَنْ يَتَحَمَّلَ مَسْؤُولِيَّةَ قَرَارَاتِهِ لَا أَنْ يُلْقِيَ اللَّوْمَ عَلَى غَيْرِهِ.", "tr": "ʿAlā al-mudīri an yataḥammala masʾūliyyata qarārātihi lā an yulqiya al-lawma ʿalā ghayrihi.", "id": "Manajer harus menanggung tanggung jawab keputusannya, bukan menyalahkan orang lain.", "t": 14, "em": ""}, {"n": "2484", "ar": "لَقَدْ مَرَرْنَا بِأَزْمَةٍ مَالِيَّةٍ وَخَرَجْنَا مِنْهَا أَقْوَى.", "tr": "Laqad mararnā bi-azmatin māliyyatin wa kharajnā minhā aqwā.", "id": "Kami pernah mengalami krisis keuangan dan keluar darinya lebih kuat.", "t": 14, "em": ""}, {"n": "2485", "ar": "الْقِيَادَةُ لَيْسَتْ مَنْصِبًا، بَلْ هِيَ قُدْرَةٌ عَلَى التَّأْثِيرِ الْإِيجَابِيِّ.", "tr": "Al-qiyādatu laysat manṣiban, bal hiya qudratun ʿalā at-taʾthīri al-ījābiyyi.", "id": "Kepemimpinan bukan jabatan, melainkan kemampuan memberi pengaruh positif.", "t": 14, "em": ""}, {"n": "2486", "ar": "فِي الْأَزَمَاتِ يَظْهَرُ مَعْدِنُ الْفَرِيقِ الْحَقِيقِيُّ.", "tr": "Fī al-azamāti yaẓharu maʿdinu al-farīqi al-ḥaqīqiyyu.", "id": "Dalam krisis, karakter sejati sebuah tim akan tampak.", "t": 14, "em": "👥"}, {"n": "2487", "ar": "عَلَيْنَا أَنْ نَضَعَ خُطَّةً بَدِيلَةً تَحَسُّبًا لِأَيِّ طَارِئٍ.", "tr": "ʿAlaynā an naḍaʿa khuṭṭatan badīlatan taḥassuban li-ayyi ṭāriʾin.", "id": "Kita harus membuat rencana cadangan sebagai antisipasi segala keadaan darurat.", "t": 14, "em": "🚨"}, {"n": "2488", "ar": "الْقَرَارُ السَّرِيعُ لَيْسَ دَائِمًا الْقَرَارَ الصَّحِيحَ.", "tr": "Al-qarāru as-sarīʿu laysa dāʾiman al-qarāra aṣ-ṣaḥīḥa.", "id": "Keputusan cepat tidak selalu keputusan yang benar.", "t": 14, "em": ""}, {"n": "2489", "ar": "يَنْبَغِي أَنْ نَتَوَاصَلَ بِوُضُوحٍ مَعَ الْجَمِيعِ فِي أَوْقَاتِ الشِّدَّةِ.", "tr": "Yanbaghī an natawāṣala bi-wuḍūḥin maʿa al-jamīʿi fī awqāti ash-shiddati.", "id": "Kita sebaiknya berkomunikasi dengan jelas kepada semua orang di masa sulit.", "t": 14, "em": ""}, {"n": "2490", "ar": "الْمُدِيرُ الَّذِي يُفَوِّضُ الْمَهَامَّ يُنَمِّي مَهَارَاتِ فَرِيقِهِ.", "tr": "Al-mudīru alladhī yufawwiḍu al-mahāmma yunammī mahārāti farīqihi.", "id": "Manajer yang mendelegasikan tugas mengembangkan keterampilan timnya.", "t": 14, "em": "👥"}, {"n": "2491", "ar": "لَوْ تَعَاوَنَّا مِنَ الْبِدَايَةِ لَمَا وَصَلَتِ الْأُمُورُ إِلَى هَذَا الْحَدِّ.", "tr": "Law taʿāwannā mina al-bidāyati lamā waṣalati al-umūru ilā hādhā al-ḥaddi.", "id": "Seandainya kita bekerja sama sejak awal, keadaan tidak akan sampai separah ini.", "t": 14, "em": ""}, {"n": "2492", "ar": "حِينَ يَخْتَلِفُ الْفَرِيقُ يَجِبُ عَلَى الْقَائِدِ أَنْ يُقَرِّبَ وُجُهَاتِ النَّظَرِ.", "tr": "Ḥīna yakhtalifu al-farīqu yajibu ʿalā al-qāʾidi an yuqarriba wujhāti an-naẓari.", "id": "Ketika tim berbeda pendapat, pemimpin harus mendekatkan sudut pandang.", "t": 14, "em": "👥"}, {"n": "2493", "ar": "مَنْ لَا يَتَعَلَّمُ مِنْ أَخْطَائِهِ يُكَرِّرُهَا.", "tr": "Man lā yataʿallamu min akhṭāʾihi yukarriruhā.", "id": "Siapa yang tidak belajar dari kesalahannya akan mengulanginya.", "t": 14, "em": "📚"}, {"n": "2494", "ar": "مَا أَنْجَحَ الْقَادَةَ الَّذِينَ يُحِبُّونَ مَنْ يَعْمَلُونَ مَعَهُمْ!", "tr": "Mā anjaḥa al-qādata alladhīna yuḥibbūna man yaʿmalūna maʿahum!", "id": "Betapa suksesnya para pemimpin yang mencintai orang-orang yang bekerja bersama mereka!", "t": 14, "em": ""}, {"n": "2495", "ar": "اجْتَمَعْنَا فِي أَثْنَاءِ الطَّارِئِ وَاتَّخَذْنَا الْقَرَارَ فِي سَاعَةٍ.", "tr": "Ijtamaʿnā fī athnāʾi aṭ-ṭāriʾi wa-ittakhadhnā al-qarāra fī sāʿatin.", "id": "Kami berkumpul saat keadaan darurat dan mengambil keputusan dalam satu jam.", "t": 14, "em": "🚨⏰"}, {"n": "2496", "ar": "الْمَسْؤُولِيَّةُ الْجَمَاعِيَّةُ تُخَفِّفُ عَنِ الْفَرْدِ ثِقَلَ الْقَرَارِ.", "tr": "Al-masʾūliyyatu al-jamāʿiyyatu tukhaffifu ʿani al-fardi thiqala al-qarāri.", "id": "Tanggung jawab bersama meringankan beban keputusan dari individu.", "t": 14, "em": ""}, {"n": "2497", "ar": "إِنَّ الْقَائِدَ الْحَقِيقِيَّ يَصْنَعُ قَادَةً آخَرِينَ.", "tr": "Inna al-qāʾida al-ḥaqīqiyya yaṣnaʿu qādatan ākharīna.", "id": "Pemimpin sejati melahirkan pemimpin-pemimpin lain.", "t": 14, "em": ""}, {"n": "2498", "ar": "لَا تَنْتَظِرِ الْأَزْمَةَ لِتَبْدَأَ التَّخْطِيطَ.", "tr": "Lā tantaẓiri al-azmata li-tabdaʾa at-takhṭīṭa.", "id": "Jangan menunggu krisis untuk mulai merencanakan.", "t": 14, "em": ""}, {"n": "2499", "ar": "التَّغْيِيرُ يُخِيفُ الْكَثِيرِينَ، وَوَاجِبُ الْقَائِدِ أَنْ يُطَمْئِنَهُمْ وَيَشْرَحَ لَهُمُ الْأَسْبَابَ.", "tr": "At-taghyīru yukhīfu al-kathīrīna, wa wājibu al-qāʾidi an yuṭamʾinahum wa yashraḥa lahumu al-asbāba.", "id": "Perubahan menakutkan banyak orang, dan kewajiban pemimpin adalah menenangkan dan menjelaskan alasannya.", "t": 14, "em": ""}, {"n": "2500", "ar": "قَبْلَ أَنْ نَبْحَثَ عَنْ مُذْنِبٍ، دَعُونَا نَبْحَثْ عَنْ حَلٍّ.", "tr": "Qabla an nabḥatha ʿan mudhnibin, daʿūnā nabḥath ʿan ḥallin.", "id": "Sebelum mencari siapa yang bersalah, mari kita cari solusi.", "t": 14, "em": "🔍"}, {"n": "2501", "ar": "شَاهَدْتُ فِيلْمًا يَطْرَحُ أَسْئِلَةً عَمِيقَةً عَنِ الْحُرِّيَّةِ وَالْمَسْؤُولِيَّةِ.", "tr": "Shāhadtu fīlman yaṭraḥu asʾilatan ʿamīqatan ʿani al-ḥurriyyati wal-masʾūliyyati.", "id": "Saya menonton film yang mengajukan pertanyaan mendalam tentang kebebasan dan tanggung jawab.", "t": 15, "em": "🎬"}, {"n": "2502", "ar": "لَمْ يَكُنِ الْفِيلْمُ كَمَا تَوَقَّعْتُ، فَقَدْ كَانَتِ الْقِصَّةُ بَطِيئَةً.", "tr": "Lam yakuni al-fīlmu kamā tawaqqaʿtu, faqad kānati al-qiṣṣatu baṭīʾatan.", "id": "Filmnya tidak seperti yang saya harapkan, ceritanya lambat.", "t": 15, "em": "🎬"}, {"n": "2503", "ar": "أُفَضِّلُ الْمَسْرَحَ لِأَنَّ الْمُمَثِّلَ يَقِفُ أَمَامَكَ مُبَاشَرَةً.", "tr": "Ufaḍḍilu al-masraḥa li-anna al-mumaththila yaqifu amāmaka mubāsharatan.", "id": "Saya lebih suka teater karena aktornya berdiri langsung di hadapanmu.", "t": 15, "em": "🎭"}, {"n": "2504", "ar": "أَدَّى الْمُمَثِّلُ دَوْرَ الْأَبِ بِإِتْقَانٍ حَتَّى بَكَى الْجُمْهُورُ.", "tr": "Addā al-mumaththilu dawra al-abi bi-itqānin ḥattā bakā al-jumhūru.", "id": "Aktor itu memerankan sang ayah dengan sangat baik hingga penonton menangis.", "t": 15, "em": "👨😭"}, {"n": "2505", "ar": "النِّهَايَةُ كَانَتْ مَفْتُوحَةً فَتَرَكَتْنَا نُفَكِّرُ طَوِيلًا.", "tr": "An-nihāyatu kānat maftūḥatan fa-tarakatnā nufakkiru ṭawīlan.", "id": "Akhir ceritanya terbuka sehingga membuat kita berpikir lama.", "t": 15, "em": ""}, {"n": "2506", "ar": "يُعْرَضُ الْفِيلْمُ فِي دُورِ السِّينَمَا ابْتِدَاءً مِنَ الْخَمِيسِ.", "tr": "Yuʿraḍu al-fīlmu fī dūri as-sīnamā ibtidāʾan mina al-khamīsi.", "id": "Film itu ditayangkan di bioskop mulai hari Kamis.", "t": 15, "em": "🎬"}, {"n": "2507", "ar": "فَازَ الْفِيلْمُ بِجَائِزَةِ أَفْضَلِ سِيَنَارْيُو فِي الْمِهْرَجَانِ.", "tr": "Fāza al-fīlmu bi-jāʾizati afḍali sīnāriyū fī al-mihrajāni.", "id": "Film itu memenangkan penghargaan skenario terbaik di festival.", "t": 15, "em": "🎬"}, {"n": "2508", "ar": "كَثِيرًا مَا تَكُونُ الْكُتُبُ أَفْضَلَ مِنَ الْأَفْلَامِ الْمَأْخُوذَةِ عَنْهَا.", "tr": "Kathīran mā takūnu al-kutubu afḍala mina al-aflāmi al-maʾkhūdhati ʿanhā.", "id": "Sering kali buku lebih baik daripada film yang diadaptasi darinya.", "t": 15, "em": "📖🎬"}, {"n": "2509", "ar": "دَخَلْنَا الْمَسْرَحَ قَبْلَ بِدَايَةِ الْعَرْضِ بِعَشْرِ دَقَائِقَ.", "tr": "Dakhalnā al-masraḥa qabla bidāyati al-ʿarḍi bi-ʿashri daqāʾiqa.", "id": "Kami masuk ke teater sepuluh menit sebelum pertunjukan dimulai.", "t": 15, "em": "🎭"}, {"n": "2510", "ar": "تُعَالِجُ الْمَسْرَحِيَّةُ قَضِيَّةً اجْتِمَاعِيَّةً بِأُسْلُوبٍ سَاخِرٍ.", "tr": "Tuʿāliju al-masraḥiyyatu qaḍiyyatan ijtimāʿiyyatan bi-uslūbin sākhirin.", "id": "Drama itu mengangkat isu sosial dengan gaya satir.", "t": 15, "em": ""}, {"n": "2511", "ar": "أَعَدْتُ مُشَاهَدَةَ الْمَشْهَدِ الْأَخِيرِ ثَلَاثَ مَرَّاتٍ.", "tr": "Aʿadtu mushāhadata al-mashhadi al-akhīri thalātha marrātin.", "id": "Saya menonton ulang adegan terakhir sebanyak tiga kali.", "t": 15, "em": ""}, {"n": "2512", "ar": "لَا أُحِبُّ أَنْ يُخْبِرَنِي أَحَدٌ بِنِهَايَةِ الْفِيلْمِ قَبْلَ أَنْ أُشَاهِدَهُ.", "tr": "Lā uḥibbu an yukhbiranī aḥadun bi-nihāyati al-fīlmi qabla an ushāhidahu.", "id": "Saya tidak suka ada yang memberi tahu akhir film sebelum saya menontonnya.", "t": 15, "em": "🎬"}, {"n": "2513", "ar": "الْمَوْسِيقَى التَّصْوِيرِيَّةُ تَزِيدُ الْمَشْهَدَ تَأْثِيرًا.", "tr": "Al-mūsīqā at-taṣwīriyyatu tazīdu al-mashhada taʾthīran.", "id": "Musik latar menambah kuat pengaruh adegan.", "t": 15, "em": "🎵"}, {"n": "2514", "ar": "لِمَاذَا يُحِبُّ النَّاسُ أَفْلَامَ الرُّعْبِ مَعَ أَنَّهَا تُخِيفُهُمْ؟", "tr": "Li-mādhā yuḥibbu an-nāsu aflāma ar-ruʿbi maʿa annahā tukhīfuhum?", "id": "Mengapa orang menyukai film horor padahal menakutkan mereka?", "t": 15, "em": "🎬"}, {"n": "2515", "ar": "صُوِّرَ الْفِيلْمُ فِي صَحْرَاءَ بَعِيدَةٍ عَنِ الْمُدُنِ.", "tr": "Ṣuwwira al-fīlmu fī ṣaḥrāʾa baʿīdatin ʿani al-mudūni.", "id": "Film itu dibuat di gurun yang jauh dari kota.", "t": 15, "em": "🎬🏙️"}, {"n": "2516", "ar": "أَعْمَلُ فِي مَجَالِ الْمُوَنْتَاجِ وَأُحِبُّ مَا أَفْعَلُهُ.", "tr": "Aʿmalu fī majāli al-mūntāji wa uḥibbu mā afʿaluhu.", "id": "Saya bekerja di bidang penyuntingan film dan menyukai apa yang saya lakukan.", "t": 15, "em": "🎬"}, {"n": "2517", "ar": "لَا أَتَذَكَّرُ اسْمَ الْمُخْرِجِ لَكِنِّي أَتَذَكَّرُ الْفِكْرَةَ جَيِّدًا.", "tr": "Lā atadhakkaru isma al-mukhriji lākinnī atadhakkaru al-fikrata jayyidan.", "id": "Saya tidak ingat nama sutradaranya, tetapi saya ingat idenya dengan baik.", "t": 15, "em": ""}, {"n": "2518", "ar": "ظَهَرَ الْمُمَثِّلُ الْمَشْهُورُ فِي مُسَلْسَلٍ جَدِيدٍ يُعْرَضُ فِي رَمَضَانَ.", "tr": "Ẓahara al-mumaththilu al-mashhūru fī musalsalin jadīdin yuʿraḍu fī Ramaḍāna.", "id": "Aktor terkenal itu muncul dalam serial baru yang ditayangkan di bulan Ramadan.", "t": 15, "em": "🌙"}, {"n": "2519", "ar": "الصَّدِيقُ الْحَقِيقِيُّ هُوَ مَنْ يَقِفُ بِجَانِبِكَ فِي الشِّدَّةِ.", "tr": "Aṣ-ṣadīqu al-ḥaqīqiyyu huwa man yaqifu bi-jānibika fī ash-shiddati.", "id": "Sahabat sejati adalah yang berdiri di sisimu saat kesulitan.", "t": 16, "em": "🤝"}, {"n": "2520", "ar": "تَحْتَاجُ الصَّدَاقَةُ إِلَى الْوَقْتِ وَالِاهْتِمَامِ لِتَبْقَى.", "tr": "Taḥtāju aṣ-ṣadāqatu ilā al-waqti wal-ihtimāmi li-tabqā.", "id": "Persahabatan membutuhkan waktu dan perhatian agar bertahan.", "t": 16, "em": ""}, {"n": "2521", "ar": "اخْتَلَفْنَا حَوْلَ مَسْأَلَةٍ صَغِيرَةٍ، لَكِنَّنَا تَصَالَحْنَا سَرِيعًا.", "tr": "Ikhtalafnā ḥawla masʾalatin ṣaghīratin, lākinnanā taṣālaḥnā sarīʿan.", "id": "Kami berselisih soal hal kecil, tetapi segera berdamai.", "t": 16, "em": ""}, {"n": "2522", "ar": "لَا أَسْتَطِيعُ أَنْ أَثِقَ بِمَنْ يَكْذِبُ عَلَيَّ حَتَّى فِي الْأَشْيَاءِ الصَّغِيرَةِ.", "tr": "Lā astaṭīʿu an athiqa bi-man yakdhibu ʿalayya ḥattā fī al-ashyāʾi aṣ-ṣaghīrati.", "id": "Saya tidak bisa memercayai orang yang berbohong kepada saya bahkan dalam hal kecil.", "t": 16, "em": ""}, {"n": "2523", "ar": "شَعَرْتُ بِالْوَحْدَةِ بَعْدَ أَنْ سَافَرَ أَقْرَبُ أَصْدِقَائِي.", "tr": "Shaʿartu bil-waḥdati baʿda an sāfara aqrabu aṣdiqāʾī.", "id": "Saya merasa kesepian setelah sahabat terdekat saya pergi.", "t": 16, "em": "🤝"}, {"n": "2524", "ar": "عَلَيْنَا أَنْ نُصَارِحَ بَعْضَنَا بِلُطْفٍ حِينَ نَخْتَلِفُ.", "tr": "ʿAlaynā an nuṣāriḥa baʿḍanā bi-luṭfin ḥīna nakhtalifu.", "id": "Kita harus berterus terang satu sama lain dengan lembut ketika berbeda pendapat.", "t": 16, "em": ""}, {"n": "2525", "ar": "أَشْكُرُكَ لِأَنَّكَ سَمِعْتَنِي حِينَ لَمْ يَسْمَعْنِي أَحَدٌ.", "tr": "Ashkuruka li-annaka samiʿtanī ḥīna lam yasmaʿnī aḥadun.", "id": "Terima kasih karena kamu mendengarkan saya ketika tidak ada orang lain yang mendengar.", "t": 16, "em": ""}, {"n": "2526", "ar": "نَصِلُ إِلَى مَرْحَلَةٍ نُدْرِكُ فِيهَا أَنَّ الْأَصْدِقَاءَ الْقَلِيلِينَ أَفْضَلُ مِنَ الْكَثِيرِينَ.", "tr": "Naṣilu ilā marḥalatin nudriku fīhā anna al-aṣdiqāʾa al-qalīlīna afḍalu mina al-kathīrīna.", "id": "Kita sampai pada tahap menyadari bahwa sedikit sahabat lebih baik daripada banyak.", "t": 16, "em": "🤝"}, {"n": "2527", "ar": "لَمْ أَتَوَقَّعْ أَنْ يَتَغَيَّرَ سُلُوكُهُ مَعِي بَعْدَ الشُّهْرَةِ.", "tr": "Lam atawaqqaʿ an yataghayyara sulūkuhu maʿī baʿda ash-shuhrati.", "id": "Saya tidak menyangka sikapnya terhadap saya berubah setelah terkenal.", "t": 16, "em": ""}, {"n": "2528", "ar": "لَنْ أَنْسَى مَوْقِفَكَ الْجَمِيلَ مَعِي مَا حَيِيتُ.", "tr": "Lan ansā mawqifaka al-jamīla maʿī mā ḥayītu.", "id": "Saya tidak akan melupakan sikap baikmu kepada saya seumur hidup.", "t": 16, "em": ""}, {"n": "2529", "ar": "مِنَ الصَّعْبِ أَنْ نَعْتَذِرَ أَحْيَانًا، لَكِنَّهُ يُنْقِذُ الْعَلَاقَةَ.", "tr": "Mina aṣ-ṣaʿbi an naʿtadhira aḥyānan, lākinnahu yunqidhu al-ʿalāqata.", "id": "Terkadang sulit meminta maaf, tetapi itu menyelamatkan hubungan.", "t": 16, "em": ""}, {"n": "2530", "ar": "هَلْ تَظُنُّ أَنَّ الصَّدَاقَةَ بَيْنَ الرَّجُلِ وَالْمَرْأَةِ مُمْكِنَةٌ؟", "tr": "Hal taẓunnu anna aṣ-ṣadāqata bayna ar-rajuli wal-marʾati mumkinatun?", "id": "Apakah kamu kira persahabatan antara laki-laki dan perempuan itu mungkin?", "t": 16, "em": ""}, {"n": "2531", "ar": "أَنَا مَدِينٌ لَكَ بِالْكَثِيرِ وَلَا أَعْرِفُ كَيْفَ أَرُدُّ الْجَمِيلَ.", "tr": "Anā madīnun laka bil-kathīri wa lā aʿrifu kayfa aruddu al-jamīla.", "id": "Saya berutang banyak kepadamu dan tidak tahu bagaimana membalas kebaikanmu.", "t": 16, "em": ""}, {"n": "2532", "ar": "قَدْ تَبْتَعِدُ الْمَسَافَاتُ بَيْنَنَا لَكِنَّ الْقُلُوبَ تَبْقَى قَرِيبَةً.", "tr": "Qad tabtaʿidu al-masāfātu baynanā lākinna al-qulūba tabqā qarībatan.", "id": "Jarak mungkin memisahkan kita tetapi hati tetap dekat.", "t": 16, "em": ""}, {"n": "2533", "ar": "قَابَلْتُ صَدِيقَ الطُّفُولَةِ بَعْدَ عِشْرِينَ سَنَةً.", "tr": "Qābaltu ṣadīqa aṭ-ṭufūlati baʿda ʿishrīna sanatan.", "id": "Saya bertemu sahabat masa kecil setelah dua puluh tahun.", "t": 16, "em": "🤝"}, {"n": "2534", "ar": "لَا يَقِيسُ الْوَقْتُ الصَّدَاقَةَ، بَلْ تَقِيسُهَا الْمَوَاقِفُ.", "tr": "Lā yaqīsu al-waqtu aṣ-ṣadāqata, bal taqīsuhā al-mawāqifu.", "id": "Waktu tidak mengukur persahabatan, melainkan sikap-sikap yang menguji.", "t": 16, "em": ""}, {"n": "2535", "ar": "أُقَدِّرُ الصَّدِيقَ الَّذِي يَقُولُ لِي الْحَقِيقَةَ وَإِنْ كَانَتْ مُرَّةً.", "tr": "Uqaddiru aṣ-ṣadīqa alladhī yaqūlu lī al-ḥaqīqata wa in kānat murratan.", "id": "Saya menghargai sahabat yang mengatakan kebenaran kepada saya meskipun pahit.", "t": 16, "em": "🤝"}, {"n": "2536", "ar": "لَمْ نَلْتَقِ مُنْذُ سَنَوَاتٍ وَمَعَ ذَلِكَ عَادَتِ الصَّدَاقَةُ كَمَا كَانَتْ.", "tr": "Lam naltaqi mundhu sanawātin wa maʿa dhālika ʿādati aṣ-ṣadāqatu kamā kānat.", "id": "Kami tidak bertemu bertahun-tahun namun persahabatan kembali seperti semula.", "t": 16, "em": ""}, {"n": "2537", "ar": "يَتَعَلَّمُ الطِّفْلُ مِنَ الْقُدْوَةِ أَكْثَرَ مِمَّا يَتَعَلَّمُ مِنَ الْكَلَامِ.", "tr": "Yataʿallamu aṭ-ṭiflu mina al-qudwati akthara mimmā yataʿallamu mina al-kalāmi.", "id": "Anak belajar dari teladan lebih banyak daripada dari perkataan.", "t": 17, "em": "🧒📚"}, {"n": "2538", "ar": "يَجِبُ عَلَى الْوَالِدَيْنِ أَنْ يُخَصِّصَا وَقْتًا لِلْجُلُوسِ مَعَ أَبْنَائِهِمَا.", "tr": "Yajibu ʿalā al-wālidayni an yukhaṣṣiṣā waqtan lil-julūsi maʿa abnāʾihimā.", "id": "Orang tua harus menyediakan waktu untuk duduk bersama anak-anak mereka.", "t": 17, "em": "🧒"}, {"n": "2539", "ar": "لَا أُحِبُّ أَنْ أَقْسُوَ عَلَى أَوْلَادِي، لَكِنَّ الْحَزْمَ ضَرُورِيٌّ أَحْيَانًا.", "tr": "Lā uḥibbu an aqsuwa ʿalā awlādī, lākinna al-ḥazma ḍarūriyyun aḥyānan.", "id": "Saya tidak suka bersikap keras kepada anak-anak saya, tetapi ketegasan kadang diperlukan.", "t": 17, "em": "🧒"}, {"n": "2540", "ar": "كَانَ جَدِّي يَحْكِي لَنَا قِصَصًا قَبْلَ النَّوْمِ كُلَّ لَيْلَةٍ.", "tr": "Kāna jaddī yaḥkī lanā qiṣaṣan qabla an-nawmi kulla laylatin.", "id": "Kakek dulu bercerita kepada kami sebelum tidur setiap malam.", "t": 17, "em": "👴😴"}, {"n": "2541", "ar": "نَحْرِصُ عَلَى أَنْ نَتَنَاوَلَ الْعَشَاءَ مَعًا كُلَّ يَوْمٍ.", "tr": "Naḥriṣu ʿalā an natanāwala al-ʿashāʾa maʿan kulla yawmin.", "id": "Kami berusaha makan malam bersama setiap hari.", "t": 17, "em": "🍲"}, {"n": "2542", "ar": "تَقَعُ عَلَى الْأُمِّ وَالْأَبِ مَسْؤُولِيَّةٌ مُشْتَرَكَةٌ فِي تَرْبِيَةِ الْأَبْنَاءِ.", "tr": "Taqaʿu ʿalā al-ummi wal-abi masʾūliyyatun mushtarakatun fī tarbiyati al-abnāʾi.", "id": "Ibu dan ayah memikul tanggung jawab bersama dalam mendidik anak.", "t": 17, "em": "👩👨"}, {"n": "2543", "ar": "أَتَحَدَّثُ مَعَ ابْنِي عَنْ مَشَاكِلِهِ وَأُصْغِي إِلَيْهِ دُونَ حُكْمٍ.", "tr": "Ataḥaddathu maʿa ibnī ʿan mashākilihi wa uṣghī ilayhi dūna ḥukmin.", "id": "Saya berbicara dengan anak saya tentang masalahnya dan mendengarkannya tanpa menghakimi.", "t": 17, "em": "🧒"}, {"n": "2544", "ar": "كَبِرَ أَبْنَاؤُنَا وَصَارُوا يَعْتَمِدُونَ عَلَى أَنْفُسِهِمْ.", "tr": "Kabira abnāʾunā wa ṣārū yaʿtamidūna ʿalā anfusihim.", "id": "Anak-anak kami sudah besar dan mulai mandiri.", "t": 17, "em": "🧒"}, {"n": "2545", "ar": "عَلَّمَتْنِي أُمِّي أَنَّ الْكَلِمَةَ الطَّيِّبَةَ صَدَقَةٌ.", "tr": "ʿAllamatnī ummī anna al-kalimata aṭ-ṭayyibata ṣadaqatun.", "id": "Ibu saya mengajari saya bahwa kata-kata yang baik adalah sedekah.", "t": 17, "em": "👩"}, {"n": "2546", "ar": "لَمْ نُفَرِّقْ فِي الْمُعَامَلَةِ بَيْنَ الْأَوْلَادِ وَالْبَنَاتِ.", "tr": "Lam nufarriq fī al-muʿāmalati bayna al-awlādi wal-banāti.", "id": "Kami tidak membedakan perlakuan antara anak laki-laki dan perempuan.", "t": 17, "em": "🧒"}, {"n": "2547", "ar": "يَحْتَاجُ الْمُرَاهِقُ إِلَى مَنْ يَفْهَمُهُ لَا إِلَى مَنْ يَأْمُرُهُ.", "tr": "Yaḥtāju al-murāhiqu ilā man yafhamuhu lā ilā man yaʾmuruhu.", "id": "Remaja membutuhkan orang yang memahaminya, bukan yang memerintahnya.", "t": 17, "em": ""}, {"n": "2548", "ar": "يُسَاعِدُنِي إِخْوَتِي فِي رِعَايَةِ وَالِدِي الْمَرِيضِ.", "tr": "Yusāʿidunī ikhwatī fī riʿāyati wālidī al-marīḍi.", "id": "Saudara-saudara saya membantu merawat ayah saya yang sakit.", "t": 17, "em": "🧑‍🤝‍🧑👨"}, {"n": "2549", "ar": "الْبَيْتُ الَّذِي يَسُودُهُ الْحُبُّ يُخَرِّجُ أَبْنَاءً أَصِحَّاءَ نَفْسِيًّا.", "tr": "Al-baytu alladhī yasūduhu al-ḥubbu yukharriju abnāʾan aṣiḥḥāʾa nafsiyyan.", "id": "Rumah yang dipenuhi cinta melahirkan anak-anak yang sehat jiwanya.", "t": 17, "em": "🏠❤️"}, {"n": "2550", "ar": "اتَّفَقْنَا عَلَى قَوَاعِدَ وَاضِحَةٍ لِاسْتِخْدَامِ الْهَوَاتِفِ فِي الْبَيْتِ.", "tr": "Ittafaqnā ʿalā qawāʿida wāḍiḥatin li-istikhdāmi al-hawātifi fī al-bayti.", "id": "Kami menyepakati aturan jelas untuk penggunaan ponsel di rumah.", "t": 17, "em": "📱🏠"}, {"n": "2551", "ar": "أَتَمَنَّى أَنْ أَكُونَ لِأَبْنَائِي الْأَبَ الَّذِي كُنْتُ أَحْتَاجُهُ.", "tr": "Atamannā an akūna li-abnāʾī al-aba alladhī kuntu aḥtājuhu.", "id": "Saya berharap bisa menjadi ayah bagi anak-anak saya seperti yang dulu saya butuhkan.", "t": 17, "em": "👨🧒"}, {"n": "2552", "ar": "يَجِبُ أَلَّا نُقَارِنَ طِفْلًا بِآخَرَ لِأَنَّ لِكُلٍّ مَوَاهِبَهُ.", "tr": "Yajibu allā nuqārina ṭiflan bi-ākhara li-anna li-kullin mawāhibahu.", "id": "Kita tidak boleh membandingkan seorang anak dengan yang lain karena masing-masing punya bakat.", "t": 17, "em": "🧒"}, {"n": "2553", "ar": "الْجُلُوسُ مَعَ الْأَجْدَادِ يُعَلِّمُ الْأَطْفَالَ تَارِيخَ الْعَائِلَةِ وَقِيَمَهَا.", "tr": "Al-julūsu maʿa al-ajdādi yuʿallimu al-aṭfāla tārīkha al-ʿāʾilati wa qiyamahā.", "id": "Duduk bersama kakek-nenek mengajari anak sejarah dan nilai keluarga.", "t": 17, "em": "👴👵"}, {"n": "2554", "ar": "يُسْعِدُنِي أَنْ أَرَى أَبْنَائِي يَتَعَاوَنُونَ فِي أَعْمَالِ الْبَيْتِ.", "tr": "Yusʿidunī an arā abnāʾī yataʿāwanūna fī aʿmāli al-bayti.", "id": "Saya senang melihat anak-anak saya saling membantu dalam pekerjaan rumah.", "t": 17, "em": "😄🧒"}, {"n": "2555", "ar": "زُرْنَا الْمَدِينَةَ الْقَدِيمَةَ وَتَجَوَّلْنَا فِي أَزِقَّتِهَا الضَّيِّقَةِ.", "tr": "Zurnā al-madīnata al-qadīmata wa tajawwalnā fī aziqqatihā aḍ-ḍayyiqati.", "id": "Kami mengunjungi kota tua dan berkeliling di gang-gangnya yang sempit.", "t": 18, "em": "🏙️"}, {"n": "2556", "ar": "تُعَدُّ هَذِهِ الْقَلْعَةُ مِنْ أَهَمِّ الْمَعَالِمِ الْأَثَرِيَّةِ فِي الْمِنْطَقَةِ.", "tr": "Tuʿaddu hādhihi al-qalʿatu min ahammi al-maʿālimi al-athariyyati fī al-minṭaqati.", "id": "Benteng ini dianggap sebagai salah satu situs bersejarah terpenting di kawasan ini.", "t": 18, "em": ""}, {"n": "2557", "ar": "يَجِبُ عَلَيْنَا أَنْ نُحَافِظَ عَلَى الْآثَارِ لِلْأَجْيَالِ الْقَادِمَةِ.", "tr": "Yajibu ʿalaynā an nuḥāfiẓa ʿalā al-āthāri lil-ajyāli al-qādimati.", "id": "Kita harus menjaga peninggalan sejarah untuk generasi mendatang.", "t": 18, "em": ""}, {"n": "2558", "ar": "يَعْرِضُ الْمَتْحَفُ قِطَعًا يَعُودُ تَارِيخُهَا إِلَى أَلْفِ سَنَةٍ.", "tr": "Yaʿriḍu al-matḥafu qiṭaʿan yaʿūdu tārīkhuhā ilā alfi sanatin.", "id": "Museum memamerkan benda-benda yang berasal dari seribu tahun lalu.", "t": 18, "em": "🏛️"}, {"n": "2559", "ar": "اسْتَأْجَرْنَا مُرْشِدًا سِيَاحِيًّا يَشْرَحُ لَنَا تَارِيخَ الْمَكَانِ.", "tr": "Istaʾjarnā murshidan siyāḥiyyan yashraḥu lanā tārīkha al-makāni.", "id": "Kami menyewa pemandu wisata yang menjelaskan sejarah tempat itu.", "t": 18, "em": "🗺️"}, {"n": "2560", "ar": "يُمَيِّزُ هَذِهِ الْمَنْطِقَةَ طِرَازُهَا الْمِعْمَارِيُّ الْفَرِيدُ.", "tr": "Yumayyizu hādhihi al-manṭiqata ṭirāzuhā al-miʿmāriyyu al-farīdu.", "id": "Kawasan ini dibedakan oleh gaya arsitekturnya yang unik.", "t": 18, "em": ""}, {"n": "2561", "ar": "اشْتَرَيْتُ بَعْضَ الْحِرَفِ الْيَدَوِيَّةِ هَدَايَا لِأَصْدِقَائِي.", "tr": "Ishtaraytu baʿḍa al-ḥirafi al-yadawiyyati hadāyā li-aṣdiqāʾī.", "id": "Saya membeli beberapa kerajinan tangan sebagai oleh-oleh untuk teman-teman.", "t": 18, "em": "🛍️✋"}, {"n": "2562", "ar": "تَعَرَّفْنَا عَلَى أَطْعِمَةٍ لَمْ نَذُقْهَا مِنْ قَبْلُ.", "tr": "Taʿarrafnā ʿalā aṭʿimatin lam nadhuqhā min qablu.", "id": "Kami mengenal makanan yang belum pernah kami cicipi sebelumnya.", "t": 18, "em": "🍽️"}, {"n": "2563", "ar": "التُّرَاثُ جُزْءٌ مِنْ هُوِيَّتِنَا وَلَا يَجُوزُ إِهْمَالُهُ.", "tr": "At-turāthu juzʾun min huwiyyatinā wa lā yajūzu ihmāluhu.", "id": "Warisan budaya adalah bagian dari identitas kita dan tidak boleh diabaikan.", "t": 18, "em": ""}, {"n": "2564", "ar": "يَرْتَفِعُ عَدَدُ السُّيَّاحِ فِي الرَّبِيعِ وَتَزْدَحِمُ الْأَمَاكِنُ.", "tr": "Yartafiʿu ʿadadu as-suyyāḥi fī ar-rabīʿi wa tazdaḥimu al-amākinu.", "id": "Jumlah wisatawan meningkat di musim semi dan tempat-tempat menjadi padat.", "t": 18, "em": "🌸"}, {"n": "2565", "ar": "أُرِيدُ أَنْ أَرَى الْمَكَانَ كَمَا يَرَاهُ أَهْلُهُ لَا كَمَا يَرَاهُ السَّائِحُ.", "tr": "Urīdu an arā al-makāna kamā yarāhu ahluhu lā kamā yarāhu as-sāʾiḥu.", "id": "Saya ingin melihat tempat itu seperti penduduknya melihatnya, bukan seperti turis.", "t": 18, "em": ""}, {"n": "2566", "ar": "أُدْرِجَتِ الْمَدِينَةُ عَلَى قَائِمَةِ التُّرَاثِ الْعَالَمِيِّ.", "tr": "Udrijati al-madīnatu ʿalā qāʾimati at-turāthi al-ʿālamiyyi.", "id": "Kota itu dimasukkan dalam daftar warisan dunia.", "t": 18, "em": "🏙️"}, {"n": "2567", "ar": "يُقَامُ فِي الصَّيْفِ مِهْرَجَانٌ يَعْرِضُ الْفُنُونَ الشَّعْبِيَّةَ.", "tr": "Yuqāmu fī aṣ-ṣayfi mihrajānun yaʿriḍu al-funūna ash-shaʿbiyyata.", "id": "Pada musim panas diadakan festival yang menampilkan seni rakyat.", "t": 18, "em": "☀️🎨"}, {"n": "2568", "ar": "الرِّحْلَةُ لَيْسَتْ زِيَارَةَ أَمَاكِنَ فَقَطْ، بَلْ تَعَلُّمُ ثَقَافَاتٍ.", "tr": "Ar-riḥlatu laysat ziyārata amākina faqaṭ, bal taʿallumu thaqāfātin.", "id": "Perjalanan bukan sekadar mengunjungi tempat, tetapi mempelajari budaya.", "t": 18, "em": "🧳"}, {"n": "2569", "ar": "قَامَ الْفَنَّانُونَ بِتَرْمِيمِ الْجِدَارِيَّاتِ الْقَدِيمَةِ بِعِنَايَةٍ شَدِيدَةٍ.", "tr": "Qāma al-fannānūna bi-tarmīmi al-jidāriyyāti al-qadīmati bi-ʿināyatin shadīdatin.", "id": "Para seniman merestorasi lukisan dinding kuno dengan sangat hati-hati.", "t": 18, "em": "🖼️"}, {"n": "2570", "ar": "حَجَزْنَا نُزُلًا تَقْلِيدِيًّا فِي قَلْبِ الْبَلْدَةِ الْقَدِيمَةِ.", "tr": "Ḥajaznā nuzulan taqlīdiyyan fī qalbi al-baldati al-qadīmati.", "id": "Kami memesan penginapan tradisional di jantung kota tua.", "t": 18, "em": "❤️🏙️"}, {"n": "2571", "ar": "زِيَارَةُ الْمَتَاحِفِ تُعَلِّمُنَا أَكْثَرَ مِمَّا نَقْرَأُ فِي الْكُتُبِ.", "tr": "Ziyāratu al-matāḥifi tuʿallimunā akthara mimmā naqraʾu fī al-kutubi.", "id": "Mengunjungi museum mengajari kita lebih banyak daripada yang kita baca di buku.", "t": 18, "em": "🏛️📖"}, {"n": "2572", "ar": "أَكْتُبُ مُذَكِّرَاتِي كُلَّ مَسَاءٍ لِأُرَتِّبَ أَفْكَارِي.", "tr": "Aktubu mudhakkirātī kulla masāʾin li-urattiba afkārī.", "id": "Saya menulis catatan harian setiap malam untuk menata pikiran.", "t": 19, "em": "✍️🌙"}, {"n": "2573", "ar": "أَصْعَبُ جُمْلَةٍ فِي أَيِّ مَقَالٍ هِيَ الْجُمْلَةُ الْأُولَى.", "tr": "Aṣʿabu jumlatin fī ayyi maqālin hiya al-jumlatu al-ūlā.", "id": "Kalimat tersulit dalam artikel apa pun adalah kalimat pertama.", "t": 19, "em": ""}, {"n": "2574", "ar": "يَجِبُ أَنْ تَكُونَ لُغَةُ الْمَقَالِ وَاضِحَةً وَمُبَاشِرَةً.", "tr": "Yajibu an takūna lughatu al-maqāli wāḍiḥatan wa mubāsharatan.", "id": "Bahasa artikel harus jelas dan langsung.", "t": 19, "em": "🗣️"}, {"n": "2575", "ar": "أُعِيدُ قِرَاءَةَ مَا كَتَبْتُ مَرَّتَيْنِ قَبْلَ أَنْ أُرْسِلَهُ.", "tr": "Uʿīdu qirāʾata mā katabtu marratayni qabla an ursilahu.", "id": "Saya membaca ulang apa yang saya tulis dua kali sebelum mengirimnya.", "t": 19, "em": "📖"}, {"n": "2576", "ar": "الْقِصَّةُ الْجَيِّدَةُ تَبْدَأُ بِشَخْصِيَّةٍ لَهَا هَدَفٌ وَعَقَبَةٌ.", "tr": "Al-qiṣṣatu al-jayyidatu tabdaʾu bi-shakhṣiyyatin lahā hadafun wa ʿaqabatun.", "id": "Cerita yang baik dimulai dari tokoh yang punya tujuan dan rintangan.", "t": 19, "em": ""}, {"n": "2577", "ar": "لَا تَكْتُبْ لِتُعْجِبَ النَّاسَ، بَلِ اكْتُبْ لِتَقُولَ مَا تُؤْمِنُ بِهِ.", "tr": "Lā taktub li-tuʿjiba an-nāsa, bali uktub li-taqūla mā tuʾminu bihi.", "id": "Jangan menulis untuk menyenangkan orang, tulislah untuk mengatakan apa yang kamu yakini.", "t": 19, "em": "✍️"}, {"n": "2578", "ar": "الْكِتَابَةُ مَهَارَةٌ تَتَحَسَّنُ بِالْمُمَارَسَةِ الْيَوْمِيَّةِ.", "tr": "Al-kitābatu mahāratun tataḥassanu bil-mumārasati al-yawmiyyati.", "id": "Menulis adalah keterampilan yang membaik dengan latihan harian.", "t": 19, "em": "✍️"}, {"n": "2579", "ar": "اسْتَخْدَمْتُ الِاسْتِعَارَةَ لِأُقَرِّبَ الْفِكْرَةَ مِنَ الْقَارِئِ.", "tr": "Istakhdamtu al-istiʿārata li-uqarriba al-fikrata mina al-qāriʾi.", "id": "Saya memakai metafora untuk mendekatkan gagasan kepada pembaca.", "t": 19, "em": ""}, {"n": "2580", "ar": "تَرَدَّدْتُ كَثِيرًا قَبْلَ أَنْ أَنْشُرَ مَقَالِي الْأَوَّلَ.", "tr": "Taraddadtu kathīran qabla an anshura maqālī al-awwala.", "id": "Saya sangat ragu sebelum menerbitkan artikel pertama saya.", "t": 19, "em": ""}, {"n": "2581", "ar": "يُسَاعِدُنِي الرَّسْمُ عَلَى التَّعْبِيرِ حِينَ تَعْجِزُ الْكَلِمَاتُ.", "tr": "Yusāʿidunī ar-rasmu ʿalā at-taʿbīri ḥīna taʿjizu al-kalimātu.", "id": "Menggambar membantu saya mengungkapkan diri ketika kata-kata tidak cukup.", "t": 19, "em": ""}, {"n": "2582", "ar": "أَطْلُبُ مِنْ صَدِيقٍ أَنْ يَقْرَأَ نَصِّي وَيُعْطِيَنِي رَأْيَهُ بِصَرَاحَةٍ.", "tr": "Aṭlubu min ṣadīqin an yaqraʾa naṣṣī wa yuʿṭiyanī raʾyahu bi-ṣarāḥatin.", "id": "Saya meminta seorang teman membaca tulisan saya dan memberi pendapat jujur.", "t": 19, "em": "🧑‍🤝‍🧑📖"}, {"n": "2583", "ar": "الْخُلَاصَةُ تُلَخِّصُ الْفِكْرَةَ الرَّئِيسِيَّةَ وَلَا تَأْتِي بِجَدِيدٍ.", "tr": "Al-khulāṣatu tulakhkhiṣu al-fikrata ar-raʾīsiyyata wa lā taʾtī bi-jadīdin.", "id": "Kesimpulan meringkas gagasan utama dan tidak membawa hal baru.", "t": 19, "em": ""}, {"n": "2584", "ar": "كَتَبْتُ رِسَالَةً لِصَدِيقٍ قَدِيمٍ وَشَعَرْتُ بِرَاحَةٍ كَبِيرَةٍ.", "tr": "Katabtu risālatan li-ṣadīqin qadīmin wa shaʿartu bi-rāḥatin kabīratin.", "id": "Saya menulis surat kepada sahabat lama dan merasa sangat lega.", "t": 19, "em": "✍️✉️"}, {"n": "2585", "ar": "الْأَدَبُ يُعَلِّمُنَا أَنْ نَرَى الْعَالَمَ بِعُيُونِ غَيْرِنَا.", "tr": "Al-adabu yuʿallimunā an narā al-ʿālama bi-ʿuyūni ghayrinā.", "id": "Sastra mengajari kita melihat dunia dengan mata orang lain.", "t": 19, "em": "👁️"}, {"n": "2586", "ar": "أَحْتَاجُ إِلَى وَقْتٍ لِلتَّفْكِيرِ قَبْلَ أَنْ أَكْتُبَ.", "tr": "Aḥtāju ilā waqtin lit-tafkīri qabla an aktuba.", "id": "Saya butuh waktu berpikir sebelum menulis.", "t": 19, "em": "✍️"}, {"n": "2587", "ar": "الْقِرَاءَةُ الْوَاسِعَةُ تُغْنِي أُسْلُوبَ الْكَاتِبِ وَتُوَسِّعُ خَيَالَهُ.", "tr": "Al-qirāʾatu al-wāsiʿatu tughnī uslūba al-kātibi wa tuwassiʿu khayālahu.", "id": "Membaca luas memperkaya gaya penulis dan memperluas imajinasinya.", "t": 19, "em": "📖"}, {"n": "2588", "ar": "الْعُنْوَانُ الْجَيِّدُ يَجْذِبُ الْقَارِئَ وَيَخْتَصِرُ الْفِكْرَةَ.", "tr": "Al-ʿunwānu al-jayyidu yajdhibu al-qāriʾa wa yakhtaṣiru al-fikrata.", "id": "Judul yang baik menarik pembaca dan meringkas gagasan.", "t": 19, "em": ""}, {"n": "2589", "ar": "بَعْدَ أَنْ أَنْهَيْتُ الْمُسَوَّدَةَ تَرَكْتُهَا يَوْمًا ثُمَّ عُدْتُ إِلَيْهَا بِعَيْنٍ جَدِيدَةٍ.", "tr": "Baʿda an anhaytu al-musawwadata taraktuhā yawman thumma ʿudtu ilayhā bi-ʿaynin jadīdatin.", "id": "Setelah selesai draf, saya meninggalkannya sehari lalu kembali dengan mata segar.", "t": 19, "em": "👁️"}, {"n": "2590", "ar": "يَصِفُ الْكَاتِبُ الْمَشْهَدَ بِتَفَاصِيلَ تَجْعَلُكَ تَرَاهُ بِعَيْنَيْكَ.", "tr": "Yaṣifu al-kātibu al-mashhada bi-tafāṣīla tajʿaluka tarāhu bi-ʿaynayka.", "id": "Penulis menggambarkan adegan dengan detail yang membuatmu seolah melihatnya.", "t": 19, "em": ""}, {"n": "2591", "ar": "أَحْتَفِظُ بِدَفْتَرٍ صَغِيرٍ لِأُدَوِّنَ الْأَفْكَارَ الَّتِي تَخْطُرُ عَلَى بَالِي.", "tr": "Aḥtafiẓu bi-daftarin ṣaghīrin li-udawwina al-afkāra allatī takhṭuru ʿalā bālī.", "id": "Saya menyimpan buku kecil untuk mencatat ide yang terlintas di benak.", "t": 19, "em": "📖"}, {"n": "2592", "ar": "يَعْتَمِدُ الْعِلْمُ عَلَى الْمُلَاحَظَةِ وَالتَّجْرِبَةِ لَا عَلَى التَّخْمِينِ.", "tr": "Yaʿtamidu al-ʿilmu ʿalā al-mulāḥaẓati wat-tajribati lā ʿalā at-takhmīni.", "id": "Sains bergantung pada pengamatan dan percobaan, bukan dugaan.", "t": 20, "em": "🔬"}, {"n": "2593", "ar": "اكْتَشَفَ الْعُلَمَاءُ نَوْعًا جَدِيدًا مِنَ الْكَائِنَاتِ فِي أَعْمَاقِ الْمُحِيطِ.", "tr": "Iktashafa al-ʿulamāʾu nawʿan jadīdan mina al-kāʾināti fī aʿmāqi al-muḥīṭi.", "id": "Para ilmuwan menemukan jenis makhluk baru di kedalaman samudra.", "t": 20, "em": ""}, {"n": "2594", "ar": "يَحْتَاجُ الْبَاحِثُ إِلَى صَبْرٍ كَبِيرٍ لِأَنَّ النَّتَائِجَ لَا تَأْتِي سَرِيعًا.", "tr": "Yaḥtāju al-bāḥithu ilā ṣabrin kabīrin li-anna an-natāʾija lā taʾtī sarīʿan.", "id": "Peneliti membutuhkan kesabaran besar karena hasil tidak datang cepat.", "t": 20, "em": ""}, {"n": "2595", "ar": "لَقَدْ غَيَّرَ اكْتِشَافُ الْكَهْرَبَاءِ حَيَاةَ الْبَشَرِ تَمَامًا.", "tr": "Laqad ghayyara iktishāfu al-kahrabāʾi ḥayāta al-bashari tamāman.", "id": "Penemuan listrik telah mengubah hidup manusia sepenuhnya.", "t": 20, "em": ""}, {"n": "2596", "ar": "نَشَرَ الْفَرِيقُ نَتَائِجَ بَحْثِهِ فِي مَجَلَّةٍ عِلْمِيَّةٍ مُحَكَّمَةٍ.", "tr": "Nashara al-farīqu natāʾija baḥthihi fī majallatin ʿilmiyyatin muḥakkamatin.", "id": "Tim itu menerbitkan hasil penelitiannya di jurnal ilmiah yang ditelaah sejawat.", "t": 20, "em": "👥🔬"}, {"n": "2597", "ar": "لِكُلِّ ظَاهِرَةٍ سَبَبٌ، وَمَهَمَّةُ الْعِلْمِ أَنْ يَكْشِفَهُ.", "tr": "Li-kulli ẓāhiratin sababun, wa mahammatu al-ʿilmi an yakshifahu.", "id": "Setiap gejala ada sebabnya, dan tugas sains adalah mengungkapnya.", "t": 20, "em": "🔬"}, {"n": "2598", "ar": "يَدْرُسُ الْفَلَكِيُّونَ حَرَكَةَ الْكَوَاكِبِ مُنْذُ آلَافِ السِّنِينَ.", "tr": "Yadrusu al-falakiyyūna ḥarakata al-kawākibi mundhu ālāfi as-sinīna.", "id": "Para astronom mempelajari gerak planet sejak ribuan tahun.", "t": 20, "em": ""}, {"n": "2599", "ar": "لَا بُدَّ مِنَ التَّأَكُّدِ مِنَ الْفَرَضِيَّةِ قَبْلَ تَعْمِيمِ النَّتِيجَةِ.", "tr": "Lā budda mina at-taʾakkudi mina al-farḍiyyati qabla taʿmīmi an-natījati.", "id": "Hipotesis harus diuji sebelum hasilnya digeneralisasi.", "t": 20, "em": ""}, {"n": "2600", "ar": "سَاعَدَ الْمِجْهَرُ عَلَى رُؤْيَةِ عَالَمٍ كَانَ مَخْفِيًّا عَنَّا.", "tr": "Sāʿada al-mijharu ʿalā ruʾyati ʿālamin kāna makhfiyyan ʿannā.", "id": "Mikroskop membantu melihat dunia yang tadinya tersembunyi dari kita.", "t": 20, "em": ""}, {"n": "2601", "ar": "يُفَرِّقُ الْعِلْمُ بَيْنَ الْوَاقِعِ وَالْأُسْطُورَةِ بِالدَّلِيلِ.", "tr": "Yufarriqu al-ʿilmu bayna al-wāqiʿi wal-usṭūrati bid-dalīli.", "id": "Sains membedakan antara kenyataan dan mitos dengan bukti.", "t": 20, "em": "🔬"}, {"n": "2602", "ar": "تُسَاهِمُ الْأَبْحَاثُ فِي إِيجَادِ عِلَاجَاتٍ لِأَمْرَاضٍ كَانَتْ مُسْتَعْصِيَةً.", "tr": "Tusāhimu al-abḥāthu fī ījādi ʿilājātin li-amrāḍin kānat mustaʿṣiyatan.", "id": "Penelitian berkontribusi menemukan pengobatan bagi penyakit yang dulu sulit disembuhkan.", "t": 20, "em": "🔬"}, {"n": "2603", "ar": "أَمْضَيْتُ سَنَتَيْنِ فِي الْمُخْتَبَرِ قَبْلَ أَنْ أَحْصُلَ عَلَى نَتِيجَةٍ وَاحِدَةٍ.", "tr": "Amḍaytu sanatayni fī al-mukhtabari qabla an aḥṣula ʿalā natījatin wāḥidatin.", "id": "Saya menghabiskan dua tahun di laboratorium sebelum mendapat satu hasil.", "t": 20, "em": ""}, {"n": "2604", "ar": "هُنَاكَ فَرْقٌ بَيْنَ الِارْتِبَاطِ وَالسَّبَبِيَّةِ فِي الْإِحْصَاءِ.", "tr": "Hunāka farqun bayna al-irtibāṭi was-sababiyyati fī al-iḥṣāʾi.", "id": "Ada perbedaan antara korelasi dan sebab-akibat dalam statistik.", "t": 20, "em": ""}, {"n": "2605", "ar": "يَسْتَطِيعُ الْقَمَرُ الصِّنَاعِيُّ أَنْ يُصَوِّرَ الْأَرْضَ مِنَ الْفَضَاءِ.", "tr": "Yastaṭīʿu al-qamaru aṣ-ṣināʿiyyu an yuṣawwira al-arḍa mina al-faḍāʾi.", "id": "Satelit dapat memotret bumi dari antariksa.", "t": 20, "em": "🌍"}, {"n": "2606", "ar": "كُلُّ اكْتِشَافٍ جَدِيدٍ يَفْتَحُ أَسْئِلَةً أَكْثَرَ مِمَّا يُجِيبُ.", "tr": "Kullu iktishāfin jadīdin yaftaḥu asʾilatan akthara mimmā yujību.", "id": "Setiap penemuan baru membuka lebih banyak pertanyaan daripada jawaban.", "t": 20, "em": ""}, {"n": "2607", "ar": "يُمْكِنُنَا أَنْ نَتَعَلَّمَ كَثِيرًا مِنْ مُلَاحَظَةِ الطَّبِيعَةِ.", "tr": "Yumkinunā an nataʿallama kathīran min mulāḥaẓati aṭ-ṭabīʿati.", "id": "Kita bisa belajar banyak dari mengamati alam.", "t": 20, "em": "📚🌿"}, {"n": "2608", "ar": "يُنْقِذُ التَّطْعِيمُ حَيَاةَ الْمَلَايِينِ كُلَّ عَامٍ.", "tr": "Yunqidhu at-taṭʿīmu ḥayāta al-malāyīni kulla ʿāmin.", "id": "Vaksinasi menyelamatkan nyawa jutaan orang setiap tahun.", "t": 20, "em": ""}, {"n": "2609", "ar": "تُفِيدُنَا نَظَرِيَّاتُ الْعُلَمَاءِ فِي فَهْمِ الْكَوْنِ حَتَّى إِنْ لَمْ نُدْرِكْ فَائِدَتَهَا فَوْرًا.", "tr": "Tufīdunā naẓariyyātu al-ʿulamāʾi fī fahmi al-kawni ḥattā in lam nudrik fāʾidatahā fawran.", "id": "Teori para ilmuwan bermanfaat bagi kita dalam memahami alam semesta meskipun manfaatnya tidak segera tampak.", "t": 20, "em": "🌿"}, {"n": "2610", "ar": "يَعْتَمِدُ اقْتِصَادُ الْمِنْطَقَةِ عَلَى الزِّرَاعَةِ وَتَرْبِيَةِ الْمَوَاشِي.", "tr": "Yaʿtamidu iqtiṣādu al-minṭaqati ʿalā az-zirāʿati wa tarbiyati al-mawāshī.", "id": "Ekonomi kawasan itu bergantung pada pertanian dan peternakan.", "t": 21, "em": "📊🌾"}, {"n": "2611", "ar": "يَسْتَخْدِمُ الْمُزَارِعُونَ تَقْنِيَاتٍ حَدِيثَةً لِتَوْفِيرِ الْمَاءِ فِي الرَّيِّ.", "tr": "Yastakhdimu al-muzāriʿūna taqniyyātin ḥadīthatan li-tawfīri al-māʾi fī ar-rayyi.", "id": "Para petani menggunakan teknologi modern untuk menghemat air irigasi.", "t": 21, "em": "💧"}, {"n": "2612", "ar": "بَدَأَ الْمَصْنَعُ الْجَدِيدُ إِنْتَاجَهُ الْأُسْبُوعَ الْمَاضِيَ.", "tr": "Badaʾa al-maṣnaʿu al-jadīdu intājahu al-usbūʿa al-māḍiya.", "id": "Pabrik baru mulai berproduksi minggu lalu.", "t": 21, "em": "🏭📅"}, {"n": "2613", "ar": "تَجِبُ مُرَاقَبَةُ الْجَوْدَةِ فِي كُلِّ مَرْحَلَةٍ مِنَ التَّصْنِيعِ.", "tr": "Tajibu murāqabatu al-jawdati fī kulli marḥalatin mina at-taṣnīʿi.", "id": "Mutu harus diawasi di setiap tahap manufaktur.", "t": 21, "em": ""}, {"n": "2614", "ar": "حَصَدَ الْفَلَّاحُونَ الْقَمْحَ فِي نِهَايَةِ الصَّيْفِ.", "tr": "Ḥaṣada al-fallāḥūna al-qamḥa fī nihāyati aṣ-ṣayfi.", "id": "Para petani memanen gandum di akhir musim panas.", "t": 21, "em": "☀️"}, {"n": "2615", "ar": "تَسْعَى الدَّوْلَةُ إِلَى تَحْقِيقِ الِاكْتِفَاءِ الذَّاتِيِّ مِنَ الْغِذَاءِ.", "tr": "Tasʿā ad-dawlatu ilā taḥqīqi al-iktifāʾi adh-dhātiyyi mina al-ghidhāʾi.", "id": "Negara berupaya mencapai swasembada pangan.", "t": 21, "em": ""}, {"n": "2616", "ar": "الزِّرَاعَةُ الْعُضْوِيَّةُ تَسْتَخْدِمُ مَوَادَّ طَبِيعِيَّةً بَدَلًا مِنَ الْكِيمَاوِيَّاتِ.", "tr": "Az-zirāʿatu al-ʿuḍwiyyatu tastakhdimu mawādda ṭabīʿiyyatan badalan mina al-kīmāwiyyāti.", "id": "Pertanian organik memakai bahan alami sebagai ganti bahan kimia.", "t": 21, "em": "🌾"}, {"n": "2617", "ar": "تُصَدِّرُ الْبِلَادُ مُنْتَجَاتِهَا إِلَى أَكْثَرَ مِنْ ثَلَاثِينَ دَوْلَةً.", "tr": "Tuṣaddiru al-bilādu muntajātihā ilā akthara min thalāthīna dawlatan.", "id": "Negara itu mengekspor produknya ke lebih dari tiga puluh negara.", "t": 21, "em": ""}, {"n": "2618", "ar": "يَعْمَلُ الْعُمَّالُ فِي الْمَصْنَعِ عَلَى ثَلَاثِ نَوْبَاتٍ.", "tr": "Yaʿmalu al-ʿummālu fī al-maṣnaʿi ʿalā thalāthi nawbātin.", "id": "Para pekerja di pabrik bekerja dalam tiga sif.", "t": 21, "em": "🏭"}, {"n": "2619", "ar": "تُوَفِّرُ الْمَشَارِيعُ الزِّرَاعِيَّةُ الصَّغِيرَةُ فُرَصَ عَمَلٍ لِلشَّبَابِ فِي الْأَرْيَافِ.", "tr": "Tuwaffiru al-mashārīʿu az-zirāʿiyyatu aṣ-ṣaghīratu furaṣa ʿamalin lish-shababi fī al-aryāfi.", "id": "Proyek pertanian kecil menyediakan lapangan kerja bagi pemuda di pedesaan.", "t": 21, "em": "🌾🏟️"}, {"n": "2620", "ar": "اضْطُرَّ الْمَصْنَعُ إِلَى الْإِغْلَاقِ بِسَبَبِ نَقْصِ الْمَوَادِّ الْخَامِّ.", "tr": "Uḍṭurra al-maṣnaʿu ilā al-ighlāqi bi-sababi naqṣi al-mawādi al-khāmmi.", "id": "Pabrik terpaksa tutup karena kekurangan bahan baku.", "t": 21, "em": "🏭"}, {"n": "2621", "ar": "يَقُومُ الْمُهَنْدِسُ الزِّرَاعِيُّ بِفَحْصِ التُّرْبَةِ قَبْلَ الزِّرَاعَةِ.", "tr": "Yaqūmu al-muhandisu az-zirāʿiyyu bi-faḥṣi at-turbati qabla az-zirāʿati.", "id": "Insinyur pertanian memeriksa tanah sebelum bercocok tanam.", "t": 21, "em": "👷🌾"}, {"n": "2622", "ar": "تَرْتَفِعُ تَكَالِيفُ الْإِنْتَاجِ حِينَ تَرْتَفِعُ أَسْعَارُ الطَّاقَةِ.", "tr": "Tartafiʿu takālīfu al-intāji ḥīna tartafiʿu asʿāru aṭ-ṭāqati.", "id": "Biaya produksi naik ketika harga energi naik.", "t": 21, "em": "🏷️⚡"}, {"n": "2623", "ar": "الصِّنَاعَاتُ الْيَدَوِيَّةُ تُحَافِظُ عَلَى الْهُوِيَّةِ وَتَدُرُّ دَخْلًا.", "tr": "Aṣ-ṣināʿātu al-yadawiyyatu tuḥāfiẓu ʿalā al-huwiyyati wa tadurru dakhlan.", "id": "Kerajinan tangan menjaga identitas dan mendatangkan penghasilan.", "t": 21, "em": "✋"}, {"n": "2624", "ar": "يَسْقِي الْمُزَارِعُ أَرْضَهُ فَجْرًا لِيَتَجَنَّبَ حَرَارَةَ النَّهَارِ.", "tr": "Yasqī al-muzāriʿu arḍahu fajran li-yatajannaba ḥarārata an-nahāri.", "id": "Petani menyirami tanahnya di waktu fajar untuk menghindari panas siang.", "t": 21, "em": "☀️🌞"}, {"n": "2625", "ar": "يَتَطَلَّبُ تَحْدِيثُ الْمَصَانِعِ تَدْرِيبَ الْعُمَّالِ عَلَى الْآلَاتِ الْجَدِيدَةِ.", "tr": "Yataṭallabu taḥdīthu al-maṣāniʿi tadrība al-ʿummāli ʿalā al-ālāti al-jadīdati.", "id": "Modernisasi pabrik membutuhkan pelatihan pekerja pada mesin-mesin baru.", "t": 21, "em": "🏭"}, {"n": "2626", "ar": "تُسَاعِدُ التَّعَاوُنِيَّاتُ الزِّرَاعِيَّةُ الْمُزَارِعِينَ عَلَى بَيْعِ مَحَاصِيلِهِمْ بِسِعْرٍ عَادِلٍ.", "tr": "Tusāʿidu at-taʿāwuniyyātu az-zirāʿiyyatu al-muzāriʿīna ʿalā bayʿi maḥāṣīlihim bi-siʿrin ʿādilin.", "id": "Koperasi pertanian membantu petani menjual hasil panen dengan harga adil.", "t": 21, "em": "🌾🏷️"}, {"n": "2627", "ar": "اسْتَوْرَدَتِ الدَّوْلَةُ كَمِّيَّاتٍ كَبِيرَةً مِنَ الْأَرُزِّ هَذَا الْعَامَ.", "tr": "Istawradat ad-dawlatu kammiyyātin kabīratan mina al-aruzzi hādhā al-ʿāma.", "id": "Negara mengimpor beras dalam jumlah besar tahun ini.", "t": 21, "em": ""}, {"n": "2628", "ar": "يُرَاعِي الْمَصْنَعُ مَعَايِيرَ السَّلَامَةِ لِحِمَايَةِ الْعَامِلِينَ.", "tr": "Yurāʿī al-maṣnaʿu maʿāyīra as-salāmati li-ḥimāyati al-ʿāmilīna.", "id": "Pabrik memperhatikan standar keselamatan untuk melindungi pekerja.", "t": 21, "em": "🏭"}, {"n": "2629", "ar": "بَدَأْتُ مَشْرُوعِي الصَّغِيرَ بِمَبْلَغٍ بَسِيطٍ وَفِكْرَةٍ وَاضِحَةٍ.", "tr": "Badaʾtu mashrūʿī aṣ-ṣaghīra bi-mablaghin basīṭin wa fikratin wāḍiḥatin.", "id": "Saya memulai usaha kecil dengan modal sederhana dan ide yang jelas.", "t": 22, "em": ""}, {"n": "2630", "ar": "الْفِكْرَةُ الْجَيِّدَةُ لَا تَكْفِي دُونَ تَنْفِيذٍ صَحِيحٍ.", "tr": "Al-fikratu al-jayyidatu lā takfī dūna tanfīdhin ṣaḥīḥin.", "id": "Ide bagus saja tidak cukup tanpa pelaksanaan yang tepat.", "t": 22, "em": ""}, {"n": "2631", "ar": "عَلَيْكَ أَنْ تَدْرُسَ السُّوقَ جَيِّدًا قَبْلَ أَنْ تُطْلِقَ مُنْتَجَكَ.", "tr": "ʿAlayka an tadrusa as-sūqa jayyidan qabla an tuṭliqa muntajaka.", "id": "Kamu harus mempelajari pasar dengan baik sebelum meluncurkan produkmu.", "t": 22, "em": "🛒"}, {"n": "2632", "ar": "لَا تَخَفْ مِنَ الْفَشَلِ، فَهُوَ مُعَلِّمٌ جَيِّدٌ لِرَائِدِ الْأَعْمَالِ.", "tr": "Lā takhaf mina al-fashali, fa-huwa muʿallimun jayyidun li-rāʾidi al-aʿmāli.", "id": "Jangan takut gagal, sebab ia guru yang baik bagi pengusaha.", "t": 22, "em": "😨👨‍🏫"}, {"n": "2633", "ar": "الْمُسْتَثْمِرُ يَبْحَثُ عَنْ فَرِيقٍ قَوِيٍّ أَكْثَرَ مِمَّا يَبْحَثُ عَنْ فِكْرَةٍ.", "tr": "Al-mustathmiru yabḥathu ʿan farīqin qawiyyin akthara mimmā yabḥathu ʿan fikratin.", "id": "Investor mencari tim yang kuat lebih daripada mencari ide.", "t": 22, "em": "🔍👥"}, {"n": "2634", "ar": "رَاجَعْنَا خُطَّةَ الْعَمَلِ وَعَدَّلْنَا الْمِيزَانِيَّةَ.", "tr": "Rājaʿnā khuṭṭata al-ʿamali wa ʿaddalnā al-mīzāniyyata.", "id": "Kami meninjau rencana bisnis dan menyesuaikan anggaran.", "t": 22, "em": ""}, {"n": "2635", "ar": "الْعَمِيلُ الرَّاضِي هُوَ أَفْضَلُ إِعْلَانٍ لِأَيِّ مَشْرُوعٍ.", "tr": "Al-ʿamīlu ar-rāḍī huwa afḍalu iʿlānin li-ayyi mashrūʿin.", "id": "Pelanggan yang puas adalah iklan terbaik bagi usaha apa pun.", "t": 22, "em": "📣"}, {"n": "2636", "ar": "لَمْ أَتَوَقَّعْ أَنْ يَنْمُوَ مَشْرُوعِي بِهَذِهِ السُّرْعَةِ.", "tr": "Lam atawaqqaʿ an yanmuwa mashrūʿī bi-hādhihi as-surʿati.", "id": "Saya tidak menyangka usaha saya berkembang secepat ini.", "t": 22, "em": ""}, {"n": "2637", "ar": "نَحْتَاجُ إِلَى شَرِيكٍ يُكَمِّلُ نَقَاطَ ضَعْفِنَا.", "tr": "Naḥtāju ilā sharīkin yukammilu niqāṭa ḍaʿfinā.", "id": "Kami membutuhkan mitra yang melengkapi kelemahan kami.", "t": 22, "em": ""}, {"n": "2638", "ar": "أَصْعَبُ مَا فِي الْبِدَايَةِ هُوَ جَذْبُ الْعُمَلَاءِ الْأَوَائِلِ.", "tr": "Aṣʿabu mā fī al-bidāyati huwa jadhbu al-ʿumalāʾi al-awāʾili.", "id": "Yang tersulit di awal adalah menarik pelanggan-pelanggan pertama.", "t": 22, "em": ""}, {"n": "2639", "ar": "نَحْنُ نُوَازِنُ بَيْنَ النُّمُوِّ السَّرِيعِ وَالِاسْتِدَامَةِ.", "tr": "Naḥnu nuwāzinu bayna an-numuwwi as-sarīʿi wal-istidāmati.", "id": "Kami menyeimbangkan antara pertumbuhan cepat dan keberlanjutan.", "t": 22, "em": ""}, {"n": "2640", "ar": "تَوَقَّفْتُ عَنِ الْعَمَلِ لِدَى الْآخَرِينَ لِأُدِيرَ مَشْرُوعِي الْخَاصَّ.", "tr": "Tawaqqaftu ʿani al-ʿamali ladā al-ākharīna li-udīra mashrūʿī al-khāṣṣa.", "id": "Saya berhenti bekerja pada orang lain untuk mengelola usaha saya sendiri.", "t": 22, "em": ""}, {"n": "2641", "ar": "مِنَ الْمُهِمِّ أَنْ نَسْتَمِعَ إِلَى شَكَاوَى الْعُمَلَاءِ وَنَتَعَلَّمَ مِنْهَا.", "tr": "Mina al-muhimmi an nastamiʿa ilā shakāwā al-ʿumalāʾi wa nataʿallama minhā.", "id": "Penting bagi kita mendengarkan keluhan pelanggan dan belajar darinya.", "t": 22, "em": "📚"}, {"n": "2642", "ar": "نَحْتَاجُ إِلَى مَوْقِعٍ إِلِكْتُرُونِيٍّ احْتِرَافِيٍّ يَعْرِضُ مُنْتَجَاتِنَا.", "tr": "Naḥtāju ilā mawqiʿin iliktrūniyyin iḥtirāfiyyin yaʿriḍu muntajātinā.", "id": "Kami butuh situs web profesional yang menampilkan produk kami.", "t": 22, "em": ""}, {"n": "2643", "ar": "تَعَلَّمْتُ أَنَّ الْمُرُونَةَ أَهَمُّ مِنَ الْخُطَّةِ الْمِثَالِيَّةِ.", "tr": "Taʿallamtu anna al-murūnata ahammu mina al-khuṭṭati al-mithāliyyati.", "id": "Saya belajar bahwa fleksibilitas lebih penting daripada rencana sempurna.", "t": 22, "em": "📚"}, {"n": "2644", "ar": "بِفَضْلِ دَعْمِ عَائِلَتِي اسْتَطَعْتُ أَنْ أُوَاصِلَ.", "tr": "Bi-faḍli daʿmi ʿāʾilatī istaṭaʿtu an uwāṣila.", "id": "Berkat dukungan keluarga saya, saya mampu terus melanjutkan.", "t": 22, "em": "👨‍👩‍👧"}, {"n": "2645", "ar": "تَعَلَّمْنَا أَنْ نَبْدَأَ صَغِيرًا ثُمَّ نَتَوَسَّعَ بِحَسَبِ الطَّلَبِ.", "tr": "Taʿallamnā an nabdaʾa ṣaghīran thumma natawassaʿa bi-ḥasabi aṭ-ṭalabi.", "id": "Kami belajar memulai dari kecil lalu berkembang sesuai permintaan.", "t": 22, "em": "📚"}, {"n": "2646", "ar": "يَجِبُ أَنْ يَكُونَ لِلْمَشْرُوعِ هَدَفٌ وَاضِحٌ وَرِسَالَةٌ يَفْهَمُهَا الْجَمِيعُ.", "tr": "Yajibu an yakūna lil-mashrūʿi hadafun wāḍiḥun wa risālatun yafhamuhā al-jamīʿu.", "id": "Usaha harus punya tujuan yang jelas dan pesan yang dipahami semua orang.", "t": 22, "em": ""}, {"n": "2647", "ar": "الصِّدْقُ أَسَاسُ كُلِّ عَلَاقَةٍ نَاجِحَةٍ.", "tr": "Aṣ-ṣidqu asāsu kulli ʿalāqatin nājiḥatin.", "id": "Kejujuran adalah dasar setiap hubungan yang berhasil.", "t": 23, "em": ""}, {"n": "2648", "ar": "مِنَ الْمُرُوءَةِ أَنْ نُسَاعِدَ مَنْ لَا يَسْتَطِيعُ أَنْ يَرُدَّ لَنَا الْجَمِيلَ.", "tr": "Mina al-murūʾati an nusāʿida man lā yastaṭīʿu an yarudda lanā al-jamīla.", "id": "Termasuk keluhuran budi menolong orang yang tidak mampu membalas kebaikan kita.", "t": 23, "em": ""}, {"n": "2649", "ar": "الْأَمَانَةُ لَيْسَتْ فِي الْمَالِ فَقَطْ، بَلْ فِي الْكَلِمَةِ وَالْوَقْتِ أَيْضًا.", "tr": "Al-amānatu laysat fī al-māli faqaṭ, bal fī al-kalimati wal-waqti ayḍan.", "id": "Amanah bukan hanya dalam harta, tetapi juga dalam perkataan dan waktu.", "t": 23, "em": ""}, {"n": "2650", "ar": "لَا يَجُوزُ أَنْ نَسْخَرَ مِنْ ضَعْفِ أَحَدٍ أَوْ فَقْرِهِ.", "tr": "Lā yajūzu an naskhara min ḍaʿfi aḥadin aw faqrihi.", "id": "Tidak boleh kita mengejek kelemahan atau kemiskinan siapa pun.", "t": 23, "em": ""}, {"n": "2651", "ar": "الِاحْتِرَامُ لَا يَعْنِي الْمُوَافَقَةَ عَلَى كُلِّ شَيْءٍ.", "tr": "Al-iḥtirāmu lā yaʿnī al-muwāfaqata ʿalā kulli shayʾin.", "id": "Menghormati tidak berarti menyetujui segalanya.", "t": 23, "em": ""}, {"n": "2652", "ar": "الْعَدْلُ يَعْنِي أَنْ نُعْطِيَ كُلَّ ذِي حَقٍّ حَقَّهُ.", "tr": "Al-ʿadlu yaʿnī an nuʿṭiya kulla dhī ḥaqqin ḥaqqahu.", "id": "Keadilan berarti memberikan hak kepada setiap yang berhak.", "t": 23, "em": ""}, {"n": "2653", "ar": "مَنْ يَعْتَرِفُ بِخَطَئِهِ أَقْوَى مِمَّنْ يُصِرُّ عَلَيْهِ.", "tr": "Man yaʿtarifu bi-khaṭaʾihi aqwā mimman yuṣirru ʿalayhi.", "id": "Siapa mengakui kesalahannya lebih kuat daripada yang bersikeras padanya.", "t": 23, "em": ""}, {"n": "2654", "ar": "الْكَرَمُ لَيْسَ فِي كَثْرَةِ الْمَالِ بَلْ فِي سَخَاءِ الْقَلْبِ.", "tr": "Al-karamu laysa fī kathrati al-māli bal fī sakhāʾi al-qalbi.", "id": "Kedermawanan bukan pada banyaknya harta tetapi pada kemurahan hati.", "t": 23, "em": ""}, {"n": "2655", "ar": "عَلَيْنَا أَنْ نَكُونَ مُتَوَاضِعِينَ فِي النَّجَاحِ وَصَابِرِينَ فِي الشِّدَّةِ.", "tr": "ʿAlaynā an nakūna mutawāḍiʿīna fī an-najāḥi wa ṣābirīna fī ash-shiddati.", "id": "Kita harus rendah hati dalam keberhasilan dan sabar dalam kesulitan.", "t": 23, "em": ""}, {"n": "2656", "ar": "لَا تَظْلِمْ أَحَدًا فَإِنَّ الظُّلْمَ ظُلُمَاتٌ.", "tr": "Lā taẓlim aḥadan fa-inna aẓ-ẓulma ẓulumātun.", "id": "Jangan menzalimi siapa pun, sebab kezaliman adalah kegelapan.", "t": 23, "em": ""}, {"n": "2657", "ar": "الْوَفَاءُ بِالْوَعْدِ مِنْ أَهَمِّ الْقِيَمِ فِي الْعَمَلِ وَالْحَيَاةِ.", "tr": "Al-wafāʾu bil-waʿdi min ahammi al-qiyami fī al-ʿamali wal-ḥayāti.", "id": "Menepati janji adalah salah satu nilai terpenting dalam kerja dan hidup.", "t": 23, "em": ""}, {"n": "2658", "ar": "الْغِيبَةُ تُفْسِدُ الْعَلَاقَاتِ وَتُضْعِفُ الثِّقَةَ بَيْنَ النَّاسِ.", "tr": "Al-ghībatu tufsidu al-ʿalāqāti wa tuḍʿifu ath-thiqata bayna an-nāsi.", "id": "Bergunjing merusak hubungan dan melemahkan kepercayaan antar manusia.", "t": 23, "em": ""}, {"n": "2659", "ar": "نَحْتَرِمُ الْوَقْتَ لِأَنَّهُ أَغْلَى مَا نَمْلِكُ.", "tr": "Naḥtarimu al-waqta li-annahu aghlā mā namliku.", "id": "Kita menghormati waktu karena itu hal paling berharga yang kita miliki.", "t": 23, "em": ""}, {"n": "2660", "ar": "تَصْرِفُ الْقِيَمُ سُلُوكَنَا حِينَ لَا يَرَانَا أَحَدٌ.", "tr": "Tuṣarrifu al-qiyamu sulūkanā ḥīna lā yarānā aḥadun.", "id": "Nilai-nilai mengarahkan perilaku kita ketika tidak ada yang melihat.", "t": 23, "em": ""}, {"n": "2661", "ar": "الْعَفْوُ عِنْدَ الْمَقْدِرَةِ مِنْ أَجْمَلِ صِفَاتِ الْكِرَامِ.", "tr": "Al-ʿafwu ʿinda al-maqdirati min ajmali ṣifāti al-kirāmi.", "id": "Memaafkan ketika mampu membalas adalah salah satu sifat terindah orang mulia.", "t": 23, "em": ""}, {"n": "2662", "ar": "الْمَسْؤُولِيَّةُ تَبْدَأُ مِنْ أَفْعَالِنَا الصَّغِيرَةِ فِي الْيَوْمِ.", "tr": "Al-masʾūliyyatu tabdaʾu min afʿālinā aṣ-ṣaghīrati fī al-yawmi.", "id": "Tanggung jawab dimulai dari tindakan-tindakan kecil kita sehari-hari.", "t": 23, "em": ""}, {"n": "2663", "ar": "لَا تَحْكُمْ عَلَى الْإِنْسَانِ قَبْلَ أَنْ تَعْرِفَ ظُرُوفَهُ.", "tr": "Lā taḥkum ʿalā al-insāni qabla an taʿrifa ẓurūfahu.", "id": "Jangan menghakimi seseorang sebelum mengetahui keadaannya.", "t": 23, "em": ""}, {"n": "2664", "ar": "يُثْرِي التَّعَرُّفُ عَلَى ثَقَافَاتٍ مُخْتَلِفَةٍ نَظْرَتَنَا إِلَى الْعَالَمِ.", "tr": "Yuthrī at-taʿarrufu ʿalā thaqāfātin mukhtalifatin naẓratanā ilā al-ʿālami.", "id": "Mengenal budaya yang berbeda memperkaya cara pandang kita terhadap dunia.", "t": 24, "em": ""}, {"n": "2665", "ar": "قَدْ تَبْدُو عَادَاتُ النَّاسِ غَرِيبَةً حَتَّى نَفْهَمَ أَسْبَابَهَا.", "tr": "Qad tabdū ʿādātu an-nāsi gharībatan ḥattā nafhama asbābahā.", "id": "Kebiasaan orang mungkin tampak aneh sampai kita memahami sebabnya.", "t": 24, "em": ""}, {"n": "2666", "ar": "فِي بَعْضِ الثَّقَافَاتِ يُعَدُّ الْحَدِيثُ الْمُبَاشِرُ وَقَاحَةً.", "tr": "Fī baʿḍi ath-thaqāfāti yuʿaddu al-ḥadīthu al-mubāshiru waqāḥatan.", "id": "Dalam sebagian budaya, berbicara langsung dianggap tidak sopan.", "t": 24, "em": ""}, {"n": "2667", "ar": "نَتَبَادَلُ الْمَعْرِفَةَ وَلَا يُلْغِي أَحَدُنَا الْآخَرَ.", "tr": "Natabādalu al-maʿrifata wa lā yulghī aḥadunā al-ākhara.", "id": "Kita bertukar pengetahuan dan tidak ada yang meniadakan yang lain.", "t": 24, "em": ""}, {"n": "2668", "ar": "تَعَلَّمْتُ مِنْ أَصْدِقَائِي الْأَجَانِبِ أَشْيَاءَ لَمْ أَجِدْهَا فِي الْكُتُبِ.", "tr": "Taʿallamtu min aṣdiqāʾī al-ajānibi ashyāʾa lam ajidhā fī al-kutubi.", "id": "Saya belajar dari teman-teman asing hal-hal yang tidak saya temukan di buku.", "t": 24, "em": "📚🧑‍🤝‍🧑"}, {"n": "2669", "ar": "نَعِيشُ فِي عَالَمٍ مُتَرَابِطٍ وَلَا بُدَّ مِنَ التَّفَاهُمِ.", "tr": "Naʿīshu fī ʿālamin mutarābiṭin wa lā budda mina at-tafāhumi.", "id": "Kita hidup di dunia yang saling terhubung dan saling pengertian itu perlu.", "t": 24, "em": ""}, {"n": "2670", "ar": "يُفِيدُنَا الْمَطْبَخُ فِي التَّعَرُّفِ عَلَى ثَقَافَةِ الشُّعُوبِ.", "tr": "Yufīdunā al-maṭbakhu fī at-taʿarrufi ʿalā thaqāfati ash-shuʿūbi.", "id": "Dapur membantu kita mengenal budaya suatu bangsa.", "t": 24, "em": "🍳"}, {"n": "2671", "ar": "لَا يَعْنِي الِاخْتِلَافُ فِي الدِّينِ أَوِ اللُّغَةِ أَنْ نَتَصَارَعَ.", "tr": "Lā yaʿnī al-ikhtilāfu fī ad-dīni awi al-lughati an nataṣāraʿa.", "id": "Perbedaan agama atau bahasa tidak berarti kita harus bertikai.", "t": 24, "em": "🗣️"}, {"n": "2672", "ar": "مِنَ اللَّبَاقَةِ أَنْ نَتَعَلَّمَ بِضْعَ كَلِمَاتٍ مِنْ لُغَةِ الْمُضِيفِ.", "tr": "Mina al-labāqati an nataʿallama biḍʿa kalimātin min lughati al-muḍīfi.", "id": "Termasuk kesantunan mempelajari beberapa kata dari bahasa tuan rumah.", "t": 24, "em": "🗣️🏠"}, {"n": "2673", "ar": "رَغْمَ اخْتِلَافِ الْعَادَاتِ، تَجْمَعُنَا قِيَمٌ إِنْسَانِيَّةٌ وَاحِدَةٌ.", "tr": "Raghma ikhtilāfi al-ʿādāti, tajmaʿunā qiyamun insāniyyatun wāḥidatun.", "id": "Meskipun kebiasaan berbeda, kita dipersatukan oleh nilai-nilai kemanusiaan yang sama.", "t": 24, "em": ""}, {"n": "2674", "ar": "كُلُّ ثَقَافَةٍ لَهَا جَمَالُهَا وَلَا يَنْبَغِي أَنْ نَسْتَصْغِرَ أَيَّةَ وَاحِدَةٍ.", "tr": "Kullu thaqāfatin lahā jamāluhā wa lā yanbaghī an nastaṣghira ayyata wāḥidatin.", "id": "Setiap budaya memiliki keindahannya dan tidak boleh kita meremehkan satu pun.", "t": 24, "em": ""}, {"n": "2675", "ar": "يُعَلِّمُنَا السَّفَرُ أَنَّ طُرُقَ الْعَيْشِ كَثِيرَةٌ.", "tr": "Yuʿallimunā as-safaru anna ṭuruqa al-ʿayshi kathīratun.", "id": "Bepergian mengajari kita bahwa cara hidup itu banyak.", "t": 24, "em": ""}, {"n": "2676", "ar": "يَجِبُ أَنْ نَسْمَعَ قِصَصَ الْآخَرِينَ قَبْلَ أَنْ نَرْوِيَ قِصَصَنَا.", "tr": "Yajibu an nasmaʿa qiṣaṣa al-ākharīna qabla an narwiya qiṣaṣanā.", "id": "Kita harus mendengar kisah orang lain sebelum menceritakan kisah kita.", "t": 24, "em": ""}, {"n": "2677", "ar": "تَنَاوَلْنَا الْعَشَاءَ مَعَ عَائِلَةٍ مِنْ بَلَدٍ آخَرَ وَتَحَدَّثْنَا حَتَّى مُنْتَصَفِ اللَّيْلِ.", "tr": "Tanāwalnā al-ʿashāʾa maʿa ʿāʾilatin min baladin ākhara wa taḥaddathnā ḥattā muntaṣafi al-layli.", "id": "Kami makan malam bersama keluarga dari negara lain dan berbincang sampai tengah malam.", "t": 24, "em": "🍲👨‍👩‍👧"}, {"n": "2678", "ar": "احْتِرَامُ آدَابِ الضِّيَافَةِ فِي كُلِّ بَلَدٍ يُسَهِّلُ التَّعَارُفَ.", "tr": "Iḥtirāmu ādābi aḍ-ḍiyāfati fī kulli baladin yusahhilu at-taʿārufa.", "id": "Menghormati adab menjamu tamu di setiap negara memudahkan perkenalan.", "t": 24, "em": "🙋"}, {"n": "2679", "ar": "الْمُشْتَرَكَاتُ بَيْنَ الشُّعُوبِ أَكْثَرُ مِمَّا نَظُنُّ.", "tr": "Al-mushtarakātu bayna ash-shuʿūbi akthara mimmā naẓunnu.", "id": "Persamaan antar bangsa lebih banyak daripada yang kita kira.", "t": 24, "em": ""}, {"n": "2680", "ar": "سَاعَدَتْنِي الْمُوسِيقَى عَلَى التَّوَاصُلِ مَعَ أَشْخَاصٍ لَا أَتَكَلَّمُ لُغَتَهُمْ.", "tr": "Sāʿadatnī al-mūsīqā ʿalā at-tawāṣuli maʿa ashkhāṣin lā atakallamu lughatahum.", "id": "Musik membantu saya berkomunikasi dengan orang yang bahasanya tidak saya kuasai.", "t": 24, "em": "🎵🗣️"}, {"n": "2681", "ar": "مِنَ الْحِكْمَةِ أَنْ نَتَجَنَّبَ التَّعْمِيمَ عَنِ الشُّعُوبِ.", "tr": "Mina al-ḥikmati an natajannaba at-taʿmīma ʿani ash-shuʿūbi.", "id": "Bijaksana jika kita menghindari generalisasi tentang suatu bangsa.", "t": 24, "em": ""}, {"n": "2682", "ar": "الِانْضِبَاطُ فِي التَّدْرِيبِ هُوَ مَا يَصْنَعُ الْفَرْقَ بَيْنَ الْهَاوِي وَالْمُحْتَرِفِ.", "tr": "Al-inḍibāṭu fī at-tadrībi huwa mā yaṣnaʿu al-farqa bayna al-hāwī wal-muḥtarifi.", "id": "Disiplin dalam latihan adalah yang membedakan amatir dari profesional.", "t": 25, "em": ""}, {"n": "2683", "ar": "أَسْتَيْقِظُ فَجْرًا كُلَّ يَوْمٍ لِأَجْرِيَ قَبْلَ الذَّهَابِ إِلَى الْعَمَلِ.", "tr": "Astayqiẓu fajran kulla yawmin li-ajriya qabla adh-dhahābi ilā al-ʿamali.", "id": "Saya bangun fajar setiap hari untuk berlari sebelum berangkat kerja.", "t": 25, "em": ""}, {"n": "2684", "ar": "خَسِرَ الْفَرِيقُ الْمُبَارَاةَ لَكِنَّهُ لَعِبَ بِرُوحٍ رِيَاضِيَّةٍ عَالِيَةٍ.", "tr": "Khasira al-farīqu al-mubārāta lākinnahu laʿiba bi-rūḥin riyāḍiyyatin ʿāliyatin.", "id": "Tim itu kalah dalam pertandingan tetapi bermain dengan semangat sportivitas tinggi.", "t": 25, "em": "👥"}, {"n": "2685", "ar": "الرِّيَاضَةُ تُعَلِّمُنَا الصَّبْرَ وَقَبُولَ الْهَزِيمَةِ وَالْعَمَلَ مَعَ الْفَرِيقِ.", "tr": "Ar-riyāḍatu tuʿallimunā aṣ-ṣabra wa qabūla al-hazīmati wal-ʿamala maʿa al-farīqi.", "id": "Olahraga mengajari kita kesabaran, menerima kekalahan, dan bekerja dengan tim.", "t": 25, "em": "🏃👥"}, {"n": "2686", "ar": "أُعَانِي مِنْ إِصَابَةٍ فِي رُكْبَتِي وَيَجِبُ أَنْ أَرْتَاحَ شَهْرًا.", "tr": "Uʿānī min iṣābatin fī rukbatī wa yajibu an artāḥa shahran.", "id": "Saya mengalami cedera di lutut dan harus istirahat sebulan.", "t": 25, "em": "🛋️"}, {"n": "2687", "ar": "لَا يَكْفِي أَنْ نَتَدَرَّبَ بَلْ يَجِبُ أَنْ نَنَامَ وَنَأْكُلَ جَيِّدًا.", "tr": "Lā yakfī an natadarraba bal yajibu an nanāma wa naʾkula jayyidan.", "id": "Tidak cukup berlatih, kita juga harus tidur dan makan dengan baik.", "t": 25, "em": "😴🍽️"}, {"n": "2688", "ar": "فَازَ اللَّاعِبُ بِالْبُطُولَةِ بَعْدَ سَنَوَاتٍ مِنَ التَّدْرِيبِ الشَّاقِّ.", "tr": "Fāza al-lāʿibu bil-buṭūlati baʿda sanawātin mina at-tadrībi ash-shāqqi.", "id": "Pemain itu memenangkan kejuaraan setelah bertahun-tahun latihan berat.", "t": 25, "em": ""}, {"n": "2689", "ar": "أُمَارِسُ السِّبَاحَةَ مَرَّتَيْنِ فِي الْأُسْبُوعِ لِأُقَوِّيَ ظَهْرِي.", "tr": "Umārisu as-sibāḥata marratayni fī al-usbūʿi li-uqawwiya ẓahrī.", "id": "Saya berenang dua kali seminggu untuk menguatkan punggung.", "t": 25, "em": "🏊🧍"}, {"n": "2690", "ar": "الْجُلُوسُ سَاعَاتٍ طَوِيلَةً أَمَامَ الشَّاشَةِ يَضُرُّ بِالصِّحَّةِ.", "tr": "Al-julūsu sāʿātin ṭawīlatan amāma ash-shāshati yaḍurru biṣ-ṣiḥḥati.", "id": "Duduk berjam-jam di depan layar merusak kesehatan.", "t": 25, "em": "⏰"}, {"n": "2691", "ar": "يَنْضَمُّ كَثِيرُونَ إِلَى النَّادِي فِي يَنَايِرَ ثُمَّ يَتَوَقَّفُونَ بَعْدَ شَهْرٍ.", "tr": "Yanḍammu kathīrūna ilā an-nādī fī yanāyira thumma yatawaqqafūna baʿda shahrin.", "id": "Banyak orang bergabung dengan klub kebugaran di Januari lalu berhenti setelah sebulan.", "t": 25, "em": ""}, {"n": "2692", "ar": "الْحَكَمُ هُوَ الَّذِي يُطَبِّقُ الْقَوَاعِدَ عَلَى الْجَمِيعِ بِالتَّسَاوِي.", "tr": "Al-ḥakamu huwa alladhī yuṭabbiqu al-qawāʿida ʿalā al-jamīʿi bit-tasāwī.", "id": "Wasit adalah yang menerapkan aturan kepada semua dengan setara.", "t": 25, "em": ""}, {"n": "2693", "ar": "أَحْتَاجُ إِلَى مُدَرِّبٍ يُوَجِّهُنِي وَلَا يَكْتَفِي بِالصُّرَاخِ.", "tr": "Aḥtāju ilā mudarribin yuwajjihunī wa lā yaktafī biṣ-ṣurākhi.", "id": "Saya butuh pelatih yang membimbing saya, bukan hanya berteriak.", "t": 25, "em": ""}, {"n": "2694", "ar": "يُسَاعِدُنِي الْمَشْيُ فِي الصَّبَاحِ عَلَى تَصْفِيَةِ ذِهْنِي.", "tr": "Yusāʿidunī al-mashyu fī aṣ-ṣabāḥi ʿalā taṣfiyati dhihnī.", "id": "Berjalan di pagi hari membantu saya menjernihkan pikiran.", "t": 25, "em": "🌅"}, {"n": "2695", "ar": "لَا تُقَارِنْ نَفْسَكَ بِالْآخَرِينَ فِي الرِّيَاضَةِ، بَلْ قَارِنْهَا بِنَفْسِكَ الْأَمْسِ.", "tr": "Lā tuqārin nafsaka bil-ākharīna fī ar-riyāḍati, bal qārinhā bi-nafsika al-amsi.", "id": "Jangan membandingkan dirimu dengan orang lain dalam olahraga, bandingkan dengan dirimu kemarin.", "t": 25, "em": "🏃📅"}, {"n": "2696", "ar": "تَابَعْنَا النِّهَائِيَّ مَعَ الْأَصْدِقَاءِ وَكَانَتِ الْأَجْوَاءُ مُشْتَعِلَةً.", "tr": "Tābaʿnā an-nihāʾiyya maʿa al-aṣdiqāʾi wa kānati al-ajwāʾu mushtaʿilatan.", "id": "Kami menonton final bersama teman-teman dan suasananya sangat panas.", "t": 25, "em": "🧑‍🤝‍🧑☀️"}, {"n": "2697", "ar": "يُنْصَحُ بِالتَّسْخِينِ قَبْلَ أَيِّ تَمْرِينٍ لِتَجَنُّبِ الْإِصَابَاتِ.", "tr": "Yunṣaḥu bit-taskhīni qabla ayyi tamrīnin li-tajannubi al-iṣābāti.", "id": "Dianjurkan melakukan pemanasan sebelum latihan apa pun untuk menghindari cedera.", "t": 25, "em": ""}, {"n": "2698", "ar": "شَعَرْتُ بِالْإِرْهَاقِ لَكِنِّي لَمْ أَسْتَسْلِمْ حَتَّى أَكْمَلْتُ السِّبَاقَ.", "tr": "Shaʿartu bil-irhāqi lākinnī lam astaslim ḥattā akmaltu as-sibāqa.", "id": "Saya merasa kelelahan tetapi tidak menyerah sampai menyelesaikan perlombaan.", "t": 25, "em": ""}, {"n": "2699", "ar": "الْعَقْلُ السَّلِيمُ فِي الْجِسْمِ السَّلِيمِ، كَمَا يُقَالُ.", "tr": "Al-ʿaqlu as-salīmu fī al-jismi as-salīmi, kamā yuqālu.", "id": "Akal yang sehat ada pada tubuh yang sehat, seperti kata orang.", "t": 25, "em": "💪"}, {"n": "2700", "ar": "سَأَشْتَرِكُ فِي سِبَاقِ الْمَارَاثُونِ هَذَا الْخَرِيفَ.", "tr": "Saʾashtariku fī sibāqi al-mārāthūni hādhā al-kharīfa.", "id": "Saya akan ikut lomba maraton musim gugur ini.", "t": 25, "em": "🍂"}, {"n": "2701", "ar": "تَحْتَاجُ الْمُدُنُ الْكَبِيرَةُ إِلَى تَخْطِيطٍ عُمْرَانِيٍّ يَأْخُذُ الْمُسْتَقْبَلَ فِي الِاعْتِبَارِ.", "tr": "Taḥtāju al-mudunu al-kabīratu ilā takhṭīṭin ʿumrāniyyin yaʾkhudhu al-mustaqbala fī al-iʿtibāri.", "id": "Kota-kota besar membutuhkan perencanaan tata kota yang memperhitungkan masa depan.", "t": 26, "em": "🏙️"}, {"n": "2702", "ar": "تُعَانِي الْمَدِينَةُ مِنْ ازْدِحَامٍ مُرُورِيٍّ لِأَنَّ الشَّوَارِعَ لَمْ تُصَمَّمْ لِهَذَا الْعَدَدِ.", "tr": "Tuʿānī al-madīnatu min izdiḥāmin murūriyyin li-anna ash-shawāriʿa lam tuṣammam li-hādhā al-ʿadadi.", "id": "Kota ini menderita kemacetan karena jalan-jalannya tidak dirancang untuk jumlah sebanyak ini.", "t": 26, "em": "🏙️🛣️"}, {"n": "2703", "ar": "أُنْشِئَتْ مَدِينَةٌ جَدِيدَةٌ لِتَخْفِيفِ الضَّغْطِ عَلَى الْعَاصِمَةِ.", "tr": "Unshiʾat madīnatun jadīdatun li-takhfīfi aḍ-ḍaghṭi ʿalā al-ʿāṣimati.", "id": "Dibangun kota baru untuk mengurangi tekanan pada ibu kota.", "t": 26, "em": "🏙️👩"}, {"n": "2704", "ar": "تَضَعُ الْبَلَدِيَّةُ مَشْرُوعًا لِتَحْسِينِ الْأَرْصِفَةِ وَمَمَرَّاتِ الدَّرَّاجَاتِ.", "tr": "Taḍaʿu al-baladiyyatu mashrūʿan li-taḥsīni al-arṣifati wa mamarrāti ad-darrājāti.", "id": "Pemerintah kota menyusun proyek untuk memperbaiki trotoar dan jalur sepeda.", "t": 26, "em": "🏙️🚲"}, {"n": "2705", "ar": "الْمَدِينَةُ الذَّكِيَّةُ تَسْتَخْدِمُ الْبَيَانَاتِ لِتُحَسِّنَ الْخِدْمَاتِ.", "tr": "Al-madīnatu adh-dhakiyyatu tastakhdimu al-bayānāti li-tuḥassina al-khidamāti.", "id": "Kota cerdas menggunakan data untuk memperbaiki layanan.", "t": 26, "em": "🏙️📊"}, {"n": "2706", "ar": "تُعَدُّ الْحَدَائِقُ الْعَامَّةُ رِئَةَ الْمَدِينَةِ.", "tr": "Tuʿaddu al-ḥadāʾiqu al-ʿāmmatu riʾata al-madīnati.", "id": "Taman umum dianggap sebagai paru-paru kota.", "t": 26, "em": "🌳🏙️"}, {"n": "2707", "ar": "ارْتَفَعَتْ أَسْعَارُ الْعَقَارَاتِ فِي وَسَطِ الْمَدِينَةِ حَتَّى لَمْ يَعُدْ بِوُسْعِ الشَّبَابِ الشِّرَاءُ.", "tr": "Irtafaʿat asʿāru al-ʿaqārāti fī wasaṭi al-madīnati ḥattā lam yaʿud bi-wusʿi ash-shababi ash-shirāʾu.", "id": "Harga properti di pusat kota naik hingga pemuda tidak lagi mampu membeli.", "t": 26, "em": "🏷️🏙️"}, {"n": "2708", "ar": "يَتَطَلَّبُ بِنَاءُ الْجُسُورِ وَالْأَنْفَاقِ مِيزَانِيَّاتٍ ضَخْمَةً.", "tr": "Yataṭallabu bināʾu al-jusūri wal-anfāqi mīzāniyyātin ḍakhmatan.", "id": "Pembangunan jembatan dan terowongan membutuhkan anggaran besar.", "t": 26, "em": ""}, {"n": "2709", "ar": "الْعَيْشُ فِي مَدِينَةٍ مُزْدَحِمَةٍ يُرْهِقُنِي فَأَبْحَثُ عَنْ مَكَانٍ أَهْدَأَ.", "tr": "Al-ʿayshu fī madīnatin muzdaḥimatin yurhiqunī fa-abḥathu ʿan makānin ahdaʾa.", "id": "Hidup di kota yang padat melelahkan saya sehingga saya mencari tempat yang lebih tenang.", "t": 26, "em": "🏙️🔍"}, {"n": "2710", "ar": "تَحْتَاجُ الْأَحْيَاءُ إِلَى مَدَارِسَ وَمُسْتَشْفَيَاتٍ قَرِيبَةٍ مِنْ سُكَّانِهَا.", "tr": "Taḥtāju al-aḥyāʾu ilā madārisa wa mustashfayātin qarībatin min sukkānihā.", "id": "Lingkungan membutuhkan sekolah dan rumah sakit yang dekat dengan penduduknya.", "t": 26, "em": "🏫🏠"}, {"n": "2711", "ar": "تَتَوَسَّعُ الْمُدُنُ عَلَى حِسَابِ الْأَرَاضِي الزِّرَاعِيَّةِ.", "tr": "Tatawassaʿu al-mudunu ʿalā ḥisābi al-arāḍī az-zirāʿiyyati.", "id": "Kota-kota meluas dengan mengorbankan lahan pertanian.", "t": 26, "em": "🏙️🌾"}, {"n": "2712", "ar": "أُحِبُّ الْمُدُنَ الَّتِي تَحْتَفِظُ بِطَابَعِهَا الْقَدِيمِ مَعَ التَّطْوِيرِ.", "tr": "Uḥibbu al-mudina allatī taḥtafiẓu bi-ṭābiʿihā al-qadīmi maʿa at-taṭwīri.", "id": "Saya suka kota yang mempertahankan ciri lamanya seiring pembangunan.", "t": 26, "em": "🏙️"}, {"n": "2713", "ar": "اشْتَرَكَ السُّكَّانُ فِي اسْتِفْتَاءٍ حَوْلَ مَشْرُوعِ الْمَتْرُو الْجَدِيدِ.", "tr": "Ishtaraka as-sukkānu fī istiftāʾin ḥawla mashrūʿi al-mitrū al-jadīdi.", "id": "Warga ikut dalam jajak pendapat tentang proyek metro baru.", "t": 26, "em": ""}, {"n": "2714", "ar": "تَقِلُّ الْمَسَاحَاتُ الْمَفْتُوحَةُ كُلَّمَا ازْدَادَ الْبِنَاءُ.", "tr": "Taqillu al-masāḥātu al-maftūḥatu kullamā izdāda al-bināʾu.", "id": "Ruang terbuka berkurang seiring bertambahnya bangunan.", "t": 26, "em": ""}, {"n": "2715", "ar": "أَقْتَرِحُ أَنْ نُخَصِّصَ يَوْمًا فِي الشَّهْرِ تُغْلَقُ فِيهِ الشَّوَارِعُ أَمَامَ السَّيَّارَاتِ.", "tr": "Aqtariḥu an nukhaṣṣiṣa yawman fī ash-shahri tughlaqu fīhi ash-shawāriʿu amāma as-sayyārāti.", "id": "Saya mengusulkan menyediakan satu hari dalam sebulan ketika jalan ditutup untuk mobil.", "t": 26, "em": "🛣️🚗"}, {"n": "2716", "ar": "لِكُلِّ مَدِينَةٍ شَخْصِيَّتُهَا الَّتِي تُشَكِّلُهَا النَّاسُ وَالتَّارِيخُ.", "tr": "Li-kulli madīnatin shakhṣiyyatuhā allatī tushakkiluhā an-nāsu wat-tārīkhu.", "id": "Setiap kota punya kepribadiannya yang dibentuk oleh orang dan sejarah.", "t": 26, "em": "🏙️"}, {"n": "2717", "ar": "الْمَدِينَةُ الْجَيِّدَةُ هِيَ الَّتِي تَجْعَلُ الْإِنْسَانَ يَشْعُرُ بِالْأَمَانِ وَالِانْتِمَاءِ.", "tr": "Al-madīnatu al-jayyidatu hiya allatī tajʿalu al-insāna yashʿuru bil-amāni wal-intimāʾi.", "id": "Kota yang baik adalah yang membuat manusia merasa aman dan memiliki.", "t": 26, "em": "🏙️"}, {"n": "2718", "ar": "حِينَ أَنْظُرُ إِلَى الْوَرَاءِ أُدْرِكُ كَمْ تَغَيَّرْتُ خِلَالَ عَشْرِ سَنَوَاتٍ.", "tr": "Ḥīna anẓuru ilā al-warāʾi udriku kam taghayyartu khilāla ʿashri sanawātin.", "id": "Ketika menoleh ke belakang, saya sadar betapa saya telah berubah dalam sepuluh tahun.", "t": 27, "em": ""}, {"n": "2719", "ar": "أَتَذَكَّرُ أَوَّلَ يَوْمٍ دَخَلْتُ فِيهِ الْمَدْرَسَةَ كَأَنَّهُ الْأَمْسُ.", "tr": "Atadhakkaru awwala yawmin dakhaltu fīhi al-madrasata ka-annahu al-amsu.", "id": "Saya ingat hari pertama masuk sekolah seakan-akan baru kemarin.", "t": 27, "em": "🏫📅"}, {"n": "2720", "ar": "لَوْ عَادَ بِيَ الزَّمَنُ لَاخْتَرْتُ الطَّرِيقَ نَفْسَهُ مَعَ بَعْضِ التَّعْدِيلَاتِ.", "tr": "Law ʿāda bī az-zamanu lakhtartu aṭ-ṭarīqa nafsahu maʿa baʿḍi at-taʿdīlāti.", "id": "Seandainya waktu bisa diulang, saya akan memilih jalan yang sama dengan beberapa perubahan.", "t": 27, "em": "🛣️"}, {"n": "2721", "ar": "بَقِيَتْ تِلْكَ اللَّحْظَةُ فِي ذَاكِرَتِي رَغْمَ مُرُورِ الْأَعْوَامِ.", "tr": "Baqiyat tilka al-laḥẓatu fī dhākiratī raghma murūri al-aʿwāmi.", "id": "Momen itu tetap ada dalam ingatan saya meskipun bertahun-tahun berlalu.", "t": 27, "em": ""}, {"n": "2722", "ar": "فَقَدْنَا بَيْتَ الطُّفُولَةِ لَكِنَّنَا احْتَفَظْنَا بِذِكْرَيَاتِهِ.", "tr": "Faqadnā bayta aṭ-ṭufūlati lākinnanā iḥtafaẓnā bi-dhikrayātihi.", "id": "Kami kehilangan rumah masa kecil, tetapi menyimpan kenangannya.", "t": 27, "em": "🏠"}, {"n": "2723", "ar": "حِينَ كُنْتُ صَغِيرًا كُنْتُ أَحْلُمُ بِأَنْ أَصِيرَ طَيَّارًا.", "tr": "Ḥīna kuntu ṣaghīran kuntu aḥlumu bi-an aṣīra ṭayyāran.", "id": "Ketika kecil saya bermimpi menjadi pilot.", "t": 27, "em": ""}, {"n": "2724", "ar": "لَمْ أَكُنْ أَعْرِفُ مَعْنَى الْغُرْبَةِ حَتَّى سَافَرْتُ وَحْدِي.", "tr": "Lam akun aʿrifu maʿnā al-ghurbati ḥattā sāfartu waḥdī.", "id": "Saya tidak tahu arti perantauan sampai saya bepergian sendiri.", "t": 27, "em": ""}, {"n": "2725", "ar": "نَظَرْتُ إِلَى الصُّوَرِ الْقَدِيمَةِ فَابْتَسَمْتُ وَبَكَيْتُ مَعًا.", "tr": "Naẓartu ilā aṣ-ṣuwari al-qadīmati fa-btasamtu wa bakaytu maʿan.", "id": "Saya melihat foto-foto lama lalu tersenyum sekaligus menangis.", "t": 27, "em": "📸😊"}, {"n": "2726", "ar": "تَعَلَّمْتُ مِنْ أَخْطَائِي أَكْثَرَ مِمَّا تَعَلَّمْتُ مِنْ نَجَاحَاتِي.", "tr": "Taʿallamtu min akhṭāʾī akthara mimmā taʿallamtu min najāḥātī.", "id": "Saya belajar dari kesalahan lebih banyak daripada dari keberhasilan.", "t": 27, "em": "📚"}, {"n": "2727", "ar": "كَانَتِ الْحَيَاةُ أَبْطَأَ حِينَ لَمْ تَكُنِ الْهَوَاتِفُ مَوْجُودَةً.", "tr": "Kānati al-ḥayātu abṭaʾa ḥīna lam takuni al-hawātifu mawjūdatan.", "id": "Hidup lebih lambat ketika ponsel belum ada.", "t": 27, "em": "📱"}, {"n": "2728", "ar": "رَاجَعْتُ مُذَكِّرَاتِي الْقَدِيمَةَ فَاكْتَشَفْتُ أَنِّي كُنْتُ أَقْلَقُ عَلَى أَشْيَاءَ تَافِهَةٍ.", "tr": "Rājaʿtu mudhakkirātī al-qadīmata fa-iktashaftu annī kuntu aqlaqu ʿalā ashyāʾa tāfihatin.", "id": "Saya membaca ulang catatan lama dan menemukan bahwa dulu saya mengkhawatirkan hal-hal sepele.", "t": 27, "em": "📖"}, {"n": "2729", "ar": "لَقَدْ مَرَّتِ السَّنَوَاتُ بِسُرْعَةٍ لَمْ أُدْرِكْهَا.", "tr": "Laqad marrati as-sanawātu bi-surʿatin lam udrikhā.", "id": "Tahun-tahun berlalu dengan kecepatan yang tidak saya sadari.", "t": 27, "em": ""}, {"n": "2730", "ar": "أَشْعُرُ بِالْحَنِينِ كُلَّمَا مَرَرْتُ بِمَدْرَسَتِي الْقَدِيمَةِ.", "tr": "Ashʿuru bil-ḥanīni kullamā marartu bi-madrasatī al-qadīmati.", "id": "Saya merasa rindu setiap kali melewati sekolah lama saya.", "t": 27, "em": "🥺🏫"}, {"n": "2731", "ar": "لَمْ أَفْهَمْ نَصِيحَةَ أَبِي حِينَهَا، وَالْآنَ أَفْهَمُهَا تَمَامًا.", "tr": "Lam afham naṣīḥata abī ḥīnahā, wal-āna afhamuhā tamāman.", "id": "Dulu saya tidak mengerti nasihat ayah, sekarang saya mengerti sepenuhnya.", "t": 27, "em": "👨"}, {"n": "2732", "ar": "كُلُّ مَرْحَلَةٍ فِي الْحَيَاةِ لَهَا جَمَالُهَا وَتَحَدِّيَاتُهَا.", "tr": "Kullu marḥalatin fī al-ḥayāti lahā jamāluhā wa taḥaddiyātuhā.", "id": "Setiap tahap kehidupan punya keindahan dan tantangannya.", "t": 27, "em": ""}, {"n": "2733", "ar": "لَا يَزَالُ صَدَى كَلِمَاتِ جَدَّتِي يَرِنُّ فِي أُذُنِي.", "tr": "Lā yazālu ṣadā kalimāti jaddatī yarinnu fī udhunī.", "id": "Gema kata-kata nenek saya masih terngiang di telinga saya.", "t": 27, "em": "👵👂"}, {"n": "2734", "ar": "أَطْمَحُ إِلَى أَنْ أَكُونَ مُدِيرًا بَعْدَ خَمْسِ سَنَوَاتٍ.", "tr": "Aṭmaḥu ilā an akūna mudīran baʿda khamsi sanawātin.", "id": "Saya bercita-cita menjadi manajer lima tahun lagi.", "t": 28, "em": ""}, {"n": "2735", "ar": "أَضَعُ أَهْدَافًا قَصِيرَةَ الْمَدَى وَأُرَاجِعُهَا كُلَّ شَهْرٍ.", "tr": "Aḍaʿu ahdāfan qaṣīrata al-madā wa urājiʿuhā kulla shahrin.", "id": "Saya menetapkan target jangka pendek dan meninjaunya setiap bulan.", "t": 28, "em": ""}, {"n": "2736", "ar": "لَيْسَ الطُّمُوحُ أَنْ نَصِلَ بِسُرْعَةٍ بَلْ أَنْ نَسِيرَ فِي الِاتِّجَاهِ الصَّحِيحِ.", "tr": "Laysa aṭ-ṭumūḥu an naṣila bi-surʿatin bal an nasīra fī al-ittijāhi aṣ-ṣaḥīḥi.", "id": "Ambisi bukan sampai dengan cepat tetapi berjalan ke arah yang benar.", "t": 28, "em": ""}, {"n": "2737", "ar": "أَفَكِّرُ فِي تَغْيِيرِ مَجَالِ عَمَلِي لِأَنِّي لَمْ أَعُدْ أَشْعُرُ بِالشَّغَفِ.", "tr": "Ufakkiru fī taghyīri majāli ʿamalī li-annī lam aʿud ashʿuru bish-shaghafi.", "id": "Saya berpikir mengganti bidang pekerjaan karena tidak lagi merasa bergairah.", "t": 28, "em": ""}, {"n": "2738", "ar": "اِسْتَشَرْتُ مُرْشِدًا مِهْنِيًّا قَبْلَ اخْتِيَارِ التَّخَصُّصِ.", "tr": "Istasharttu murshidan mihaniyyan qabla ikhtiyāri at-takhaṣṣuṣi.", "id": "Saya berkonsultasi dengan konselor karier sebelum memilih jurusan.", "t": 28, "em": ""}, {"n": "2739", "ar": "الْفُرَصُ لَا تَأْتِي دَائِمًا فَيَجِبُ أَنْ نَسْتَعِدَّ لَهَا.", "tr": "Al-furaṣu lā taʾtī dāʾiman fa-yajibu an nastaʿidda lahā.", "id": "Peluang tidak selalu datang, jadi kita harus siap untuknya.", "t": 28, "em": ""}, {"n": "2740", "ar": "حَصَلْتُ عَلَى تَرْقِيَةٍ لَكِنَّهَا تَعْنِي مَسْؤُولِيَّاتٍ أَكْبَرَ.", "tr": "Ḥaṣaltu ʿalā tarqiyatin lākinnahā taʿnī masʾūliyyātin akbara.", "id": "Saya mendapat kenaikan jabatan tetapi itu berarti tanggung jawab yang lebih besar.", "t": 28, "em": ""}, {"n": "2741", "ar": "عَلَيْنَا أَنْ نَتَعَلَّمَ شَيْئًا جَدِيدًا كُلَّ سَنَةٍ لِنَظَلَّ مُنَافِسِينَ.", "tr": "ʿAlaynā an nataʿallama shayʾan jadīdan kulla sanatin li-naẓalla munāfisīna.", "id": "Kita harus mempelajari sesuatu yang baru setiap tahun agar tetap kompetitif.", "t": 28, "em": ""}, {"n": "2742", "ar": "الْمَسَارُ الْمِهْنِيُّ لَيْسَ خَطًّا مُسْتَقِيمًا، بَلْ فِيهِ مُنْعَطَفَاتٌ.", "tr": "Al-masāru al-mihaniyyu laysa khaṭṭan mustaqīman, bal fīhi munʿaṭafātun.", "id": "Jalur karier bukan garis lurus, tetapi ada belokan-belokan.", "t": 28, "em": ""}, {"n": "2743", "ar": "أُرِيدُ أَنْ أَعْمَلَ فِي شَيْءٍ يُفِيدُ النَّاسَ لَا فِي الرِّبْحِ فَقَطْ.", "tr": "Urīdu an aʿmala fī shayʾin yufīdu an-nāsa lā fī ar-ribḥi faqaṭ.", "id": "Saya ingin bekerja dalam sesuatu yang bermanfaat bagi orang, bukan hanya mencari untung.", "t": 28, "em": "🔍"}, {"n": "2744", "ar": "عَرَضَتْ عَلَيَّ شَرِكَةٌ وَظِيفَةً أَفْضَلَ لَكِنْ فِي مَدِينَةٍ أُخْرَى.", "tr": "ʿAraḍat ʿalayya sharikatun waẓīfatan afḍala lākin fī madīnatin ukhrā.", "id": "Sebuah perusahaan menawari saya pekerjaan yang lebih baik tetapi di kota lain.", "t": 28, "em": "🏙️"}, {"n": "2745", "ar": "لَا يَنْجَحُ فِي مِهْنَةٍ مَنْ لَا يُحِبُّهَا.", "tr": "Lā yanjaḥu fī mihnatin man lā yuḥibbuhā.", "id": "Tidak akan berhasil dalam suatu profesi orang yang tidak mencintainya.", "t": 28, "em": ""}, {"n": "2746", "ar": "أَسْتَثْمِرُ فِي شَبَكَةِ عَلَاقَاتِي لِأَنَّ الْفُرَصَ تَأْتِي مِنَ النَّاسِ.", "tr": "Astathmiru fī shabakati ʿalāqātī li-anna al-furaṣa taʾtī mina an-nāsi.", "id": "Saya berinvestasi pada jaringan relasi karena peluang datang dari orang.", "t": 28, "em": ""}, {"n": "2747", "ar": "لَمْ أَحْصُلْ عَلَى الْوَظِيفَةِ لَكِنَّنِي تَعَلَّمْتُ مِنَ الْمُقَابَلَةِ كَثِيرًا.", "tr": "Lam aḥṣul ʿalā al-waẓīfati lākinnanī taʿallamtu mina al-muqābalati kathīran.", "id": "Saya tidak mendapat pekerjaan itu tetapi banyak belajar dari wawancaranya.", "t": 28, "em": "📚🎤"}, {"n": "2748", "ar": "أَسْعَى لِأَنْ أَتَوَازَنَ بَيْنَ النَّجَاحِ فِي الْعَمَلِ وَالسَّعَادَةِ فِي الْبَيْتِ.", "tr": "Asʿā li-an atawāzana bayna an-najāḥi fī al-ʿamali was-saʿādati fī al-bayti.", "id": "Saya berupaya menyeimbangkan keberhasilan di kantor dan kebahagiaan di rumah.", "t": 28, "em": "🏢🏠"}, {"n": "2749", "ar": "سَأَتَقَاعَدُ يَوْمًا لَكِنِّي سَأَظَلُّ أَتَعَلَّمُ.", "tr": "Saʾataqāʿadu yawman lākinnī saʾaẓallu ataʿallamu.", "id": "Suatu hari saya akan pensiun tetapi saya akan terus belajar.", "t": 28, "em": "📚"}, {"n": "2750", "ar": "الْمَالُ مُهِمٌّ لَكِنَّهُ لَيْسَ كُلَّ شَيْءٍ فِي اخْتِيَارِ الْوَظِيفَةِ.", "tr": "Al-mālu muhimmun lākinnahu laysa kulla shayʾin fī ikhtiyāri al-waẓīfati.", "id": "Uang itu penting tetapi bukan segalanya dalam memilih pekerjaan.", "t": 28, "em": "💵"}, {"n": "2751", "ar": "الْمُشَارَكَةُ فِي الِانْتِخَابَاتِ حَقٌّ وَوَاجِبٌ فِي الْوَقْتِ نَفْسِهِ.", "tr": "Al-mushārakatu fī al-intikhābāti ḥaqqun wa wājibun fī al-waqti nafsihi.", "id": "Ikut serta dalam pemilu adalah hak sekaligus kewajiban.", "t": 29, "em": ""}, {"n": "2752", "ar": "عَلَى الْمُوَاطِنِ أَنْ يَعْرِفَ بَرْنَامَجَ الْمُرَشَّحِ قَبْلَ أَنْ يُعْطِيَهُ صَوْتَهُ.", "tr": "ʿAlā al-muwāṭini an yaʿrifa barnāmaja al-murashshaḥi qabla an yuʿṭiyahu ṣawtahu.", "id": "Warga harus mengetahui program calon sebelum memberinya suara.", "t": 29, "em": ""}, {"n": "2753", "ar": "تُشَكِّلُ الْأَحْزَابُ السِّيَاسِيَّةُ مَنَابِرَ لِلتَّعْبِيرِ عَنْ مَصَالِحِ فِئَاتٍ مُخْتَلِفَةٍ.", "tr": "Tushakkilu al-aḥzābu as-siyāsiyyatu manābira lit-taʿbīri ʿan maṣāliḥi fiʾātin mukhtalifatin.", "id": "Partai politik menjadi wadah untuk menyuarakan kepentingan kelompok-kelompok yang berbeda.", "t": 29, "em": ""}, {"n": "2754", "ar": "الشَّفَافِيَّةُ فِي الْإِنْفَاقِ الْحُكُومِيِّ تَحْمِي الْمَالَ الْعَامَّ مِنَ الْهَدْرِ.", "tr": "Ash-shaffāfiyyatu fī al-infāqi al-ḥukūmiyyi taḥmī al-māla al-ʿāmma mina al-hadri.", "id": "Transparansi dalam belanja pemerintah melindungi uang publik dari pemborosan.", "t": 29, "em": "🛍️💵"}, {"n": "2755", "ar": "مَهْمَا اخْتَلَفَتْ آرَاؤُنَا السِّيَاسِيَّةُ يَجِبُ أَنْ نَحْتَرِمَ بَعْضَنَا.", "tr": "Mahmā ikhtalafat ārāʾunā as-siyāsiyyatu yajibu an naḥtarima baʿḍanā.", "id": "Seberapa pun berbedanya pandangan politik kita, kita harus saling menghormati.", "t": 29, "em": ""}, {"n": "2756", "ar": "أَعْلَنَ الْمَسْؤُولُ اسْتِقَالَتَهُ بَعْدَ أَنْ تَبَيَّنَ تَقْصِيرُهُ.", "tr": "Aʿlana al-masʾūlu istiqālatahu baʿda an tabayyana taqṣīruhu.", "id": "Pejabat itu mengumumkan pengunduran dirinya setelah kelalaiannya terbukti.", "t": 29, "em": ""}, {"n": "2757", "ar": "يُسْهِمُ الشَّبَابُ فِي الْحَيَاةِ الْعَامَّةِ بِالتَّطَوُّعِ وَالْمُبَادَرَاتِ الْمَحَلِّيَّةِ.", "tr": "Yus-himu ash-shababu fī al-ḥayāti al-ʿāmmati bit-taṭawwuʿi wal-mubādarāti al-maḥalliyyati.", "id": "Pemuda berkontribusi dalam kehidupan publik lewat kerja sukarela dan inisiatif lokal.", "t": 29, "em": ""}, {"n": "2758", "ar": "مَنْ لَا يَدْفَعُ الضَّرَائِبَ لَا يَحِقُّ لَهُ أَنْ يَطْلُبَ خِدْمَاتٍ جَيِّدَةً.", "tr": "Man lā yadfaʿu aḍ-ḍarāʾiba lā yaḥiqqu lahu an yaṭluba khidamātin jayyidatan.", "id": "Siapa yang tidak membayar pajak tidak berhak menuntut layanan yang baik.", "t": 29, "em": "💳"}, {"n": "2759", "ar": "تَسْعَى الدَّوْلَةُ إِلَى تَحْقِيقِ الْعَدَالَةِ بَيْنَ الْمُدُنِ وَالْأَرْيَافِ.", "tr": "Tasʿā ad-dawlatu ilā taḥqīqi al-ʿadālati bayna al-mudūni wal-aryāfi.", "id": "Negara berupaya mewujudkan keadilan antara kota dan desa.", "t": 29, "em": "🏙️🏡"}, {"n": "2760", "ar": "أَرَى أَنَّ الْمَشَارِكَةَ الشَّعْبِيَّةَ فِي الْقَرَارَاتِ تُقَوِّي الْإِحْسَاسَ بِالِانْتِمَاءِ.", "tr": "Arā anna al-mushārakata ash-shaʿbiyyata fī al-qarārāti tuqawwī al-iḥsāsa bil-intimāʾi.", "id": "Menurut saya partisipasi rakyat dalam keputusan menguatkan rasa memiliki.", "t": 29, "em": ""}, {"n": "2761", "ar": "يَجِبُ أَنْ تَكُونَ الصَّحَافَةُ حُرَّةً لِتَسْتَطِيعَ مُرَاقَبَةَ السُّلْطَةِ.", "tr": "Yajibu an takūna aṣ-ṣaḥāfatu ḥurratan li-tastaṭīʿa murāqabata as-sulṭati.", "id": "Pers harus bebas agar dapat mengawasi kekuasaan.", "t": 29, "em": ""}, {"n": "2762", "ar": "لَا يُمْكِنُ لِأَيِّ بَلَدٍ أَنْ يَتَقَدَّمَ دُونَ مُؤَسَّسَاتٍ قَوِيَّةٍ وَقَانُونٍ يَسْرِي عَلَى الْجَمِيعِ.", "tr": "Lā yumkinu li-ayyi baladin an yataqaddama dūna muʾassasātin qawiyyatin wa qānūnin yasrī ʿalā al-jamīʿi.", "id": "Tidak mungkin negara mana pun maju tanpa lembaga yang kuat dan hukum yang berlaku bagi semua.", "t": 29, "em": "⚖️"}, {"n": "2763", "ar": "شَارَكْتُ فِي حَمْلَةٍ لِتَسْجِيلِ النَّاخِبِينَ الْجُدُدِ.", "tr": "Shāraktu fī ḥamlatin li-tasjīli an-nākhibīna al-judidi.", "id": "Saya ikut dalam kampanye pendaftaran pemilih baru.", "t": 29, "em": ""}, {"n": "2764", "ar": "أُفَضِّلُ الْحِوَارَ الْهَادِئَ عَلَى الْجَدَلِ الصَّاخِبِ فِي الْقَضَايَا السِّيَاسِيَّةِ.", "tr": "Ufaḍḍilu al-ḥiwāra al-hādiʾa ʿalā al-jadali aṣ-ṣākhibi fī al-qaḍāyā as-siyāsiyyati.", "id": "Saya lebih suka dialog yang tenang daripada debat gaduh dalam isu politik.", "t": 29, "em": "😌"}, {"n": "2765", "ar": "تُقَدِّمُ الْمَجَالِسُ الْمَحَلِّيَّةُ خِدْمَاتٍ مُبَاشِرَةً لِلسُّكَّانِ فِي الْأَحْيَاءِ.", "tr": "Tuqaddimu al-majālisu al-maḥalliyyatu khidamātin mubāsharatan lis-sukkāni fī al-aḥyāʾi.", "id": "Dewan lokal memberikan layanan langsung kepada warga di lingkungan.", "t": 29, "em": ""}, {"n": "2766", "ar": "لَيْسَ الْوَطَنُ مَكَانًا نَعِيشُ فِيهِ فَقَطْ، بَلْ مَسْؤُولِيَّةٌ نَحْمِلُهَا.", "tr": "Laysa al-waṭanu makānan naʿīshu fīhi faqaṭ, bal masʾūliyyatun naḥmiluhā.", "id": "Tanah air bukan hanya tempat kita hidup, melainkan tanggung jawab yang kita pikul.", "t": 29, "em": "💧"}, {"n": "2767", "ar": "حِينَ يَتَعَاوَنُ الْمُوَاطِنُونَ مَعَ الدَّوْلَةِ تَنْجَحُ الْمَشَارِيعُ الْوَطَنِيَّةِ.", "tr": "Ḥīna yataʿāwanu al-muwāṭinūna maʿa ad-dawlati tanjaḥu al-mashārīʿu al-waṭaniyyatu.", "id": "Ketika warga bekerja sama dengan negara, proyek nasional berhasil.", "t": 29, "em": ""}, {"n": "2768", "ar": "لَا تَعْنِي الْمُعَارَضَةُ الْعَدَاوَةَ، بَلْ هِيَ جُزْءٌ مِنَ الْحَيَاةِ الدِّيمُقْرَاطِيَّةِ.", "tr": "Lā taʿnī al-muʿāraḍatu al-ʿadāwata, bal hiya juzʾun mina al-ḥayāti ad-dīmuqrāṭiyyati.", "id": "Oposisi tidak berarti permusuhan, melainkan bagian dari kehidupan demokrasi.", "t": 29, "em": ""}, {"n": "2769", "ar": "يَهْدِفُ الْإِعْلَانُ النَّاجِحُ إِلَى بِنَاءِ عَلَاقَةٍ مَعَ الْعَمِيلِ لَا إِلَى الْبَيْعِ السَّرِيعِ فَقَطْ.", "tr": "Yahdifu al-iʿlānu an-nājiḥu ilā bināʾi ʿalāqatin maʿa al-ʿamīli lā ilā al-bayʿi as-sarīʿi faqaṭ.", "id": "Iklan yang berhasil bertujuan membangun hubungan dengan pelanggan, bukan sekadar penjualan cepat.", "t": 30, "em": "📣"}, {"n": "2770", "ar": "يَجِبُ أَنْ نَعْرِفَ جُمْهُورَنَا الْمُسْتَهْدَفَ قَبْلَ أَنْ نُصَمِّمَ الْحَمْلَةَ.", "tr": "Yajibu an naʿrifa jumhūranā al-mustahdafa qabla an nuṣammima al-ḥamlata.", "id": "Kita harus mengenal target audiens sebelum merancang kampanye.", "t": 30, "em": ""}, {"n": "2771", "ar": "لَا تَنْجَحُ الْحَمْلَةُ إِذَا كَانَتِ الرِّسَالَةُ غَامِضَةً أَوْ مُبَالَغًا فِيهَا.", "tr": "Lā tanjaḥu al-ḥamlatu idhā kānati ar-risālatu ghāmiḍatan aw mubālaghan fīhā.", "id": "Kampanye tidak berhasil jika pesannya kabur atau berlebihan.", "t": 30, "em": ""}, {"n": "2772", "ar": "أَصْبَحَتْ مَوَاقِعُ التَّوَاصُلِ أَهَمَّ قَنَاةٍ لِلتَّسْوِيقِ الْيَوْمَ.", "tr": "Aṣbaḥat mawāqiʿu at-tawāṣuli ahamma qanātin lit-taswīqi al-yawma.", "id": "Media sosial kini menjadi saluran pemasaran terpenting.", "t": 30, "em": "📱"}, {"n": "2773", "ar": "يُؤَثِّرُ الْمُؤَثِّرُونَ فِي قَرَارَاتِ الشِّرَاءِ لَدَى جُمْهُورِهِمْ.", "tr": "Yuʾaththiru al-muʾaththirūna fī qarārāti ash-shirāʾi ladā jumhūrihim.", "id": "Para influencer memengaruhi keputusan pembelian audiens mereka.", "t": 30, "em": ""}, {"n": "2774", "ar": "اسْتَخْدَمَتِ الشَّرِكَةُ شِعَارًا قَصِيرًا يَسْهُلُ حِفْظُهُ.", "tr": "Istakhdamati ash-sharikatu shiʿāran qaṣīran yashulu ḥifẓuhu.", "id": "Perusahaan itu memakai slogan pendek yang mudah dihafal.", "t": 30, "em": ""}, {"n": "2775", "ar":
