"نَحْتَاجُ إِلَى هَوِيَّةٍ بَصَرِيَّةٍ وَاضِحَةٍ تُمَيِّزُنَا عَنِ الْمُنَافِسِينَ.", "tr": "Naḥtāju ilā huwiyyatin baṣariyyatin wāḍiḥatin tumayyizunā ʿani al-munāfisīna.", "id": "Kami butuh identitas visual yang jelas yang membedakan kami dari pesaing.", "t": 30, "em": ""}, {"n": "2776", "ar": "تَرَاجَعَتْ مَبِيعَاتُنَا بَعْدَ أَنْ غَيَّرْنَا التَّغْلِيفَ.", "tr": "Tarājaʿat mabīʿātunā baʿda an ghayyarnā at-taghlīfa.", "id": "Penjualan kami menurun setelah kami mengganti kemasan.", "t": 30, "em": ""}, {"n": "2777", "ar": "رَاقَبْنَا رُدُودَ الْفِعْلِ عَلَى الْحَمْلَةِ وَعَدَّلْنَا الرِّسَالَةَ بِنَاءً عَلَيْهَا.", "tr": "Rāqabnā rudūda al-fiʿli ʿalā al-ḥamlati wa ʿaddalnā ar-risālata bināʾan ʿalayhā.", "id": "Kami memantau tanggapan terhadap kampanye dan menyesuaikan pesan berdasarkan itu.", "t": 30, "em": ""}, {"n": "2778", "ar": "التَّخْفِيضَاتُ الْمَوْسِمِيَّةُ تَجْذِبُ الزَّبَائِنَ لَكِنَّهَا لَا تَصْنَعُ وَلَاءً.", "tr": "At-takhfīḍātu al-mawsimiyyatu tajdhibu az-zabāʾina lākinnahā lā taṣnaʿu walāʾan.", "id": "Diskon musiman menarik pelanggan tetapi tidak menciptakan loyalitas.", "t": 30, "em": "🏷️"}, {"n": "2779", "ar": "يَتَذَكَّرُ النَّاسُ الْقِصَّةَ أَكْثَرَ مِمَّا يَتَذَكَّرُونَ الْأَرْقَامَ.", "tr": "Yatadhakkaru an-nāsu al-qiṣṣata akthara mimmā yatadhakkarūna al-arqāma.", "id": "Orang mengingat cerita lebih banyak daripada angka.", "t": 30, "em": ""}, {"n": "2780", "ar": "هَلْ يَجُوزُ أَنْ يَسْتَهْدِفَ الْإِعْلَانُ الْأَطْفَالَ مُبَاشَرَةً؟", "tr": "Hal yajūzu an yastahdifa al-iʿlānu al-aṭfāla mubāsharatan?", "id": "Bolehkah iklan menyasar anak-anak secara langsung?", "t": 30, "em": "📣🧒"}, {"n": "2781", "ar": "يَنْبَغِي أَنْ نَقِيسَ نَجَاحَ الْحَمْلَةِ بِنَتَائِجَ وَاضِحَةٍ لَا بِالْإِحْسَاسِ.", "tr": "Yanbaghī an naqīsa najāḥa al-ḥamlati bi-natāʾija wāḍiḥatin lā bil-iḥsāsi.", "id": "Kita sebaiknya mengukur keberhasilan kampanye dengan hasil yang jelas, bukan perasaan.", "t": 30, "em": ""}, {"n": "2782", "ar": "تَكْسِبُ الشَّرِكَةُ ثِقَةَ الْعُمَلَاءِ حِينَ تَعْتَرِفُ بِخَطَئِهَا وَتُصْلِحُهُ.", "tr": "Taksibu ash-sharikatu thiqata al-ʿumalāʾi ḥīna taʿtarifu bi-khaṭaʾihā wa tuṣliḥuhu.", "id": "Perusahaan memperoleh kepercayaan pelanggan ketika mengakui kesalahannya dan memperbaikinya.", "t": 30, "em": ""}, {"n": "2783", "ar": "تُسَاعِدُنَا مُلَاحَظَاتُ الْعُمَلَاءِ فِي تَطْوِيرِ الْمُنْتَجِ قَبْلَ الْإِطْلَاقِ.", "tr": "Tusāʿidunā mulāḥaẓātu al-ʿumalāʾi fī taṭwīri al-muntaji qabla al-iṭlāqi.", "id": "Masukan pelanggan membantu kami mengembangkan produk sebelum peluncuran.", "t": 30, "em": ""}, {"n": "2784", "ar": "يَجِبُ أَنْ يَحْتَرِمَ الْإِعْلَانُ ذَكَاءَ الْمُشَاهِدِ وَلَا يُخْدِعَهُ.", "tr": "Yajibu an yaḥtarima al-iʿlānu dhakāʾa al-mushāhidi wa lā yakhdaʿahu.", "id": "Iklan harus menghormati kecerdasan penonton dan tidak menipunya.", "t": 30, "em": "📣"}, {"n": "2785", "ar": "يُقَارِنُ الزَّبُونُ الْأَسْعَارَ عَلَى الْإِنْتَرْنِتِ قَبْلَ أَنْ يَشْتَرِيَ.", "tr": "Yuqārinu az-zabūnu al-asʿāra ʿalā al-intirniti qabla an yashtariya.", "id": "Pelanggan membandingkan harga di internet sebelum membeli.", "t": 30, "em": "🏷️🌐"}, {"n": "2786", "ar": "تَعَاقَدَتِ الشَّرِكَةُ مَعَ وَكَالَةٍ إِعْلَانِيَّةٍ لِتُدِيرَ حَمْلَتَهَا الْجَدِيدَةَ.", "tr": "Taʿāqadati ash-sharikatu maʿa wakālatin iʿlāniyyatin li-tudīra ḥamlatahā al-jadīdata.", "id": "Perusahaan itu berkontrak dengan agen periklanan untuk mengelola kampanye barunya.", "t": 30, "em": ""}, {"n": "2787", "ar": "لَا تَسْتَخْدِمْ كَلِمَةَ الْمُرُورِ نَفْسَهَا فِي كُلِّ الْحِسَابَاتِ.", "tr": "Lā tastakhdim kalimata al-murūri nafsahā fī kulli al-ḥisābāti.", "id": "Jangan memakai kata sandi yang sama di semua akun.", "t": 31, "em": "🔐"}, {"n": "2788", "ar": "وَصَلَتْنِي رِسَالَةٌ تَطْلُبُ بَيَانَاتِي الْمَصْرِفِيَّةِ، وَأَظُنُّهَا احْتِيَالًا.", "tr": "Waṣalatnī risālatun taṭlubu bayānātī al-maṣrifiyyata, wa aẓunnuhā iḥtiyālan.", "id": "Saya menerima pesan yang meminta data perbankan saya, dan saya kira itu penipuan.", "t": 31, "em": "📊"}, {"n": "2789", "ar": "يُنْصَحُ بِتَفْعِيلِ التَّحَقُّقِ بِخُطْوَتَيْنِ لِحِمَايَةِ الْحِسَابِ.", "tr": "Yunṣaḥu bi-tafʿīli at-taḥaqquqi bi-khuṭwatayni li-ḥimāyati al-ḥisābi.", "id": "Dianjurkan mengaktifkan verifikasi dua langkah untuk melindungi akun.", "t": 31, "em": ""}, {"n": "2790", "ar": "تَعَرَّضَتِ الشَّرِكَةُ لِاخْتِرَاقٍ سَرَّبَ بَيَانَاتِ آلَافِ الْعُمَلَاءِ.", "tr": "Taʿarraḍati ash-sharikatu li-ikhtirāqin sarraba bayānāti ālāfi al-ʿumalāʾi.", "id": "Perusahaan itu mengalami peretasan yang membocorkan data ribuan pelanggan.", "t": 31, "em": "📊"}, {"n": "2791", "ar": "لَا يَجُوزُ جَمْعُ بَيَانَاتِ النَّاسِ دُونَ مُوَافَقَتِهِمْ الصَّرِيحَةِ.", "tr": "Lā yajūzu jamʿu bayānāti an-nāsi dūna muwāfaqatihimu aṣ-ṣarīḥati.", "id": "Tidak boleh mengumpulkan data orang tanpa persetujuan eksplisit mereka.", "t": 31, "em": "📊"}, {"n": "2792", "ar": "عِنْدَمَا نَتَّصِلُ بِشَبَكَةٍ عَامَّةٍ يَجِبُ أَنْ نَتَجَنَّبَ الْمُعَامَلَاتِ الْمَالِيَّةِ.", "tr": "ʿIndamā nattaṣilu bi-shabakatin ʿāmmatin yajibu an natajannaba al-muʿāmalāti al-māliyyati.", "id": "Saat terhubung ke jaringan publik kita harus menghindari transaksi keuangan.", "t": 31, "em": ""}, {"n": "2793", "ar": "أَنْسَخُ مِلَفَّاتِي الْمُهِمَّةَ إِلَى قُرْصٍ خَارِجِيٍّ كُلَّ أُسْبُوعٍ.", "tr": "Ansakhu milaffātī al-muhimmata ilā qurṣin khārijiyyin kulla usbūʿin.", "id": "Saya menyalin berkas penting ke cakram eksternal setiap minggu.", "t": 31, "em": "📅"}, {"n": "2794", "ar": "الْخُصُوصِيَّةُ حَقٌّ، لَكِنَّنَا نَتَنَازَلُ عَنْهَا بِسُهُولَةٍ مُقَابِلَ الرَّاحَةِ.", "tr": "Al-khuṣūṣiyyatu ḥaqqun, lākinnanā natanāzalu ʿanhā bi-suhūlatin muqābila ar-rāḥati.", "id": "Privasi adalah hak, tetapi kita mudah melepaskannya demi kenyamanan.", "t": 31, "em": ""}, {"n": "2795", "ar": "لَا تُشَارِكْ مَوْقِعَكَ بِشَكْلٍ دَائِمٍ مَعَ كُلِّ التَّطْبِيقَاتِ.", "tr": "Lā tushārik mawqiʿaka bi-shaklin dāʾimin maʿa kulli at-taṭbīqāti.", "id": "Jangan membagikan lokasimu secara terus-menerus dengan semua aplikasi.", "t": 31, "em": ""}, {"n": "2796", "ar": "يَدْفَعُ الْمُحْتَالُونَ عَلَى الْإِنْتَرْنِتِ النَّاسَ إِلَى التَّسَرُّعِ حَتَّى لَا يُفَكِّرُوا.", "tr": "Yadfaʿu al-muḥtālūna ʿalā al-intirniti an-nāsa ilā at-tasarruʿi ḥattā lā yufakkirū.", "id": "Para penipu di internet mendorong orang untuk tergesa-gesa agar mereka tidak berpikir.", "t": 31, "em": "🌐"}, {"n": "2797", "ar": "حَدِّثْ نِظَامَ التَّشْغِيلِ بِانْتِظَامٍ لِسَدِّ الثَّغَرَاتِ.", "tr": "Ḥaddith niẓāma at-tashghīli bi-intiẓāmin li-saddi ath-thaghurāti.", "id": "Perbarui sistem operasi secara berkala untuk menutup celah.", "t": 31, "em": ""}, {"n": "2798", "ar": "عَلِّمْ أَطْفَالَكَ أَلَّا يُعْطُوا مَعْلُومَاتِهِمُ الشَّخْصِيَّةَ لِأَحَدٍ لَا يَعْرِفُونَهُ.", "tr": "ʿAllim aṭfālaka allā yuʿṭū maʿlūmātihimu ash-shakhṣiyyata li-aḥadin lā yaʿrifūnahu.", "id": "Ajari anak-anakmu agar tidak memberikan informasi pribadi kepada orang yang tidak mereka kenal.", "t": 31, "em": "🧒"}, {"n": "2799", "ar": "لَا أَفْتَحُ الْمُرْفَقَاتِ الْمَجْهُولَةَ مَهْمَا بَدَا الْمُرْسِلُ مَوْثُوقًا.", "tr": "Lā aftaḥu al-murfaqāti al-majhūlata mahmā badā al-mursilu mawthūqan.", "id": "Saya tidak membuka lampiran yang tidak dikenal sekalipun pengirimnya tampak tepercaya.", "t": 31, "em": ""}, {"n": "2800", "ar": "شَرِكَاتُ التِّقْنِيَةِ مَسْؤُولَةٌ عَنْ حِمَايَةِ بَيَانَاتِ مُسْتَخْدِمِيهَا.", "tr": "Sharikātu at-tiqniyyati masʾūlatun ʿan ḥimāyati bayānāti mustakhdimīhā.", "id": "Perusahaan teknologi bertanggung jawab melindungi data penggunanya.", "t": 31, "em": "📊"}, {"n": "2801", "ar": "الْوَعْيُ الْأَمْنِيُّ هُوَ خَطُّ الدِّفَاعِ الْأَوَّلُ لِأَنَّ الثَّغْرَةَ غَالِبًا هِيَ الْإِنْسَانُ.", "tr": "Al-wiʿyu al-amniyyu huwa khaṭṭu ad-difāʿi al-awwalu li-anna ath-thaghrata ghāliban hiya al-insānu.", "id": "Kesadaran keamanan adalah garis pertahanan pertama karena celahnya sering kali manusia.", "t": 31, "em": ""}, {"n": "2802", "ar": "يَتَعَلَّمُ الْمُخْتَرِقُونَ طُرُقًا جَدِيدَةً كُلَّ يَوْمٍ، لِذَا يَجِبُ أَنْ نَتَعَلَّمَ نَحْنُ أَيْضًا.", "tr": "Yataʿallamu al-mukhtariqūna ṭuruqan jadīdatan kulla yawmin, li-dhā yajibu an nataʿallama naḥnu ayḍan.", "id": "Para peretas mempelajari cara baru setiap hari, karena itu kita juga harus belajar.", "t": 31, "em": "📚"}, {"n": "2803", "ar": "حِينَ أَتَلَقَّى رِسَالَةً مُرِيبَةً أَتَّصِلُ بِالْجِهَةِ مُبَاشَرَةً لِلتَّأَكُّدِ.", "tr": "Ḥīna atalaqqā risālatan murībatan attaṣilu bil-jihati mubāsharatan lit-taʾakkudi.", "id": "Ketika menerima pesan mencurigakan, saya menghubungi lembaganya langsung untuk memastikan.", "t": 31, "em": ""}, {"n": "2804", "ar": "أَغْلَقْتُ الْإِشْعَارَاتِ كُلَّهَا لِأَنَّ الْمَعْلُومَاتِ تُجْمَعُ دُونَ عِلْمِي.", "tr": "Aghlaqtu al-ishʿārāti kullahā li-anna al-maʿlūmāti tujmaʿu dūna ʿilmī.", "id": "Saya mematikan semua notifikasi karena informasi dikumpulkan tanpa sepengetahuan saya.", "t": 31, "em": ""}, {"n": "2805", "ar": "الْخَطِيبُ النَّاجِحُ يَبْدَأُ بِفِكْرَةٍ قَوِيَّةٍ ثُمَّ يُدَعِّمُهَا بِالْأَمْثِلَةِ.", "tr": "Al-khaṭību an-nājiḥu yabdaʾu bi-fikratin qawiyyatin thumma yudaʿʿimuhā bil-amthilati.", "id": "Orator yang berhasil memulai dengan gagasan kuat lalu mendukungnya dengan contoh.", "t": 32, "em": ""}, {"n": "2806", "ar": "يَجِبُ أَنْ يَكُونَ الصَّوْتُ وَاضِحًا وَالنَّبْرَةُ مُنَاسِبَةً لِلْمَوْضُوعِ.", "tr": "Yajibu an yakūna aṣ-ṣawtu wāḍiḥan wan-nabratu munāsibatan lil-mawḍūʿi.", "id": "Suara harus jelas dan nada sesuai dengan topik.", "t": 32, "em": ""}, {"n": "2807", "ar": "فِي الْمُنَاظَرَةِ لَا نُهَاجِمُ الشَّخْصَ بَلْ نُفَنِّدُ الْفِكْرَةَ.", "tr": "Fī al-munāẓarati lā nuhājimu ash-shakhṣa bal nufannidu al-fikrata.", "id": "Dalam debat kita tidak menyerang orangnya, tetapi menyanggah gagasannya.", "t": 32, "em": ""}, {"n": "2808", "ar": "أَمْهَلَنَا الْمُنَظِّمُ دَقِيقَتَيْنِ لِتَقْدِيمِ الْحُجَّةِ الْأُولَى.", "tr": "Amhalanā al-munaẓẓimu daqīqatayni li-taqdīmi al-ḥujjati al-ūlā.", "id": "Penyelenggara memberi kami dua menit untuk menyampaikan argumen pertama.", "t": 32, "em": ""}, {"n": "2809", "ar": "أُوَاجِهُ صُعُوبَةً فِي التَّحَدُّثِ أَمَامَ الْجُمْهُورِ لِأَنِّي أَتَوَتَّرُ.", "tr": "Uwājihu ṣuʿūbatan fī at-taḥaddithi amāma al-jumhūri li-annī atawattaru.", "id": "Saya kesulitan berbicara di depan umum karena saya gugup.", "t": 32, "em": ""}, {"n": "2810", "ar": "يَنْبَغِي أَنْ نَتَوَقَّعَ أَسْئِلَةَ الْخَصْمِ وَنُجَهِّزَ إِجَابَاتٍ مُسْبَقَةً.", "tr": "Yanbaghī an natawaqqaʿa asʾilata al-khaṣmi wa nujahhiza ijābātin musbaqatan.", "id": "Kita sebaiknya mengantisipasi pertanyaan lawan dan menyiapkan jawaban lebih dulu.", "t": 32, "em": ""}, {"n": "2811", "ar": "الِاسْتِشْهَادُ بِالْإِحْصَاءَاتِ يُقَوِّي الْحُجَّةَ بِشَرْطِ أَنْ تَكُونَ مَوْثُوقَةً.", "tr": "Al-istishhādu bil-iḥṣāʾāti yuqawwī al-ḥujjata bi-sharṭin an takūna mawthūqatan.", "id": "Mengutip statistik menguatkan argumen dengan syarat bersumber tepercaya.", "t": 32, "em": ""}, {"n": "2812", "ar": "مَا أَكْثَرَ الْخُطَبَ الَّتِي تُنْسَى بَعْدَ دَقَائِقَ!", "tr": "Mā akthara al-khuṭaba allatī tunsā baʿda daqāʾiqa!", "id": "Betapa banyaknya pidato yang dilupakan setelah beberapa menit!", "t": 32, "em": ""}, {"n": "2813", "ar": "أَعْتَذِرُ إِنْ أَخْطَأْتُ فِي الْمَعْلُومَةِ وَأَشْكُرُكَ عَلَى التَّصْحِيحِ.", "tr": "Aʿtadhiru in akhṭaʾtu fī al-maʿlūmati wa ashkuruka ʿalā at-taṣḥīḥi.", "id": "Saya mohon maaf jika salah dalam informasi dan berterima kasih atas koreksinya.", "t": 32, "em": ""}, {"n": "2814", "ar": "يَتَّسِمُ الْخِطَابُ الْجَيِّدُ بِالْإِيجَازِ وَالْوُضُوحِ وَالصِّدْقِ.", "tr": "Yattasimu al-khiṭābu al-jayyidu bil-ījāzi wal-wuḍūḥi waṣ-ṣidqi.", "id": "Pidato yang baik bercirikan ringkas, jelas, dan jujur.", "t": 32, "em": ""}, {"n": "2815", "ar": "لَوْ كُنْتُ مَكَانَهُ لَرَدَدْتُ بِهُدُوءٍ بَدَلًا مِنَ الْغَضَبِ.", "tr": "Law kuntu makānahu laradadtu bi-hudūʾin badalan mina al-ghaḍabi.", "id": "Seandainya saya di posisinya, saya akan menjawab dengan tenang, bukan marah.", "t": 32, "em": "😌😠"}, {"n": "2816", "ar": "نَظَّمَتِ الْجَامِعَةُ مُنَاظَرَةً بَيْنَ فَرِيقَيْنِ حَوْلَ التَّعْلِيمِ عَنْ بُعْدٍ.", "tr": "Naẓẓamati al-jāmiʿatu munāẓaratan bayna farīqayni ḥawla at-taʿlīmi ʿan buʿdin.", "id": "Universitas menyelenggarakan debat antara dua tim tentang pendidikan jarak jauh.", "t": 32, "em": "🎓👥"}, {"n": "2817", "ar": "الْإِقْنَاعُ فَنٌّ يَقُومُ عَلَى الْمَنْطِقِ وَالْعَاطِفَةِ مَعًا.", "tr": "Al-iqnāʿu fannun yaqūmu ʿalā al-manṭiqi wal-ʿāṭifati maʿan.", "id": "Persuasi adalah seni yang bertumpu pada logika dan emosi sekaligus.", "t": 32, "em": "🎨"}, {"n": "2818", "ar": "اسْتَمَعَ الْحُضُورُ بِانْتِبَاهٍ ثُمَّ صَفَّقُوا طَوِيلًا.", "tr": "Istamaʿa al-ḥuḍūru bi-intibāhin thumma ṣaffaqū ṭawīlan.", "id": "Hadirin mendengarkan dengan penuh perhatian lalu bertepuk tangan lama.", "t": 32, "em": "✋"}, {"n": "2819", "ar": "يَحْتَاجُ الْمُتَحَدِّثُ إِلَى الْإِصْغَاءِ بِقَدْرِ حَاجَتِهِ إِلَى الْكَلَامِ.", "tr": "Yaḥtāju al-mutaḥaddithu ilā al-iṣghāʾi bi-qadri ḥājatihi ilā al-kalāmi.", "id": "Pembicara membutuhkan mendengarkan sebanyak ia membutuhkan berbicara.", "t": 32, "em": ""}, {"n": "2820", "ar": "شُكْرًا لِحُسْنِ إِصْغَائِكُمْ، وَأَتَمَنَّى أَنْ أَكُونَ قَدْ أَضَفْتُ شَيْئًا مُفِيدًا.", "tr": "Shukran li-ḥusni iṣghāʾikum, wa atamannā an akūna qad aḍaftu shayʾan mufīdan.", "id": "Terima kasih atas perhatian Anda, dan semoga saya telah menambahkan sesuatu yang bermanfaat.", "t": 32, "em": ""}, {"n": "2821", "ar": "أَفْضَلُ طَرِيقَةٍ لِتَحْسِينِ الْإِلْقَاءِ هِيَ التَّسْجِيلُ وَالِاسْتِمَاعُ إِلَى النَّفْسِ.", "tr": "Afḍalu ṭarīqatin li-taḥsīni al-ilqāʾi hiya at-tasjīlu wal-istimāʿu ilā an-nafsi.", "id": "Cara terbaik memperbaiki penyampaian adalah merekam dan mendengarkan diri sendiri.", "t": 32, "em": ""}, {"n": "2822", "ar": "اخْتَلَفَ الْمُتَنَاظِرَانِ فِي الرَّأْيِ وَاتَّفَقَا عَلَى احْتِرَامِ بَعْضِهِمَا.", "tr": "Ikhtalafa al-mutanāẓirāni fī ar-raʾyi wa-ttafaqā ʿalā iḥtirāmi baʿḍihimā.", "id": "Kedua pendebat berbeda pendapat tetapi sepakat saling menghormati.", "t": 32, "em": ""}, {"n": "2823", "ar": "يَجِبُ عَلَى الطَّبِيبِ أَنْ يُخْبِرَ الْمَرِيضَ بِحَالَتِهِ بِصِدْقٍ وَلُطْفٍ.", "tr": "Yajibu ʿalā aṭ-ṭabībi an yukhbira al-marīḍa bi-ḥālatihi bi-ṣidqin wa luṭfin.", "id": "Dokter harus memberi tahu pasien tentang kondisinya dengan jujur dan lembut.", "t": 33, "em": "🧑‍⚕️"}, {"n": "2824", "ar": "لَا يَجُوزُ إِجْرَاءُ أَيِّ عَمَلِيَّةٍ دُونَ مُوَافَقَةٍ وَاعِيَةٍ مِنَ الْمَرِيضِ.", "tr": "Lā yajūzu ijrāʾu ayyi ʿamaliyyatin dūna muwāfaqatin wāʿiyatin mina al-marīḍi.", "id": "Tidak boleh melakukan operasi apa pun tanpa persetujuan sadar dari pasien.", "t": 33, "em": ""}, {"n": "2825", "ar": "تَبْقَى أَسْرَارُ الْمَرِيضِ أَمَانَةً لَا يَجُوزُ كَشْفُهَا لِأَحَدٍ.", "tr": "Tabqā asrāru al-marīḍi amānatan lā yajūzu kashfuhā li-aḥadin.", "id": "Rahasia pasien tetap menjadi amanah yang tidak boleh dibuka kepada siapa pun.", "t": 33, "em": ""}, {"n": "2826", "ar": "تُوَاجِهُ الْمُسْتَشْفَيَاتُ نَقْصًا فِي الْأَسِرَّةِ وَالْكَوَادِرِ الطِّبِّيَّةِ.", "tr": "Tuwājihu al-mustashfayātu naqṣan fī al-asirrati wal-kawādiri aṭ-ṭibbiyyati.", "id": "Rumah sakit menghadapi kekurangan tempat tidur dan tenaga medis.", "t": 33, "em": "🏠🤒"}, {"n": "2827", "ar": "هَلْ مِنَ الْعَدْلِ أَنْ يَحْصُلَ الْأَغْنِيَاءُ عَلَى عِلَاجٍ أَفْضَلَ؟", "tr": "Hal mina al-ʿadli an yaḥṣula al-aghniyāʾu ʿalā ʿilājin afḍala?", "id": "Adilkah jika orang kaya mendapat pengobatan yang lebih baik?", "t": 33, "em": ""}, {"n": "2828", "ar": "يَتَرَدَّدُ بَعْضُ النَّاسِ فِي طَلَبِ الْعِلَاجِ النَّفْسِيِّ خَوْفًا مِنَ الْوَصْمَةِ.", "tr": "Yataraddadu baʿḍu an-nāsi fī ṭalabi al-ʿilāji an-nafsiyyi khawfan mina al-waṣmati.", "id": "Sebagian orang ragu mencari terapi psikologis karena takut stigma.", "t": 33, "em": "🔍😨"}, {"n": "2829", "ar": "أَتَمَنَّى أَنْ يُصْبِحَ الْعِلَاجُ الْوِقَائِيُّ جُزْءًا مِنَ النِّظَامِ الصِّحِّيِّ.", "tr": "Atamannā an yuṣbiḥa al-ʿilāju al-wiqāʾiyyu juzʾan mina an-niẓāmi aṣ-ṣiḥḥiyyi.", "id": "Saya berharap pengobatan pencegahan menjadi bagian dari sistem kesehatan.", "t": 33, "em": ""}, {"n": "2830", "ar": "لَا يَنْبَغِي لِلطَّبِيبِ أَنْ يَصِفَ دَوَاءً إِلَّا بَعْدَ فَحْصٍ دَقِيقٍ.", "tr": "Lā yanbaghī liṭ-ṭabībi an yaṣifa dawāʾan illā baʿda faḥṣin daqīqin.", "id": "Dokter tidak seharusnya meresepkan obat kecuali setelah pemeriksaan teliti.", "t": 33, "em": "🧑‍⚕️💊"}, {"n": "2831", "ar": "سَاعَدَتِ التِّقْنِيَةُ الْحَدِيثَةُ الْأَطِبَّاءَ عَلَى تَشْخِيصٍ أَدَقَّ لِلْأَمْرَاضِ.", "tr": "Sāʿadati at-tiqniyyatu al-ḥadīthatu al-aṭibbāʾa ʿalā tashkhīṣin adaqqa lil-amrāḍi.", "id": "Teknologi modern membantu dokter mendiagnosis penyakit dengan lebih akurat.", "t": 33, "em": "🧑‍⚕️"}, {"n": "2832", "ar": "التَّبَرُّعُ بِالْأَعْضَاءِ عَمَلٌ إِنْسَانِيٌّ يُنْقِذُ حَيَاةَ آخَرِينَ.", "tr": "At-tabarruʿu bil-aʿḍāʾi ʿamalun insāniyyun yunqidhu ḥayāta ākharīna.", "id": "Donor organ adalah perbuatan kemanusiaan yang menyelamatkan nyawa orang lain.", "t": 33, "em": ""}, {"n": "2833", "ar": "تَبْذُلُ الْمُمَرِّضَاتُ جُهْدًا كَبِيرًا غَالِبًا مَا لَا يُقَدَّرُ.", "tr": "Tabdhulu al-mumarriḍātu juhdan kabīran ghāliban mā lā yuqaddaru.", "id": "Para perawat mencurahkan usaha besar yang sering kali tidak dihargai.", "t": 33, "em": "🧑‍⚕️"}, {"n": "2834", "ar": "يَجِبُ أَنْ تَخْضَعَ الْأَدْوِيَةُ الْجَدِيدَةُ لِتَجَارِبَ صَارِمَةٍ قَبْلَ طَرْحِهَا فِي الْأَسْوَاقِ.", "tr": "Yajibu an takhḍaʿa al-adwiyatu al-jadīdatu li-tajāriba ṣārimatin qabla ṭarḥihā fī al-aswāqi.", "id": "Obat baru harus melalui uji ketat sebelum dipasarkan.", "t": 33, "em": "💊"}, {"n": "2835", "ar": "أَرْفُضُ أَنْ أُجْرِيَ فَحْصًا لَا أَفْهَمُ سَبَبَهُ.", "tr": "Arfuḍu an ujriya faḥṣan lā afhamu sababahu.", "id": "Saya menolak melakukan pemeriksaan yang tidak saya pahami alasannya.", "t": 33, "em": ""}, {"n": "2836", "ar": "لِلْأُسْرَةِ دَوْرٌ كَبِيرٌ فِي دَعْمِ الْمَرِيضِ نَفْسِيًّا أَثْنَاءَ الْعِلَاجِ.", "tr": "Lil-usrati dawrun kabīrun fī daʿmi al-marīḍi nafsiyyan athnāʾa al-ʿilāji.", "id": "Keluarga punya peran besar dalam mendukung pasien secara psikologis selama pengobatan.", "t": 33, "em": "👨‍👩‍👧"}, {"n": "2837", "ar": "تَفْرِضُ الْمِهْنَةُ الطِّبِّيَّةُ أَنْ يَضَعَ الطَّبِيبُ مَصْلَحَةَ الْمَرِيضِ فَوْقَ كُلِّ اعْتِبَارٍ.", "tr": "Tafriḍu al-mihnatu aṭ-ṭibbiyyatu an yaḍaʿa aṭ-ṭabību maṣlaḥata al-marīḍi fawqa kulli iʿtibārin.", "id": "Profesi kedokteran mewajibkan dokter mengutamakan kepentingan pasien di atas segalanya.", "t": 33, "em": "🧑‍⚕️"}, {"n": "2838", "ar": "يَجِبُ أَنْ نَثِقَ بِالْعِلْمِ وَلَا نَنْسَاقَ وَرَاءَ الشَّائِعَاتِ الطِّبِّيَّةِ.", "tr": "Yajibu an nathiqa bil-ʿilmi wa lā nansāqa warāʾa ash-shāʾiʿāti aṭ-ṭibbiyyati.", "id": "Kita harus memercayai ilmu dan tidak ikut-ikutan rumor medis.", "t": 33, "em": ""}, {"n": "2839", "ar": "يُعَالِجُ الطَّبِيبُ الْمَرِيضَ لَا الْمَرَضَ فَقَطْ.", "tr": "Yuʿāliju aṭ-ṭabību al-marīḍa lā al-maraḍa faqaṭ.", "id": "Dokter mengobati pasien, bukan hanya penyakitnya.", "t": 33, "em": "🧑‍⚕️"}, {"n": "2840", "ar": "يَجِبُ أَنْ تَكُونَ مَعْلُومَاتُ الصِّحَّةِ الْمَنْشُورَةُ دَقِيقَةً وَمَدْعُومَةً بِالْمَصَادِرِ.", "tr": "Yajibu an takūna maʿlūmātu aṣ-ṣiḥḥati al-manshūratu daqīqatan wa madʿūmatan bil-maṣādiri.", "id": "Informasi kesehatan yang dipublikasikan harus akurat dan didukung sumber.", "t": 33, "em": ""}, {"n": "2841", "ar": "يُعَدُّ التَّحَوُّلُ إِلَى الطَّاقَةِ الْمُتَجَدِّدَةِ ضَرُورَةً لَا خِيَارًا.", "tr": "Yuʿaddu at-taḥawwulu ilā aṭ-ṭāqati al-mutajaddidati ḍarūratan lā khiyāran.", "id": "Beralih ke energi terbarukan dianggap sebagai keharusan, bukan pilihan.", "t": 34, "em": "⚡"}, {"n": "2842", "ar": "تَنْتَشِرُ الْأَلْوَاحُ الشَّمْسِيَّةُ عَلَى أَسْطُحِ الْبُيُوتِ فِي كَثِيرٍ مِنَ الْمُدُنِ.", "tr": "Tantashiru al-alwāḥu ash-shamsiyyatu ʿalā asṭuḥi al-buyūti fī kathīrin mina al-mudūni.", "id": "Panel surya makin tersebar di atap rumah di banyak kota.", "t": 34, "em": "🏠🏙️"}, {"n": "2843", "ar": "يَرْتَفِعُ مُسْتَوَى سَطْحِ الْبَحْرِ بِسَبَبِ ذَوَبَانِ الْجَلِيدِ.", "tr": "Yartafiʿu mustawā saṭḥi al-baḥri bi-sababi dhawabāni al-jalīdi.", "id": "Permukaan laut naik karena mencairnya es.", "t": 34, "em": "🌊"}, {"n": "2844", "ar": "لَنْ نَسْتَطِيعَ إِيقَافَ التَّغَيُّرِ الْمُنَاخِيِّ إِلَّا بِتَعَاوُنٍ دَوْلِيٍّ حَقِيقِيٍّ.", "tr": "Lan nastaṭīʿa īqāfa at-taghayyuri al-munākhiyyi illā bi-taʿāwunin dawliyyin ḥaqīqiyyin.", "id": "Kita tidak akan mampu menghentikan perubahan iklim kecuali dengan kerja sama internasional yang nyata.", "t": 34, "em": "🌍"}, {"n": "2845", "ar": "تَشْهَدُ مِنْطَقَتُنَا مَوْجَاتِ حَرٍّ أَشَدَّ مِنَ الْمُعْتَادِ.", "tr": "Tashhadu minṭaqatunā mawjāti ḥarrin ashadda mina al-muʿtādi.", "id": "Kawasan kami mengalami gelombang panas yang lebih parah dari biasanya.", "t": 34, "em": "☀️"}, {"n": "2846", "ar": "يُمْكِنُ لِكُلِّ فَرْدٍ أَنْ يُقَلِّلَ بَصْمَتَهُ الْكَرْبُونِيَّةَ بِخُطُوَاتٍ بَسِيطَةٍ.", "tr": "Yumkinu li-kulli fardin an yuqallila baṣmatahu al-karbūniyyata bi-khuṭuwātin basīṭatin.", "id": "Setiap individu bisa mengurangi jejak karbonnya dengan langkah sederhana.", "t": 34, "em": ""}, {"n": "2847", "ar": "تَسْتَثْمِرُ الدَّوْلَةُ فِي مَزَارِعِ الرِّيَاحِ لِتَوْلِيدِ الْكَهْرَبَاءِ النَّظِيفَةِ.", "tr": "Tastathmiru ad-dawlatu fī mazāriʿi ar-riyāḥi li-tawlīdi al-kahrabāʾi an-naẓīfati.", "id": "Negara berinvestasi pada ladang angin untuk menghasilkan listrik bersih.", "t": 34, "em": "💨"}, {"n": "2848", "ar": "مِنَ الصَّعْبِ التَّخَلِّي عَنِ الْوَقُودِ الْأَحْفُورِيِّ بَيْنَ لَيْلَةٍ وَضُحَاهَا.", "tr": "Mina aṣ-ṣaʿbi at-takhallī ʿani al-waqūdi al-aḥfūriyyi bayna laylatin wa ḍuḥāhā.", "id": "Sulit meninggalkan bahan bakar fosil dalam semalam.", "t": 34, "em": ""}, {"n": "2849", "ar": "تَسْعَى الشَّرِكَاتُ إِلَى تَقْلِيلِ انْبِعَاثَاتِهَا لِأَنَّ الْمُسْتَهْلِكِينَ يَطْلُبُونَ ذَلِكَ.", "tr": "Tasʿā ash-sharikātu ilā taqlīli inbiʿāthātihā li-anna al-mustahlikīna yaṭlubūna dhālika.", "id": "Perusahaan berupaya mengurangi emisinya karena konsumen menuntutnya.", "t": 34, "em": ""}, {"n": "2850", "ar": "أَثَّرَ الْجَفَافُ فِي مَوَارِدِ الْمِيَاهِ الْعَذْبَةِ فِي الْمِنْطَقَةِ.", "tr": "Aththara al-jafāfu fī mawāridi al-miyāhi al-ʿadhbati fī al-minṭaqati.", "id": "Kekeringan memengaruhi sumber air tawar di kawasan itu.", "t": 34, "em": "💧"}, {"n": "2851", "ar": "يَسْتَطِيعُ الْعِلْمُ أَنْ يَجِدَ حُلُولًا إِذَا تَوَفَّرَتِ الْإِرَادَةُ السِّيَاسِيَّةُ.", "tr": "Yastaṭīʿu al-ʿilmu an yajida ḥulūlan idhā tawaffarati al-irādatu as-siyāsiyyatu.", "id": "Sains dapat menemukan solusi jika ada kemauan politik.", "t": 34, "em": "🔬"}, {"n": "2852", "ar": "تُعَدُّ السَّيَّارَاتُ الْكَهْرَبَائِيَّةُ خُطْوَةً مُهِمَّةً لَكِنَّهَا لَيْسَتِ الْحَلَّ الْوَحِيدَ.", "tr": "Tuʿaddu as-sayyārātu al-kahrabāʾiyyatu khuṭwatan muhimmatan lākinnahā laysati al-ḥalla al-waḥīda.", "id": "Mobil listrik adalah langkah penting tetapi bukan satu-satunya solusi.", "t": 34, "em": "🚗"}, {"n": "2853", "ar": "زَرَعَتِ الْمَدِينَةُ آلَافَ الْأَشْجَارِ لِتَخْفِيفِ حَرَارَةِ الصَّيْفِ.", "tr": "Zaraʿati al-madīnatu ālāfa al-ashjāri li-takhfīfi ḥarārati aṣ-ṣayfi.", "id": "Kota itu menanam ribuan pohon untuk meredakan panas musim panas.", "t": 34, "em": "🏙️🌳"}, {"n": "2854", "ar": "يَجِبُ أَنْ نُعَلِّمَ الْأَجْيَالَ الْقَادِمَةَ كَيْفَ تَحْمِي كَوْكَبَهَا.", "tr": "Yajibu an nuʿallima al-ajyāla al-qādimata kayfa taḥmī kawkabahā.", "id": "Kita harus mengajari generasi mendatang cara melindungi planetnya.", "t": 34, "em": ""}, {"n": "2855", "ar": "تَتَسَابَقُ الدُّوَلُ فِي تَطْوِيرِ بَطَّارِيَّاتٍ أَقْوَى لِتَخْزِينِ الطَّاقَةِ.", "tr": "Tatasābaqu ad-duwalu fī taṭwīri baṭṭāriyyātin aqwā li-takhzīni aṭ-ṭāqati.", "id": "Negara-negara berlomba mengembangkan baterai yang lebih kuat untuk menyimpan energi.", "t": 34, "em": "🔋⚡"}, {"n": "2856", "ar": "نُدْرِكُ الْآنَ أَنَّ الْبِيئَةَ وَالِاقْتِصَادَ لَيْسَا خَصْمَيْنِ بَلْ شَرِيكَانِ.", "tr": "Nudriku al-āna anna al-bīʾata wal-iqtiṣāda laysā khaṣmayni bal sharīkāni.", "id": "Kini kita sadar bahwa lingkungan dan ekonomi bukan lawan tetapi mitra.", "t": 34, "em": "📊"}, {"n": "2857", "ar": "لَا نَمْلِكُ كَوْكَبًا آخَرَ، وَلِهَذَا يَجِبُ أَنْ نَحْمِيَ هَذَا.", "tr": "Lā namliku kawkaban ākhara, wa li-hādhā yajibu an naḥmiya hādhā.", "id": "Kita tidak punya planet lain, karena itu kita harus melindungi yang ini.", "t": 34, "em": ""}, {"n": "2858", "ar": "بَدَأْتُ أُفَكِّرُ فِي أَثَرِ كُلِّ مَا أَشْتَرِيهِ عَلَى الْبِيئَةِ.", "tr": "Badaʾtu ufakkiru fī athari kulli mā ashtarīhi ʿalā al-bīʾati.", "id": "Saya mulai memikirkan dampak setiap yang saya beli terhadap lingkungan.", "t": 34, "em": "🛍️"}, {"n": "2859", "ar": "يَشْتَرِي الْمُسْتَثْمِرُ الْأَسْهُمَ لِيَصِيرَ شَرِيكًا فِي أَرْبَاحِ الشَّرِكَةِ.", "tr": "Yashtarī al-mustathmiru al-ashhuma li-yaṣīra sharīkan fī arbāḥi ash-sharikati.", "id": "Investor membeli saham agar menjadi mitra dalam laba perusahaan.", "t": 35, "em": "🛍️"}, {"n": "2860", "ar": "لَا تَسْتَثْمِرْ مَالًا تَحْتَاجُهُ فِي الْقَرِيبِ.", "tr": "Lā tastathmir mālan taḥtājuhu fī al-qarībi.", "id": "Jangan berinvestasi dengan uang yang kamu butuhkan dalam waktu dekat.", "t": 35, "em": "💵"}, {"n": "2861", "ar": "التَّنْوِيعُ يُقَلِّلُ الْمُخَاطَرَ لَكِنَّهُ لَا يُلْغِيهَا.", "tr": "At-tanwīʿu yuqallilu al-mukhāṭira lākinnahu lā yulghīhā.", "id": "Diversifikasi mengurangi risiko tetapi tidak menghapusnya.", "t": 35, "em": ""}, {"n": "2862", "ar": "تَقَلَّبَتِ الْأَسْوَاقُ بِشِدَّةٍ بَعْدَ إِعْلَانِ الْبَنْكِ الْمَرْكَزِيِّ.", "tr": "Taqallabati al-aswāqu bi-shiddatin baʿda iʿlāni al-banki al-markaziyyi.", "id": "Pasar bergejolak keras setelah pengumuman bank sentral.", "t": 35, "em": "🛒🏦"}, {"n": "2863", "ar": "لَا يُمْكِنُ التَّنَبُّؤُ بِالسُّوقِ بِدِقَّةٍ مَهْمَا كَانَتْ خِبْرَتُنَا.", "tr": "Lā yumkinu at-tanabbuʾu bis-sūqi bi-diqqatin mahmā kānat khibratunā.", "id": "Pasar tidak dapat diprediksi dengan tepat seberapa pun pengalaman kita.", "t": 35, "em": "🛒"}, {"n": "2864", "ar": "يَبْدَأُ بَعْضُهُمْ بِمَبَالِغَ صَغِيرَةٍ لِيَتَعَلَّمُوا قَبْلَ أَنْ يَزِيدُوا.", "tr": "Yabdaʾu baʿḍuhum bi-mabālighin ṣaghīratin li-yataʿallamū qabla an yazīdū.", "id": "Sebagian orang mulai dengan jumlah kecil agar belajar sebelum menambah.", "t": 35, "em": "📚"}, {"n": "2865", "ar": "يَجِبُ أَنْ نَقْرَأَ الْقَوَائِمَ الْمَالِيَّةَ لِلشَّرِكَةِ قَبْلَ شِرَاءِ أَسْهُمِهَا.", "tr": "Yajibu an naqraʾa al-qawāʾima al-māliyyata lish-sharikati qabla shirāʾi ashhumihā.", "id": "Kita harus membaca laporan keuangan perusahaan sebelum membeli sahamnya.", "t": 35, "em": "📖🛍️"}, {"n": "2866", "ar": "تَحْمِي سَنَدَاتُ الْحُكُومَةِ رَأْسَ الْمَالِ لَكِنَّ عَائِدَهَا قَلِيلٌ.", "tr": "Taḥmī sanadātu al-ḥukūmati raʾsa al-māli lākinna ʿāʾidahā qalīlun.", "id": "Obligasi pemerintah melindungi modal tetapi imbal hasilnya kecil.", "t": 35, "em": ""}, {"n": "2867", "ar": "يَجِبُ أَلَّا نَتَّخِذَ قَرَارًا اسْتِثْمَارِيًّا تَحْتَ تَأْثِيرِ الْخَوْفِ أَوِ الطَّمَعِ.", "tr": "Yajibu allā nattakhidha qarāran istithmāriyyan taḥta taʾthīri al-khawfi awi aṭ-ṭamaʿi.", "id": "Kita tidak boleh mengambil keputusan investasi di bawah pengaruh takut atau serakah.", "t": 35, "em": "📈😨"}, {"n": "2868", "ar": "ارْتَفَعَتْ أَسْعَارُ الذَّهَبِ حِينَ ازْدَادَ الْقَلَقُ فِي الْأَسْوَاقِ.", "tr": "Irtafaʿat asʿāru adh-dhahabi ḥīna izdāda al-qalaqu fī al-aswāqi.", "id": "Harga emas naik ketika kecemasan di pasar meningkat.", "t": 35, "em": "🏷️🛒"}, {"n": "2869", "ar": "رَاجَعْتُ مَحْفَظَتِي الِاسْتِثْمَارِيَّةَ وَقَرَّرْتُ إِعَادَةَ تَوْزِيعِ الْأُصُولِ.", "tr": "Rājaʿtu maḥfaẓatī al-istithmāriyyata wa qarrartu iʿādata tawzīʿi al-uṣūli.", "id": "Saya meninjau portofolio investasi saya dan memutuskan mendistribusikan ulang aset.", "t": 35, "em": "📈"}, {"n": "2870", "ar": "يَحْتَاجُ الْمُسْتَثْمِرُ الْمُبْتَدِئُ إِلَى نَصِيحَةِ مُسْتَشَارٍ مَالِيٍّ مَوْثُوقٍ.", "tr": "Yaḥtāju al-mustathmiru al-mubtadiʾu ilā naṣīḥati mustashārin māliyyin mawthūqin.", "id": "Investor pemula membutuhkan nasihat penasihat keuangan tepercaya.", "t": 35, "em": ""}, {"n": "2871", "ar": "لَا تُصَدِّقْ مَنْ يَعِدُكَ بِأَرْبَاحٍ مَضْمُونَةٍ وَسَرِيعَةٍ.", "tr": "Lā tuṣaddiq man yaʿiduka bi-arbāḥin maḍmūnatin wa sarīʿatin.", "id": "Jangan percaya orang yang menjanjikan keuntungan pasti dan cepat.", "t": 35, "em": ""}, {"n": "2872", "ar": "تَنْمُو الْمُدَّخَرَاتُ مَعَ الزَّمَنِ بِفَضْلِ الْفَائِدَةِ الْمُرَكَّبَةِ.", "tr": "Tanmū al-muddakharātu maʿa az-zamani bi-faḍli al-fāʾidati al-murakkabati.", "id": "Tabungan bertumbuh seiring waktu berkat bunga majemuk.", "t": 35, "em": "🐷🌸"}, {"n": "2873", "ar": "هَلْ تُفَضِّلُ الْعَقَارَ أَمِ الْأَسْهُمَ لِلِاسْتِثْمَارِ طَوِيلِ الْأَجَلِ؟", "tr": "Hal tufaḍḍilu al-ʿaqāra ami al-ashhuma lil-istithmāri ṭawīli al-ajali?", "id": "Apakah kamu lebih suka properti atau saham untuk investasi jangka panjang?", "t": 35, "em": "📈"}, {"n": "2874", "ar": "عَلَّمَتْنِي الْأَزْمَةُ الْمَالِيَّةُ أَنْ أَحْتَفِظَ بِسُيُولَةٍ كَافِيَةٍ.", "tr": "ʿAllamatnī al-azmatu al-māliyyatu an aḥtafiẓa bi-suyūlatin kāfiyatin.", "id": "Krisis keuangan mengajari saya menyimpan likuiditas yang cukup.", "t": 35, "em": ""}, {"n": "2875", "ar": "يَتَعَلَّمُ النَّاسُ الِاسْتِثْمَارَ بِالْخِبْرَةِ وَالْأَخْطَاءِ أَكْثَرَ مِنَ الْكُتُبِ.", "tr": "Yataʿallamu an-nāsu al-istithmāra bil-khibrati wal-akhṭāʾi akthara mina al-kutubi.", "id": "Orang belajar berinvestasi dari pengalaman dan kesalahan lebih daripada dari buku.", "t": 35, "em": "📚📖"}, {"n": "2876", "ar": "أَدْرُسُ الْمُخَاطَرَ بِعِنَايَةٍ قَبْلَ أَنْ أَضَعَ أَيَّ مَبْلَغٍ فِي أَيِّ مَشْرُوعٍ.", "tr": "Adrusu al-mukhāṭira bi-ʿināyatin qabla an aḍaʿa ayya mablaghin fī ayyi mashrūʿin.", "id": "Saya mempelajari risiko dengan cermat sebelum menaruh dana pada proyek apa pun.", "t": 35, "em": ""}, {"n": "2877", "ar": "يَبْدَأُ التَّفْكِيرُ الْفَلْسَفِيُّ بِسُؤَالٍ بَسِيطٍ: لِمَاذَا؟", "tr": "Yabdaʾu at-tafkīru al-falsafiyyu bi-suʾālin basīṭin: li-mādhā?", "id": "Pemikiran filosofis dimulai dari pertanyaan sederhana: mengapa?", "t": 36, "em": ""}, {"n": "2878", "ar": "هَلِ الْحُرِّيَّةُ أَنْ نَفْعَلَ مَا نُرِيدُ أَمْ أَنْ نَفْعَلَ مَا يَنْبَغِي؟", "tr": "Hali al-ḥurriyyatu an nafʿala mā nurīdu am an nafʿala mā yanbaghī?", "id": "Apakah kebebasan itu melakukan apa yang kita mau atau apa yang seharusnya?", "t": 36, "em": ""}, {"n": "2879", "ar": "لَا يَكْفِي أَنْ نَعِيشَ، بَلْ يَجِبُ أَنْ نَسْأَلَ لِمَاذَا نَعِيشُ.", "tr": "Lā yakfī an naʿīsha, bal yajibu an nasʾala li-mādhā naʿīshu.", "id": "Tidak cukup hanya hidup, kita harus bertanya mengapa kita hidup.", "t": 36, "em": ""}, {"n": "2880", "ar": "تُعَلِّمُنَا الْفَلْسَفَةُ أَنْ نُشَكِّكَ فِي الْمُسَلَّمَاتِ وَنَبْحَثَ عَنِ الدَّلِيلِ.", "tr": "Tuʿallimunā al-falsafatu an nushakkika fī al-musallamāti wa nabḥatha ʿani ad-dalīli.", "id": "Filsafat mengajari kita meragukan hal-hal yang dianggap pasti dan mencari bukti.", "t": 36, "em": "🔍"}, {"n": "2881", "ar": "مَا مَعْنَى السَّعَادَةِ؟ كُلُّ إِنْسَانٍ يُجِيبُ بِطَرِيقَتِهِ.", "tr": "Mā maʿnā as-saʿādati? Kullu insānin yujību bi-ṭarīqatihi.", "id": "Apa makna kebahagiaan? Setiap orang menjawab dengan caranya.", "t": 36, "em": ""}, {"n": "2882", "ar": "قَدْ يَخْتَلِفُ الصَّوَابُ بِاخْتِلَافِ الْمَنْظُورِ وَالسِّيَاقِ.", "tr": "Qad yakhtalifu aṣ-ṣawābu bi-ikhtilāfi al-manẓūri was-siyāqi.", "id": "Kebenaran bisa berbeda tergantung sudut pandang dan konteks.", "t": 36, "em": ""}, {"n": "2883", "ar": "الْعَقْلُ يُحَلِّلُ، وَالْقَلْبُ يَشْعُرُ، وَالْحِكْمَةُ تَجْمَعُ بَيْنَهُمَا.", "tr": "Al-ʿaqlu yuḥallilu, wal-qalbu yashʿuru, wal-ḥikmatu tajmaʿu baynahumā.", "id": "Akal menganalisis, hati merasakan, dan kebijaksanaan memadukan keduanya.", "t": 36, "em": ""}, {"n": "2884", "ar": "مَنْ يُجِيبُ عَنْ كُلِّ سُؤَالٍ بِسُرْعَةٍ قَلَّمَا يُفَكِّرُ بِعُمْقٍ.", "tr": "Man yujību ʿan kulli suʾālin bi-surʿatin qallamā yufakkiru bi-ʿumqin.", "id": "Siapa menjawab setiap pertanyaan dengan cepat jarang berpikir mendalam.", "t": 36, "em": ""}, {"n": "2885", "ar": "لَا بُدَّ أَنْ نُمَيِّزَ بَيْنَ مَا نَعْرِفُهُ وَمَا نَظُنُّ أَنَّنَا نَعْرِفُهُ.", "tr": "Lā budda an numayyiza bayna mā naʿrifuhu wa mā naẓunnu annanā naʿrifuhu.", "id": "Kita perlu membedakan antara apa yang kita ketahui dan apa yang kita kira kita ketahui.", "t": 36, "em": ""}, {"n": "2886", "ar": "قَالَ الْفَيْلَسُوفُ إِنَّ الْحَيَاةَ غَيْرَ الْمَفْحُوصَةِ لَا تَسْتَحِقُّ أَنْ تُعَاشَ.", "tr": "Qāla al-faylasūfu inna al-ḥayāta ghayra al-mafḥūṣati lā tastaḥiqqu an tuʿāsha.", "id": "Filsuf itu berkata bahwa hidup yang tidak dikaji tidak layak dijalani.", "t": 36, "em": ""}, {"n": "2887", "ar": "الصَّمْتُ أَحْيَانًا أَبْلَغُ مِنَ الْكَلَامِ.", "tr": "Aṣ-ṣamtu aḥyānan ablaghu mina al-kalāmi.", "id": "Diam kadang lebih fasih daripada bicara.", "t": 36, "em": ""}, {"n": "2888", "ar": "لِكُلِّ ثَقَافَةٍ رُؤْيَتُهَا لِلْحَيَاةِ وَالْمَوْتِ وَالْخَيْرِ وَالشَّرِّ.", "tr": "Li-kulli thaqāfatin ruʾyatuhā lil-ḥayāti wal-mawti wal-khayri wash-sharri.", "id": "Setiap budaya punya pandangannya tentang hidup, mati, baik, dan buruk.", "t": 36, "em": ""}, {"n": "2889", "ar": "إِذَا كَانَ الْجَمِيعُ يُفَكِّرُونَ بِالطَّرِيقَةِ نَفْسِهَا فَلَا أَحَدَ يُفَكِّرُ حَقًّا.", "tr": "Idhā kāna al-jamīʿu yufakkirūna biṭ-ṭarīqati nafsihā fa-lā aḥada yufakkiru ḥaqqan.", "id": "Jika semua orang berpikir dengan cara yang sama, maka tidak ada yang benar-benar berpikir.", "t": 36, "em": ""}, {"n": "2890", "ar": "السُّؤَالُ الْجَيِّدُ أَثْمَنُ مِنْ إِجَابَةٍ سَرِيعَةٍ.", "tr": "As-suʾālu al-jayyidu athmanu min ijābatin sarīʿatin.", "id": "Pertanyaan yang baik lebih berharga daripada jawaban cepat.", "t": 36, "em": ""}, {"n": "2891", "ar": "هَلِ الْأَخْلَاقُ مُطْلَقَةٌ أَمْ نِسْبِيَّةٌ؟ يَخْتَلِفُ الْمُفَكِّرُونَ فِي ذَلِكَ.", "tr": "Hali al-akhlāqu muṭlaqatun am nisbiyyatun? Yakhtalifu al-mufakkirūna fī dhālika.", "id": "Apakah akhlak itu mutlak atau relatif? Para pemikir berbeda pendapat dalam hal itu.", "t": 36, "em": ""}, {"n": "2892", "ar": "نَتَعَلَّمُ مِنَ التَّارِيخِ أَنَّ الْأَفْكَارَ قَدْ تُغَيِّرُ الْعَالَمَ.", "tr": "Nataʿallamu mina at-tārīkhi anna al-afkāra qad tughayyiru al-ʿālama.", "id": "Kita belajar dari sejarah bahwa gagasan dapat mengubah dunia.", "t": 36, "em": "📚"}, {"n": "2893", "ar": "الْحُرِّيَّةُ مَسْؤُولِيَّةٌ قَبْلَ أَنْ تَكُونَ امْتِيَازًا.", "tr": "Al-ḥurriyyatu masʾūliyyatun qabla an takūna imtiyāzan.", "id": "Kebebasan adalah tanggung jawab sebelum menjadi keistimewaan.", "t": 36, "em": ""}, {"n": "2894", "ar": "قَدْ يَكُونُ الْفَهْمُ الْعَمِيقُ لِلْآخَرِينَ أَصْعَبَ مِنَ الْفَهْمِ الْعَمِيقِ لِلنَّفْسِ.", "tr": "Qad yakūnu al-fahmu al-ʿamīqu lil-ākharīna aṣʿaba mina al-fahmi al-ʿamīqi lin-nafsi.", "id": "Memahami orang lain secara mendalam mungkin lebih sulit daripada memahami diri sendiri.", "t": 36, "em": ""}, {"n": "2895", "ar": "تَصِلُ الْمُوسِيقَى إِلَى الْقَلْبِ دُونَ حَاجَةٍ إِلَى تَرْجَمَةٍ.", "tr": "Taṣilu al-mūsīqā ilā al-qalbi dūna ḥājatin ilā tarjamatin.", "id": "Musik sampai ke hati tanpa perlu terjemahan.", "t": 37, "em": "🎵"}, {"n": "2896", "ar": "زُرْتُ مَعْرِضًا لِلْفَنِّ الْمُعَاصِرِ وَلَمْ أَفْهَمْ بَعْضَ الْأَعْمَالِ.", "tr": "Zurtu maʿriḍan lil-fanni al-muʿāṣiri wa lam afham baʿḍa al-aʿmāli.", "id": "Saya mengunjungi pameran seni kontemporer dan tidak memahami sebagian karyanya.", "t": 37, "em": "🎨"}, {"n": "2897", "ar": "يَعْزِفُ ابْنِي عَلَى الْعُودِ مُنْذُ ثَلَاثِ سَنَوَاتٍ وَقَدْ تَحَسَّنَ كَثِيرًا.", "tr": "Yaʿzifu ibnī ʿalā al-ʿūdi mundhu thalāthi sanawātin wa qad taḥassana kathīran.", "id": "Anak saya bermain oud sejak tiga tahun dan sudah sangat membaik.", "t": 37, "em": "🧒"}, {"n": "2898", "ar": "تَحْتَاجُ الْمَوْهِبَةُ إِلَى التَّدْرِيبِ لِتَصِيرَ مَهَارَةً.", "tr": "Taḥtāju al-mawhibatu ilā at-tadrībi li-taṣīra mahāratan.", "id": "Bakat membutuhkan latihan agar menjadi keterampilan.", "t": 37, "em": ""}, {"n": "2899", "ar": "أَسْتَمِعُ إِلَى الْمُوسِيقَى حِينَ أَشْعُرُ بِالتَّوَتُّرِ فَتُهَدِّئُنِي.", "tr": "Astamiʿu ilā al-mūsīqā ḥīna ashʿuru bit-tawatturi fa-tuhaddiʾunī.", "id": "Saya mendengarkan musik ketika merasa tegang dan itu menenangkan saya.", "t": 37, "em": "🎵"}, {"n": "2900", "ar": "يَرْسُمُ الْفَنَّانُ مَشَاعِرَهُ عَلَى اللَّوْحَةِ بِأَلْوَانٍ جَرِيئَةٍ.", "tr": "Yarsumu al-fannānu mashāʿirahu ʿalā al-lawḥati bi-alwānin jarīʾatin.", "id": "Sang seniman melukiskan perasaannya di kanvas dengan warna-warna berani.", "t": 37, "em": ""}, {"n": "2901", "ar": "تُقَامُ الْحَفَلَاتُ الْمُوسِيقِيَّةُ فِي السَّاحَةِ الْكَبِيرَةِ كُلَّ جُمُعَةٍ.", "tr": "Tuqāmu al-ḥafalātu al-mūsīqiyyatu fī as-sāḥati al-kabīrati kulla jumuʿatin.", "id": "Konser musik diadakan di alun-alun besar setiap Jumat.", "t": 37, "em": "🎵"}, {"n": "2902", "ar": "بِيعَتِ اللَّوْحَةُ بِمَبْلَغٍ كَبِيرٍ فِي الْمَزَادِ.", "tr": "Bīʿat al-lawḥatu bi-mablaghin kabīrin fī al-mazādi.", "id": "Lukisan itu terjual dengan harga tinggi dalam lelang.", "t": 37, "em": "🖼️🏷️"}, {"n": "2903", "ar": "يَدْرُسُ الطُّلَّابُ تَارِيخَ الْفَنِّ لِيَفْهَمُوا الْمَدَارِسَ الْمُخْتَلِفَةَ.", "tr": "Yadrusu aṭ-ṭullābu tārīkha al-fanni li-yafhamū al-madārisa al-mukhtalifata.", "id": "Para mahasiswa mempelajari sejarah seni agar memahami berbagai aliran.", "t": 37, "em": "🧑‍🎓🎨"}, {"n": "2904", "ar": "يُفَضِّلُ بَعْضُ النَّاسِ الْمُوسِيقَى الْكَلَاسِيكِيَّةَ وَيُفَضِّلُ آخَرُونَ الْحَدِيثَةَ.", "tr": "Yufaḍḍilu baʿḍu an-nāsi al-mūsīqā al-klāsīkiyyata wa yufaḍḍilu ākharūna al-ḥadīthata.", "id": "Sebagian orang menyukai musik klasik dan yang lain menyukai musik modern.", "t": 37, "em": "🎵"}, {"n": "2905", "ar": "الْخَطُّ الْعَرَبِيُّ فَنٌّ يَجْمَعُ بَيْنَ الْكِتَابَةِ وَالزُّخْرُفَةِ.", "tr": "Al-khaṭṭu al-ʿarabiyyu fannun yajmaʿu bayna al-kitābati waz-zukhrufati.", "id": "Kaligrafi Arab adalah seni yang memadukan tulisan dan ornamen.", "t": 37, "em": "🎨"}, {"n": "2906", "ar": "الْفَنَّانُ الْحَقِيقِيُّ يُبْدِعُ حَتَّى حِينَ لَا يَجِدُ جُمْهُورًا.", "tr": "Al-fannānu al-ḥaqīqiyyu yubdiʿu ḥattā ḥīna lā yajidu jumhūran.", "id": "Seniman sejati berkarya meskipun tidak menemukan penonton.", "t": 37, "em": ""}, {"n": "2907", "ar": "لَا أَسْتَطِيعُ الْعَمَلَ دُونَ مُوسِيقَى هَادِئَةٍ فِي الْخَلْفِيَّةِ.", "tr": "Lā astaṭīʿu al-ʿamala dūna mūsīqā hādiʾatin fī al-khalfiyyati.", "id": "Saya tidak bisa bekerja tanpa musik tenang di latar belakang.", "t": 37, "em": "🎵😌"}, {"n": "2908", "ar": "تَعَلَّمْتُ مِنَ الرَّسْمِ أَنْ أَنْظُرَ إِلَى التَّفَاصِيلِ.", "tr": "Taʿallamtu mina ar-rasmi an anẓura ilā at-tafāṣīli.", "id": "Saya belajar dari menggambar untuk memperhatikan detail.", "t": 37, "em": "📚"}, {"n": "2909", "ar": "يَجْمَعُ الْمِهْرَجَانُ فَنَّانِينَ مِنْ ثَقَافَاتٍ مُتَنَوِّعَةٍ.", "tr": "Yajmaʿu al-mihrajānu fannānīna min thaqāfātin mutanawwiʿatin.", "id": "Festival itu mengumpulkan seniman dari beragam budaya.", "t": 37, "em": ""}, {"n": "2910", "ar": "يُعَبِّرُ الْإِنْسَانُ عَنْ نَفْسِهِ بِالْفَنِّ حِينَ تَعْجِزُ الْكَلِمَاتُ.", "tr": "Yuʿabbiru al-insānu ʿan nafsihi bil-fanni ḥīna taʿjizu al-kalimātu.", "id": "Manusia mengungkapkan dirinya lewat seni ketika kata-kata tak mampu.", "t": 37, "em": "🎨"}, {"n": "2911", "ar": "يُعَلِّمُ الْفَنُّ الْأَطْفَالَ الصَّبْرَ وَالتَّعْبِيرَ عَنْ أَنْفُسِهِمْ.", "tr": "Yuʿallimu al-fannu al-aṭfāla aṣ-ṣabra wat-taʿbīra ʿan anfusihim.", "id": "Seni mengajari anak kesabaran dan mengungkapkan diri.", "t": 37, "em": "🎨🧒"}, {"n": "2912", "ar": "لَكُلِّ أُغْنِيَةٍ ذِكْرَى تَرْبِطُنِي بِزَمَنٍ مُعَيَّنٍ.", "tr": "Li-kulli ughniyatin dhikrā tarbiṭunī bi-zamanin muʿayyanin.", "id": "Setiap lagu punya kenangan yang mengikat saya dengan masa tertentu.", "t": 37, "em": "🎶"}, {"n": "2913", "ar": "الضَّغْطُ الدَّائِمُ فِي الْعَمَلِ قَدْ يَقُودُ إِلَى الْإِرْهَاقِ النَّفْسِيِّ.", "tr": "Aḍ-ḍaghṭu ad-dāʾimu fī al-ʿamali qad yaqūdu ilā al-irhāqi an-nafsiyyi.", "id": "Tekanan terus-menerus di tempat kerja bisa menyebabkan kelelahan mental.", "t": 38, "em": ""}, {"n": "2914", "ar": "مِنَ الْمُهِمِّ أَنْ نَفْصِلَ بَيْنَ وَقْتِ الْعَمَلِ وَوَقْتِ الرَّاحَةِ.", "tr": "Mina al-muhimmi an nafṣila bayna waqti al-ʿamali wa waqti ar-rāḥati.", "id": "Penting memisahkan antara waktu kerja dan waktu istirahat.", "t": 38, "em": "🛋️"}, {"n": "2915", "ar": "عَلَى الْمُدِيرِ أَنْ يُرَاعِيَ ظُرُوفَ مُوَظَّفِيهِ وَلَا يُحَمِّلَهُمْ فَوْقَ طَاقَتِهِمْ.", "tr": "ʿAlā al-mudīri an yurāʿiya ẓurūfa muwaẓẓafīhi wa lā yuḥammilahum fawqa ṭāqatihim.", "id": "Manajer harus memperhatikan keadaan karyawannya dan tidak membebani mereka melebihi kemampuan.", "t": 38, "em": "🧑‍💼"}, {"n": "2916", "ar": "أَشْعُرُ بِأَنَّ جُهْدِي لَا يُقَدَّرُ فِي هَذِهِ الشَّرِكَةِ.", "tr": "Ashʿuru bi-anna juhdī lā yuqaddaru fī hādhihi ash-sharikati.", "id": "Saya merasa usaha saya tidak dihargai di perusahaan ini.", "t": 38, "em": ""}, {"n": "2917", "ar": "الْعَمَلُ فِي بِيئَةٍ إِيجَابِيَّةٍ يَزِيدُ السَّعَادَةَ وَالْإِبْدَاعَ.", "tr": "Al-ʿamalu fī bīʾatin ījābiyyatin yazīdu as-saʿādata wal-ibdāʿa.", "id": "Bekerja di lingkungan positif meningkatkan kebahagiaan dan kreativitas.", "t": 38, "em": ""}, {"n": "2918", "ar": "وَضَعْتُ حُدُودًا وَاضِحَةً بَيْنَ حَيَاتِي الْمِهْنِيَّةِ وَالشَّخْصِيَّةِ.", "tr": "Waḍaʿtu ḥudūdan wāḍiḥatan bayna ḥayātī al-mihaniyyati wash-shakhṣiyyati.", "id": "Saya menetapkan batas jelas antara kehidupan profesional dan pribadi.", "t": 38, "em": ""}, {"n": "2919", "ar": "اسْتَقَلْتُ مِنْ عَمَلِي لِأَنَّ الْبِيئَةَ كَانَتْ سَامَّةً.", "tr": "Istaqaltu min ʿamalī li-anna al-bīʾata kānat sāmmatan.", "id": "Saya mengundurkan diri dari pekerjaan karena lingkungannya beracun.", "t": 38, "em": ""}, {"n": "2920", "ar": "يَحْتَاجُ الْمُوَظَّفُ أَحْيَانًا إِلَى مَنْ يَسْمَعُهُ دُونَ أَنْ يَحْكُمَ عَلَيْهِ.", "tr": "Yaḥtāju al-muwaẓẓafu aḥyānan ilā man yasmaʿuhu dūna an yaḥkuma ʿalayhi.", "id": "Karyawan terkadang butuh orang yang mendengarnya tanpa menghakimi.", "t": 38, "em": "🧑‍💼"}, {"n": "2921", "ar": "مِنَ الطَّبِيعِيِّ أَنْ نَشْعُرَ بِالْقَلَقِ قَبْلَ أَيِّ مُهِمَّةٍ كَبِيرَةٍ.", "tr": "Mina aṭ-ṭabīʿiyyi an nashʿura bil-qalaqi qabla ayyi muhimmatin kabīratin.", "id": "Wajar jika kita merasa cemas sebelum tugas besar apa pun.", "t": 38, "em": "😟"}, {"n": "2922", "ar": "الِاسْتِرَاحَاتُ الْقَصِيرَةُ تُجَدِّدُ تَرْكِيزَنَا وَتَرْفَعُ إِنْتَاجِيَّتَنَا.", "tr": "Al-istirāḥātu al-qaṣīratu tujaddidu tarkīzanā wa tarfaʿu intājiyyatanā.", "id": "Istirahat singkat memulihkan fokus dan meningkatkan produktivitas kita.", "t": 38, "em": "🛋️"}, {"n": "2923", "ar": "يَنْجَحُ الْفَرِيقُ الَّذِي يَشْعُرُ أَعْضَاؤُهُ بِالْأَمَانِ فِي التَّعْبِيرِ عَنْ آرَائِهِمْ.", "tr": "Yanjaḥu al-farīqu alladhī yashʿuru aʿḍāʾuhu bil-amāni fī at-taʿbīri ʿan ārāʾihim.", "id": "Tim yang anggotanya merasa aman mengutarakan pendapat akan berhasil.", "t": 38, "em": "👥"}, {"n": "2924", "ar": "رَغْمَ كَثْرَةِ الْمَهَامِّ، حَاوَلْتُ أَنْ أَحْتَفِظَ بِهُدُوئِي وَأُرَتِّبَ أَوْلَوِيَّاتِي.", "tr": "Raghma kathrati al-mahāmmi, ḥāwaltu an aḥtafiẓa bi-hudūʾī wa urattiba awlawiyyātī.", "id": "Meskipun tugas banyak, saya berusaha tetap tenang dan menata prioritas.", "t": 38, "em": "😌"}, {"n": "2925", "ar": "لَا تَتَرَدَّدْ فِي طَلَبِ الْمُسَاعَدَةِ حِينَ تُحِسُّ بِأَنَّكَ لَا تَسْتَطِيعُ التَّحَمُّلَ.", "tr": "Lā tataraddad fī ṭalabi al-musāʿadati ḥīna tuḥissu bi-annaka lā tastaṭīʿu at-taḥammula.", "id": "Jangan ragu meminta bantuan ketika kamu merasa tidak sanggup menanggung.", "t": 38, "em": ""}, {"n": "2926", "ar": "تُسَاعِدُنِي الرِّيَاضَةُ عَلَى تَصْرِيفِ التَّوَتُّرِ الَّذِي أَجْمَعُهُ فِي الْعَمَلِ.", "tr": "Tusāʿidunī ar-riyāḍatu ʿalā taṣrīfi at-tawatturi alladhī ajmaʿuhu fī al-ʿamali.", "id": "Olahraga membantu saya melepaskan ketegangan yang saya kumpulkan di tempat kerja.", "t": 38, "em": "🏃"}, {"n": "2927", "ar": "التَّقْدِيرُ الصَّادِقُ مِنَ الْمُدِيرِ يُغَيِّرُ شُعُورَ الْمُوَظَّفِ بِعَمَلِهِ.", "tr": "At-taqdīru aṣ-ṣādiqu mina al-mudīri yughayyiru shuʿūra al-muwaẓẓafi bi-ʿamalihi.", "id": "Penghargaan tulus dari manajer mengubah perasaan karyawan terhadap pekerjaannya.", "t": 38, "em": "🧑‍💼"}, {"n": "2928", "ar": "يَنْبَغِي أَنْ تَتَوَفَّرَ لِلْمُوَظَّفِينَ مَسَاحَةٌ آمِنَةٌ لِلْحَدِيثِ عَنْ ضُغُوطِهِمْ.", "tr": "Yanbaghī an tatawaffara lil-muwaẓẓafīna masāḥatun āminatun lil-ḥadīthi ʿan ḍughūṭihim.", "id": "Karyawan sebaiknya memiliki ruang aman untuk membicarakan tekanan mereka.", "t": 38, "em": "🧑‍💼"}, {"n": "2929", "ar": "حِينَ أَنْتَهِي مِنَ الْعَمَلِ أُغْلِقُ الْحَاسُوبَ وَلَا أَفْتَحُ الْبَرِيدَ حَتَّى الصَّبَاحِ.", "tr": "Ḥīna antahī mina al-ʿamali ughliqu al-ḥāsūba wa lā aftaḥu al-barīda ḥattā aṣ-ṣabāḥi.", "id": "Ketika selesai bekerja, saya menutup komputer dan tidak membuka surel sampai pagi.", "t": 38, "em": "💻🌅"}, {"n": "2930", "ar": "يَظْهَرُ الِاحْتِرَاقُ الْوَظِيفِيُّ حِينَ نَشْعُرُ بِأَنَّ جُهْدَنَا لَا يَنْتَهِي وَلَا يُثْمِرُ.", "tr": "Yaẓharu al-iḥtirāqu al-waẓīfiyyu ḥīna nashʿuru bi-anna juhdanā lā yantahī wa lā yuthmiru.", "id": "Kelelahan kerja muncul ketika kita merasa usaha kita tak berujung dan tidak berbuah.", "t": 38, "em": ""}, {"n": "2931", "ar": "لَا تَعْرِفُ الْأَزَمَاتُ الْعَالَمِيَّةُ حُدُودًا، وَلِذَلِكَ يَجِبُ أَنْ تَكُونَ الْحُلُولُ عَالَمِيَّةً.", "tr": "Lā taʿrifu al-azamātu al-ʿālamiyyatu ḥudūdan, wa li-dhālika yajibu an takūna al-ḥulūlu ʿālamiyyatan.", "id": "Krisis global tidak mengenal batas, karena itu solusinya harus global.", "t": 39, "em": ""}, {"n": "2932", "ar": "أَظْهَرَتِ الْجَائِحَةُ مَدَى تَرَابُطِ الْعَالَمِ وَهَشَاشَةِ نُظُمِهِ.", "tr": "Aẓharati al-jāʾiḥatu madā tarābuṭi al-ʿālami wa hashāshati nuẓumihi.", "id": "Pandemi menunjukkan betapa terhubungnya dunia dan rapuhnya sistemnya.", "t": 39, "em": ""}, {"n": "2933", "ar": "تُرْسِلُ الْمُنَظَّمَاتُ الدَّوْلِيَّةُ مُسَاعَدَاتٍ إِنْسَانِيَّةً إِلَى الْمَنَاطِقِ الْمُتَضَرِّرَةِ.", "tr": "Tursilu al-munaẓẓamātu ad-dawliyyatu musāʿadātin insāniyyatan ilā al-manāṭiqi al-mutaḍarrirati.", "id": "Organisasi internasional mengirim bantuan kemanusiaan ke daerah-daerah terdampak.", "t": 39, "em": ""}, {"n": "2934", "ar": "يَهْرُبُ آلَافُ النَّاسِ مِنَ الْحُرُوبِ بَحْثًا عَنِ الْأَمَانِ.", "tr": "Yahrubu ālāfu an-nāsi mina al-ḥurūbi baḥthan ʿani al-amāni.", "id": "Ribuan orang melarikan diri dari perang mencari keamanan.", "t": 39, "em": "🔍"}, {"n": "2935", "ar": "تُسْهِمُ الدِّبْلُومَاسِيَّةُ فِي حَلِّ النِّزَاعَاتِ قَبْلَ أَنْ تَتَحَوَّلَ إِلَى حُرُوبٍ.", "tr": "Tus-himu ad-diblūmāsiyyatu fī ḥalli an-nizāʿāti qabla an tataḥawwala ilā ḥurūbin.", "id": "Diplomasi berperan menyelesaikan sengketa sebelum berubah menjadi perang.", "t": 39, "em": ""}, {"n": "2936", "ar": "ارْتَفَعَتْ أَسْعَارُ الْغِذَاءِ عَالَمِيًّا بِسَبَبِ الْحُرُوبِ وَاضْطِرَابِ سَلَاسِلِ الْإِمْدَادِ.", "tr": "Irtafaʿat asʿāru al-ghidhāʾi ʿālamiyyan bi-sababi al-ḥurūbi waḍṭirābi salāsili al-imdādi.", "id": "Harga pangan naik secara global akibat perang dan gangguan rantai pasok.", "t": 39, "em": "🏷️"}, {"n": "2937", "ar": "لَا يُمْكِنُ لِدَوْلَةٍ وَاحِدَةٍ أَنْ تُوَاجِهَ تَغَيُّرَ الْمُنَاخِ وَحْدَهَا.", "tr": "Lā yumkinu li-dawlatin wāḥidatin an tuwājiha taghayyura al-munākhi waḥdahā.", "id": "Satu negara saja tidak mungkin menghadapi perubahan iklim sendirian.", "t": 39, "em": "🌍"}, {"n": "2938", "ar": "تَعْمَلُ الْجَامِعَاتُ مَعًا عَلَى أَبْحَاثٍ تُفِيدُ الْإِنْسَانِيَّةَ كُلَّهَا.", "tr": "Taʿmalu al-jāmiʿātu maʿan ʿalā abḥāthin tufīdu al-insāniyyata kullahā.", "id": "Universitas-universitas bekerja sama dalam penelitian yang bermanfaat bagi seluruh umat manusia.", "t": 39, "em": "🎓🔬"}, {"n": "2939", "ar": "عَلَيْنَا أَنْ نَتَحَقَّقَ مِنَ الْأَخْبَارِ فِي أَوْقَاتِ الْأَزَمَاتِ لِأَنَّ الشَّائِعَاتِ تَنْتَشِرُ بِسُرْعَةٍ.", "tr": "ʿAlaynā an nataḥaqqaqa mina al-akhbāri fī awqāti al-azamāti li-anna ash-shāʾiʿāti tantashiru bi-surʿatin.", "id": "Kita harus memeriksa berita di masa krisis karena rumor menyebar cepat.", "t": 39, "em": "📰"}, {"n": "2940", "ar": "يَتَطَوَّعُ الشَّبَابُ فِي مُخَيَّمَاتِ الْإِغَاثَةِ لِيُسَاعِدُوا مَنْ فَقَدُوا بُيُوتَهُمْ.", "tr": "Yataṭawwaʿu ash-shababu fī mukhayyamāti al-ighāthati li-yusāʿidū man faqadū buyūtahum.", "id": "Pemuda menjadi sukarelawan di kamp bantuan untuk menolong yang kehilangan rumah.", "t": 39, "em": "🏠"}, {"n": "2941", "ar": "السَّلَامُ لَا يَعْنِي غِيَابَ الْحَرْبِ فَقَطْ، بَلْ وُجُودَ الْعَدْلِ وَالْكَرَامَةِ.", "tr": "As-salāmu lā yaʿnī ghiyāba al-ḥarbi faqaṭ, bal wujūda al-ʿadli wal-karāmati.", "id": "Perdamaian tidak hanya berarti tidak adanya perang, tetapi adanya keadilan dan martabat.", "t": 39, "em": ""}, {"n": "2942", "ar": "تَحْتَاجُ الدُّوَلُ النَّامِيَةُ إِلَى دَعْمٍ تِقْنِيٍّ لَا إِلَى مُسَاعَدَاتٍ مُؤَقَّتَةٍ فَقَطْ.", "tr": "Taḥtāju ad-duwalu an-nāmiyatu ilā daʿmin tiqniyyin lā ilā musāʿadātin muʾaqqatatin faqaṭ.", "id": "Negara berkembang membutuhkan dukungan teknologi, bukan hanya bantuan sementara.", "t": 39, "em": ""}, {"n": "2943", "ar": "لَوْ تَعَاوَنَّا أَكْثَرَ لَتَجَنَّبْنَا كَثِيرًا مِنَ الْخَسَائِرِ.", "tr": "Law taʿāwannā akthara latajannabnā kathīran mina al-khasāʾiri.", "id": "Seandainya kita lebih banyak bekerja sama, kita akan menghindari banyak kerugian.", "t": 39, "em": ""}, {"n": "2944", "ar": "نَتَشَارَكُ جَمِيعًا هَذَا الْكَوْكَبَ، وَمُسْتَقْبَلُنَا مُرْتَبِطٌ بِبَعْضِنَا.", "tr": "Natashāraku jamīʿan hādhā al-kawkaba, wa mustaqbalunā murtabiṭun bi-baʿḍinā.", "id": "Kita semua berbagi planet ini, dan masa depan kita saling terkait.", "t": 39, "em": ""}, {"n": "2945", "ar": "تُنَسِّقُ الدُّوَلُ جُهُودَهَا لِمُكَافَحَةِ الْأَوْبِئَةِ قَبْلَ أَنْ تَنْتَشِرَ عَبْرَ الْحُدُودِ.", "tr": "Tunassiqu ad-duwalu juhūdahā li-mukāfaḥati al-awbiʾati qabla an tantashira ʿabra al-ḥudūdi.", "id": "Negara-negara mengoordinasikan upaya melawan wabah sebelum menyebar lintas batas.", "t": 39, "em": ""}, {"n": "2946", "ar": "يَحْتَاجُ اللَّاجِئُونَ إِلَى التَّعْلِيمِ وَالْعَمَلِ وَلَيْسَ إِلَى الطَّعَامِ وَحْدَهُ.", "tr": "Yaḥtāju al-lājiʾūna ilā at-taʿlīmi wal-ʿamali wa laysa ilā aṭ-ṭaʿāmi waḥdahu.", "id": "Para pengungsi membutuhkan pendidikan dan pekerjaan, bukan hanya makanan.", "t": 39, "em": "🍽️"}, {"n": "2947", "ar": "إِذَا تَضَرَّرَ جَارُكَ فَسَيَنْعَكِسُ ذَلِكَ عَلَيْكَ عَاجِلًا أَمْ آجِلًا.", "tr": "Idhā taḍarrara jāruka fa-sayanʿakisu dhālika ʿalayka ʿājilan am ājilan.", "id": "Jika tetanggamu dirugikan, hal itu akan berdampak padamu cepat atau lambat.", "t": 39, "em": "🏘️"}, {"n": "2948", "ar": "تَبْذُلُ الْمُنَظَّمَاتُ الْإِنْسَانِيَّةُ جُهْدًا كَبِيرًا رَغْمَ نَقْصِ التَّمْوِيلِ.", "tr": "Tabdhulu al-munaẓẓamātu al-insāniyyatu juhdan kabīran raghma naqṣi at-tamwīli.", "id": "Organisasi kemanusiaan mencurahkan usaha besar meskipun kekurangan dana.", "t": 39, "em": ""}, {"n": "2949", "ar": "يَنْشَأُ الِابْتِكَارُ مِنْ مُشْكِلَةٍ حَقِيقِيَّةٍ تَبْحَثُ عَنْ حَلٍّ ذَكِيٍّ.", "tr": "Yanshaʾu al-ibtikāru min mushkilatin ḥaqīqiyyatin tabḥathu ʿan ḥallin dhakiyyin.", "id": "Inovasi lahir dari masalah nyata yang mencari solusi cerdas.", "t": 40, "em": "🔍"}, {"n": "2950", "ar": "طَوَّرَ الْفَرِيقُ نَمُوذَجًا أَوَّلِيًّا لِلْمُنْتَجِ وَجَرَّبَهُ مَعَ مُسْتَخْدِمِينَ حَقِيقِيِّينَ.", "tr": "Ṭawwara al-farīqu namūdhajan awwaliyyan lil-muntaji wa jarrabahu maʿa mustakhdimīna ḥaqīqiyyīna.", "id": "Tim itu mengembangkan prototipe produk dan mengujinya dengan pengguna nyata.", "t": 40, "em": "👥"}, {"n": "2951", "ar": "لَا يَكْفِي أَنْ تَكُونَ الْفِكْرَةُ جَدِيدَةً بَلْ يَجِبُ أَنْ تَكُونَ مُفِيدَةً.", "tr": "Lā yakfī an takūna al-fikratu jadīdatan bal yajibu an takūna mufīdatan.", "id": "Tidak cukup ide itu baru, ia harus bermanfaat.", "t": 40, "em": ""}, {"n": "2952", "ar": "تُشَجِّعُ بَعْضُ الشَّرِكَاتِ مُوَظَّفِيهَا عَلَى تَجْرِبَةِ أَفْكَارٍ جَدِيدَةٍ حَتَّى لَوْ فَشِلَتْ.", "tr": "Tushajjiʿu baʿḍu ash-sharikāti muwaẓẓafīhā ʿalā tajribati afkārin jadīdatin ḥattā law fashilat.", "id": "Sebagian perusahaan mendorong karyawannya mencoba ide baru meskipun gagal.", "t": 40, "em": "🧑‍💼"}, {"n": "2953", "ar": "يُحَوِّلُ الْبَاحِثُونَ نَتَائِجَ الْمُخْتَبَرِ إِلَى مُنْتَجَاتٍ تَخْدُمُ النَّاسَ.", "tr": "Yuḥawwilu al-bāḥithūna natāʾija al-mukhtabari ilā muntajātin takhdumu an-nāsa.", "id": "Para peneliti mengubah hasil laboratorium menjadi produk yang melayani masyarakat.", "t": 40, "em": ""}, {"n": "2954", "ar": "يَحْتَاجُ الْبَاحِثُ الشَّابُّ إِلَى مُوَجِّهٍ يُرْشِدُهُ دُونَ أَنْ يَفْرِضَ رَأْيَهُ.", "tr": "Yaḥtāju al-bāḥithu ash-shābbu ilā muwajjihin yurshiduhu dūna an yafriḍa raʾyahu.", "id": "Peneliti muda membutuhkan pembimbing yang mengarahkan tanpa memaksakan pendapat.", "t": 40, "em": ""}, {"n": "2955", "ar": "تُقَلِّلُ الْأَدَوَاتُ الْحَدِيثَةُ مِنْ زَمَنِ التَّجْرِبَةِ وَالْخَطَأِ.", "tr": "Tuqallilu al-adawātu al-ḥadīthatu min zamani at-tajribati wal-khaṭaʾi.", "id": "Alat modern mempersingkat waktu coba-coba.", "t": 40, "em": ""}, {"n": "2956", "ar": "نَشَأَتْ هَذِهِ الشَّرِكَةُ مِنْ فِكْرَةٍ بَسِيطَةٍ فِي مَرْأَبِ سَيَّارَةٍ.", "tr": "Nashaʾat hādhihi ash-sharikatu min fikratin basīṭatin fī marʾabi sayyāratin.", "id": "Perusahaan ini lahir dari ide sederhana di garasi mobil.", "t": 40, "em": "🚗"}, {"n": "2957", "ar": "تَبْدَأُ الْحُلُولُ الْعَظِيمَةُ بِمُلَاحَظَةِ مَا يُزْعِجُ النَّاسَ كُلَّ يَوْمٍ.", "tr": "Tabdaʾu al-ḥulūlu al-ʿaẓīmatu bi-mulāḥaẓati mā yuzʿiju an-nāsa kulla yawmin.", "id": "Solusi besar dimulai dari memperhatikan apa yang mengganggu orang setiap hari.", "t": 40, "em": ""}, {"n": "2958", "ar": "الْتَزَمَتِ الْجَامِعَةُ بِدَعْمِ الْأَبْحَاثِ الَّتِي تَخْدُمُ الْمُجْتَمَعَ الْمَحَلِّيَّ.", "tr": "Iltazamati al-jāmiʿatu bi-daʿmi al-abḥāthi allatī takhdumu al-mujtamaʿa al-maḥalliyya.", "id": "Universitas berkomitmen mendukung penelitian yang melayani masyarakat setempat.", "t": 40, "em": "🎓🔬"}, {"n": "2959", "ar": "يَرْبِطُ الِابْتِكَارُ بَيْنَ التِّقْنِيَةِ وَالْإِبْدَاعِ وَحَاجَةِ النَّاسِ.", "tr": "Yarbiṭu al-ibtikāru bayna at-tiqniyyati wal-ibdāʿi wa ḥājati an-nāsi.", "id": "Inovasi menghubungkan teknologi, kreativitas, dan kebutuhan manusia.", "t": 40, "em": ""}, {"n": "2960", "ar": "اقْتَرَحْتُ فِكْرَةً لِتَحْسِينِ الْعَمَلِيَّةِ فَوَافَقَ عَلَيْهَا الْمُدِيرُ.", "tr": "Iqtaraḥtu fikratan li-taḥsīni al-ʿamaliyyati fa-wāfaqa ʿalayhā al-mudīru.", "id": "Saya mengusulkan ide untuk memperbaiki proses dan manajer menyetujuinya.", "t": 40, "em": ""}, {"n": "2961", "ar": "لَا نَنْتَظِرُ الْمُنْتَجَ الْمِثَالِيَّ، بَلْ نُطْلِقُ نُسْخَةً بَسِيطَةً وَنُحَسِّنُهَا بِمُلَاحَظَاتِ الْمُسْتَخْدِمِينَ.", "tr": "Lā nantaẓiru al-muntaja al-mithāliyya, bal nuṭliqu nuskhatan basīṭatan wa nuḥassinuhā bi-mulāḥaẓāti al-mustakhdimīna.", "id": "Kami tidak menunggu produk sempurna, tetapi meluncurkan versi sederhana dan memperbaikinya dengan masukan pengguna.", "t": 40, "em": ""}, {"n": "2962", "ar": "يَجِبُ أَنْ يَسْتَمِعَ الْمُبْتَكِرُ إِلَى الْمُسْتَخْدِمِ قَبْلَ أَنْ يَفْتَرِضَ مَا يُرِيدُهُ.", "tr": "Yajibu an yastamiʿa al-mubtakiru ilā al-mustakhdimi qabla an yaftariḍa mā yurīduhu.", "id": "Inovator harus mendengarkan pengguna sebelum mengira apa yang mereka inginkan.", "t": 40, "em": ""}, {"n": "2963", "ar": "اسْتَخْدَمَ الْمُهَنْدِسُونَ مَوَادَّ مُعَادًا تَدْوِيرُهَا فِي الْمُنْتَجِ الْجَدِيدِ.", "tr": "Istakhdama al-muhandisūna mawādda muʿādan tadwīruhā fī al-muntaji al-jadīdi.", "id": "Para insinyur memakai bahan daur ulang dalam produk baru.", "t": 40, "em": "👷"}, {"n": "2964", "ar": "اجْتَمَعَ الْفَرِيقُ لِيُحَلِّلَ أَسْبَابَ فَشَلِ التَّجْرِبَةِ الْأُولَى.", "tr": "Ijtamaʿa al-farīqu li-yuḥallila asbāba fashali at-tajribati al-ūlā.", "id": "Tim berkumpul untuk menganalisis sebab kegagalan percobaan pertama.", "t": 40, "em": "👥"}, {"n": "2965", "ar": "تُتِيحُ الْمُنَافَسَةُ الصَّحِيَّةُ فُرَصًا لِلتَّحَسُّنِ الْمُسْتَمِرِّ.", "tr": "Tutīḥu al-munāfasatu aṣ-ṣaḥīyyatu furaṣan lit-taḥassuni al-mustamirri.", "id": "Persaingan sehat membuka peluang untuk perbaikan berkelanjutan.", "t": 40, "em": "💪"}, {"n": "2966", "ar": "تَتَعَاوَنُ الشَّرِكَاتُ وَالْجَامِعَاتُ لِتَحْوِيلِ الْأَبْحَاثِ إِلَى مُنْتَجَاتٍ تِجَارِيَّةٍ.", "tr": "Tataʿāwanu ash-sharikātu wal-jāmiʿātu li-taḥwīli al-abḥāthi ilā muntajātin tijāriyyatin.", "id": "Perusahaan dan universitas bekerja sama mengubah penelitian menjadi produk komersial.", "t": 40, "em": "🎓🔬"}, {"n": "2967", "ar": "الْفُضُولُ هُوَ الْمُحَرِّكُ الْأَوَّلُ لِكُلِّ اكْتِشَافٍ وَابْتِكَارٍ.", "tr": "Al-fuḍūlu huwa al-muḥarriku al-awwalu li-kulli iktishāfin wa-btikārin.", "id": "Rasa ingin tahu adalah penggerak pertama setiap penemuan dan inovasi.", "t": 40, "em": ""}, {"n": "2968", "ar": "تُبْنَى الْعَادَاتُ الْجَيِّدَةُ بِخُطُوَاتٍ صَغِيرَةٍ وَتَكْرَارٍ مُسْتَمِرٍّ.", "tr": "Tubnā al-ʿādātu al-jayyidatu bi-khuṭuwātin ṣaghīratin wa takrārin mustamirrin.", "id": "Kebiasaan baik dibangun dengan langkah kecil dan pengulangan terus-menerus.", "t": 41, "em": ""}, {"n": "2969", "ar": "لَمْ أَنْجَحْ فِي الِالْتِزَامِ بِالرِّيَاضَةِ حَتَّى رَبَطْتُهَا بِعَادَةٍ أُخْرَى.", "tr": "Lam anjaḥ fī al-iltizāmi bir-riyāḍati ḥattā rabaṭtuhā bi-ʿādatin ukhrā.", "id": "Saya tidak berhasil konsisten berolahraga sampai saya mengaitkannya dengan kebiasaan lain.", "t": 41, "em": ""}, {"n": "2970", "ar": "يَبْدَأُ التَّغْيِيرُ بِالْوَعْيِ بِمَا نَفْعَلُهُ كُلَّ يَوْمٍ دُونَ تَفْكِيرٍ.", "tr": "Yabdaʾu at-taghyīru bil-waʿyi bi-mā nafʿaluhu kulla yawmin dūna tafkīrin.", "id": "Perubahan dimulai dengan menyadari apa yang kita lakukan setiap hari tanpa berpikir.", "t": 41, "em": ""}, {"n": "2971", "ar": "لَا تُقَارِنْ بِدَايَتَكَ بِنِهَايَةِ غَيْرِكَ.", "tr": "Lā tuqārin bidāyataka bi-nihāyati ghayrika.", "id": "Jangan membandingkan awalmu dengan akhir orang lain.", "t": 41, "em": ""}, {"n": "2972", "ar": "يَنْبَغِي أَنْ نَضَعَ أَهْدَافًا قَابِلَةً لِلْقِيَاسِ وَأَنْ نُرَاجِعَهَا بِانْتِظَامٍ.", "tr": "Yanbaghī an naḍaʿa ahdāfan qābilatan lil-qiyāsi wa an nurājiʿahā bi-intiẓāmin.", "id": "Kita sebaiknya menetapkan target yang terukur dan meninjaunya secara teratur.", "t": 41, "em": ""}, {"n": "2973", "ar": "أُقَلِّلُ اسْتِخْدَامَ الْهَاتِفِ فِي الصَّبَاحِ لِأَبْدَأَ يَوْمِي بِهُدُوءٍ.", "tr": "Uqallilu istikhdāma al-hātifi fī aṣ-ṣabāḥi li-abdaʾa yawmī bi-hudūʾin.", "id": "Saya mengurangi pemakaian ponsel di pagi hari untuk memulai hari dengan tenang.", "t": 41, "em": "📱🌅"}, {"n": "2974", "ar": "أَتَعَلَّمُ مِنْ أَخْطَائِي وَلَا أَجْلِدُ نَفْسِي بِسَبَبِهَا.", "tr": "Ataʿallamu min akhṭāʾī wa lā ajlidu nafsī bi-sababihā.", "id": "Saya belajar dari kesalahan dan tidak menyalahkan diri berlebihan karenanya.", "t": 41, "em": "📚"}, {"n": "2975", "ar": "يُسَاعِدُنِي التَّأَمُّلُ عَشْرَ دَقَائِقَ يَوْمِيًّا عَلَى تَصْفِيَةِ ذِهْنِي.", "tr": "Yusāʿidunī at-taʾammulu ʿashra daqāʾiqa yawmiyyan ʿalā taṣfiyati dhihnī.", "id": "Merenung sepuluh menit setiap hari membantu saya menjernihkan pikiran.", "t": 41, "em": ""}, {"n": "2976", "ar": "الِانْضِبَاطُ يَتَفَوَّقُ عَلَى الْحَمَاسِ فِي الْمَدَى الطَّوِيلِ.", "tr": "Al-inḍibāṭu yatafawwaqu ʿalā al-ḥamāsi fī al-madā aṭ-ṭawīli.", "id": "Disiplin mengungguli semangat dalam jangka panjang.", "t": 41, "em": ""}, {"n": "2977", "ar": "أُحِيطُ نَفْسِي بِأَشْخَاصٍ يُشَجِّعُونَنِي عَلَى النُّمُوِّ.", "tr": "Uḥīṭu nafsī bi-ashkhāṣin yushajjiʿūnanī ʿalā an-numuwwi.", "id": "Saya mengelilingi diri dengan orang-orang yang mendorong saya berkembang.", "t": 41, "em": ""}, {"n": "2978", "ar": "بَدَأْتُ بِتَعَلُّمِ مَهَارَةٍ جَدِيدَةٍ كُلَّ ثَلَاثَةِ أَشْهُرٍ.", "tr": "Badaʾtu bi-taʿallumi mahāratin jadīdatin kulla thalāthati ashhurin.", "id": "Saya mulai mempelajari keterampilan baru setiap tiga bulan.", "t": 41, "em": ""}, {"n": "2979", "ar": "النَّوْمُ الْجَيِّدُ أَسَاسُ كُلِّ عَادَةٍ جَيِّدَةٍ أُخْرَى.", "tr": "An-nawmu al-jayyidu asāsu kulli ʿādatin jayyidatin ukhrā.", "id": "Tidur yang baik adalah dasar setiap kebiasaan baik lainnya.", "t": 41, "em": "😴"}, {"n": "2980", "ar": "كُلَّمَا ازْدَدْتُ عِلْمًا اكْتَشَفْتُ كَمْ أَجْهَلُ.", "tr": "Kullamā izdadtu ʿilman iktashaftu kam ajhalu.", "id": "Semakin bertambah ilmu saya, semakin saya sadar betapa banyak yang belum saya tahu.", "t": 41, "em": ""}, {"n": "2981", "ar": "لَا يَأْتِي النَّجَاحُ بَيْنَ لَيْلَةٍ وَضُحَاهَا، بَلْ بِعَمَلٍ يَوْمِيٍّ صَبُورٍ.", "tr": "Lā yaʾtī an-najāḥu bayna laylatin wa ḍuḥāhā, bal bi-ʿamalin yawmiyyin ṣabūrin.", "id": "Keberhasilan tidak datang dalam semalam, tetapi dengan kerja harian yang sabar.", "t": 41, "em": ""}, {"n": "2982", "ar": "أُخَصِّصُ نِصْفَ سَاعَةٍ كُلَّ مَسَاءٍ لِمُرَاجَعَةِ يَوْمِي وَالتَّخْطِيطِ لِغَدِي.", "tr": "Ukhaṣṣiṣu niṣfa sāʿatin kulla masāʾin li-murājaʿati yawmī wat-takhṭīṭi li-ghadī.", "id": "Saya menyediakan setengah jam setiap malam untuk meninjau hari saya dan merencanakan esok.", "t": 41, "em": "⏰🌙"}, {"n": "2983", "ar": "عِنْدَمَا أَشْعُرُ بِالْكَسَلِ أَبْدَأُ بِخُمْسِ دَقَائِقَ فَقَطْ.", "tr": "ʿIndamā ashʿuru bil-kasali abdaʾu bi-khamsi daqāʾiqa faqaṭ.", "id": "Ketika merasa malas, saya  const tts=()=>{try{if(!window.speechSynthesis)return fin();const u=new SpeechSynthesisUtterance(it.ar);u.lang='ar-SA';u.rate=(rate||1)*.85;const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,8000)}catch(e){fin()}};
 if(!CFG.audio)return tts();
 const a=new Audio(CFG.audio+it.n+'.mp3');cur=a;a.playbackRate=rate||1;a.onended=fin;a.onerror=()=>{if(cur===a)tts()};const p=a.play();if(p&&p.catch)p.catch(()=>{if(cur===a)tts()})})}

 <div class="row" style="margin-top:12px;align-items:center"><div class="dice" id="dice">🎲</div><button class="btn gold" id="roll">Lempar dadu</button></div>
 <p class="fb" id="fb">🪜 Jawab benar untuk naik tangga · 🐍 jawab benar agar selamat dari ular</p>`;
 function place(p){const c=cellXY(pos[p]),e=$('#t'+p);e.style.left=c.x/6+'%';e.style.top=c.y/5+'%';e.style.marginLeft=(p?6:-30)+'px';$('#n'+p).textContent=pos[p]}
 function upd(){$('#p0').classList.toggle('on',turn===0);$('#p1').classList.toggle('on',turn===1);$('#roll').disabled=turn!==0||busy;$('#roll').style.opacity=turn!==0||busy?.5:1;$('#sc').textContent=score}
 function pickQ(){const P=picPool();let c=P.filter(i=>!used.has(i.n));if(!c.length){used.clear();c=P}const it=c[Math.random()*c.length|0];used.add(it.n);return it}
 async function roll(){if(busy)return;busy=true;upd();const p=turn,d=1+(Math.random()*6|0);
  for(let k=0;k<8;k++){$('#dice').textContent=DICE[Math.random()*6|0];sfx.tap();await sleep(70)}
  $('#dice').textContent=DICE[d-1];$('#fb').textContent=(p?'🐪 Unta':'Kamu')+' dapat '+d;await sleep(300);
  for(let s=0;s<d&&pos[p]<30;s++){pos[p]++;place(p);await sleep(230)}
  const c=pos[p];
  if(p===0&&c<30){const it=pickQ();asked++;
   const r=await ask(it,'pic',LADDERS[c]?'🪜 Jawab benar untuk naik tangga!':SNAKES[c]?'🐍 Jawab benar agar selamat dari ular!':'Kotak '+c);
   if(r.ok){right++;const pt=r.hint?5:10;score+=pt;popup('+'+pt);if(LADDERS[c]){pos[p]=LADDERS[c];place(p);$('#fb').textContent='🪜 Naik ke kotak '+pos[p]+'!'}}
   else if(SNAKES[c]){pos[p]=SNAKES[c];place(p);$('#fb').textContent='🐍 Turun ke kotak '+pos[p]}}
  else if(p===1){await sleep(250);if(LADDERS[c]){pos[1]=LADDERS[c];place(1);$('#fb').textContent='🐪 Unta naik tangga!'}else if(SNAKES[c]){pos[1]=SNAKES[c];place(1);$('#fb').textContent='🐪 Unta digigit ular!'}}
  await sleep(350);
  if(pos[p]>=30){if(p===0)score+=30;return end('ular',score,Math.max(score,asked*10+30),p===0?`Kamu menang! ${right}/${asked} benar`:`Unta menang 🐪 · ${right}/${asked} benar`)}
  turn=1-turn;busy=false;upd();if(turn===1){await sleep(600);roll()}}
 $('#roll').onclick=roll;place(0);place(1);upd()}

/* ---------- GAME 6: POP BALON ---------- */
function gBalon(){clearAll();
 const src=shuffle(picPool()).slice(0,10);let r=0,score=0,lives=3,bs=[],target,busy=false,last,speed=60;
 app.innerHTML=hud('🎈 Pop Balon',`<span class="lives" id="lv">❤️❤️❤️</span><span id="sc">0</span>`)+`<div class="bar"><b id="pb"></b></div><div class="row"><button class="btn sm" id="rep">🔊 Dengar lagi</button><button class="btn ghost sm" id="slow">🐢 Pelan</button></div><div class="sky" id="sky"></div><div class="fb" id="fb"></div>`;
 const sky=$('#sky'),COL=['#e74c3c','#3498db','#f1c40f','#2ecc71','#9b59b6','#e67e22'];
 $('#rep').onclick=()=>target&&speak(target);$('#slow').onclick=()=>target&&speak(target,.7);
 function hearts(){$('#lv').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(3-Math.max(0,lives))}
 function next(){if(lives<=0||r>=src.length)return end('balon',score,src.length*13,`${r} ronde`);
  target=src[r];r++;$('#pb').style.width=(r-1)/src.length*100+'%';sky.innerHTML='';bs=[];busy=false;$('#fb').innerHTML='Dengarkan, lalu pecahkan balon yang cocok!';
  picOpts(target,4).forEach((it,i)=>{const b=document.createElement('button');b.className='bal';b.style.left=(2+i*24)+'%';b.style.setProperty('--bc',COL[(i+r)%COL.length]);b.innerHTML=`<span>${it.em}</span>`;
   const o={el:b,it,y:-150-Math.random()*90,ph:Math.random()*6};sky.appendChild(b);bs.push(o);b.onclick=()=>hit(o)});
  speak(target);last=performance.now();raf=requestAnimationFrame(loop)}
 function loop(t){const dt=Math.min(50,t-last)/1000;last=t;const H=sky.clientHeight;
  for(const o of bs){if(o.gone)continue;o.y+=speed*dt;o.ph+=dt*2.2;o.el.style.bottom=o.y+'px';o.el.style.transform=`translateX(${Math.sin(o.ph)*8}px)`}
  const tg=bs.find(o=>o.it===target);if(tg&&tg.y>H){miss('Balonnya terbang! 🎈');return}raf=requestAnimationFrame(loop)}
 function reveal(){$('#fb').innerHTML+=`<div class="ar" style="font-size:1.35rem;margin-top:4px">${esc(target.ar)}</div><i style="font-weight:500;font-size:.85rem">${esc(target.id)}</i>`}
 function miss(msg){busy=true;cancelAnimationFrame(raf);sfx.no();lives--;hearts();const tg=bs.find(o=>o.it===target);if(tg)tg.el.classList.add('ok');$('#fb').innerHTML=`<span style="color:var(--no)">${msg}</span>`;reveal();timers.push(setTimeout(next,1900))}
 function hit(o){if(busy||o.gone)return;
  if(o.it===target){busy=true;cancelAnimationFrame(raf);o.gone=true;o.el.classList.add('popd');const p=10+lives;score+=p;sfx.ok();popup('+'+p);$('#sc').textContent=score;$('#fb').innerHTML='<span style="color:var(--ok)">Pop! Benar 🎉</span>';reveal();speed+=8;speak(target).then(()=>timers.push(setTimeout(next,500)))}
  else{o.gone=true;o.el.classList.add('popd','bad');sfx.no();lives--;hearts();popup('💥');if(lives<=0)miss('Nyawa habis!')}}
 next()}

/* ---------- GAME 7: TEBAK GAMBAR ---------- */
function gGambar(){clearAll();
 const src=shuffle(picPool()).slice(0,10);let r=0,score=0,streak=0;
 function next(){if(r>=src.length)return end('gambar',score,src.length*28,`${src.length} gambar`);
  const it=src[r];r++;const opts=picOpts(it,4);let done=false,hint=false,left=15,TL=15;
  app.innerHTML=hud('🖼️ Tebak Gambar',`<span>${r}/${src.length}</span><span id="sc">${score}</span>`)+`<div class="bar"><b style="width:${(r-1)/src.length*100}%"></b></div>
  <div class="panel"><div class="prompt"><small>Kalimat Arab apa yang cocok dengan gambar ini?</small></div><div class="pic">${it.em}</div><div class="timer"><b id="tm"></b></div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.ar)}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="hint">💡 Lihat arti (−5)</button>${streak>1?`<span class="streak">🔥 ${streak}</span>`:''}</div><div class="fb" id="fb"></div></div>`;
  const fin=(ok,b)=>{done=true;clearInterval(iv);const bs=app.querySelectorAll('.opt');bs[opts.indexOf(it)].classList.add('ok');
   if(ok){streak++;const p=Math.max(5,10+Math.round(left)-(hint?5:0)+Math.min(streak-1,3));score+=p;sfx.ok();popup('+'+p);$('#sc').textContent=score;$('#fb').innerHTML=`<span style="color:var(--ok)">Benar! أحسنت</span> · <i style="font-weight:500">${esc(it.id)}</i>`}
   else{streak=0;sfx.no();if(b)b.classList.add('no');$('#fb').innerHTML=`<span style="color:var(--no)">${b?'Belum tepat':'Waktu habis!'}</span> · <i style="font-weight:500">${esc(it.id)}</i>`}
   speak(it).then(()=>timers.push(setTimeout(next,700)))};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!done)fin(opts[+b.dataset.i]===it,b)});
  $('#hint').onclick=()=>{if(done||hint)return;hint=true;$('#fb').innerHTML=`<i style="font-weight:500">${esc(it.id)}</i>`};
  const iv=setInterval(()=>{left-=.1;$('#tm').style.width=Math.max(0,left/TL*100)+'%';if(left<=0&&!done)fin(false,null)},100);timers.push(iv)}
 next()}

/* ---------- GAME 8: SIAPA BILANG? ---------- */
function gSiapa(){clearAll();
 const src=shuffle(pool).slice(0,8);let r=0,score=0;
 function next(){if(r>=src.length)return end('siapa',score,src.length*10,`${Math.round(score/10)}/${src.length} benar`);
  const it=src[r];r++;const tn=TOPICS[it.t-1]||'',te=(TEM&&TEM[it.t-1])||'💬',ch=CHARS[Math.random()*CHARS.length|0];
  const dis=[];for(const o of shuffle(ITEMS)){if(dis.length>=2)break;if(o.t===it.t||strip(o.ar)===strip(it.ar)||dis.some(d=>d.t===o.t))continue;dis.push(o)}
  const opts=shuffle([it,...dis]);let done=false,hint=false;
  app.innerHTML=hud('💬 Siapa Bilang?',`<span>${r}/${src.length}</span><span id="sc">${score}</span>`)+`<div class="bar"><b style="width:${(r-1)/src.length*100}%"></b></div>
  <div class="scene fadein"><div class="bgem">${te}</div><div class="place">📍 ${esc(tn)}</div><div class="bub" id="bub"><span class="dots3"><i></i><i></i><i></i></span></div><div class="chr">${ch}</div>${it.em?`<div class="prop">${it.em}</div>`:''}</div>
  <div class="panel"><div class="prompt"><small>Di situasi ini, apa yang dia katakan?</small></div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.ar)}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="hint">💡 Arti (−5)</button></div><div class="fb" id="fb"></div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=opts[+b.dataset.i]===it;b.classList.add(ok?'ok':'no');app.querySelectorAll('.opt')[opts.indexOf(it)].classList.add('ok');
   const bub=$('#bub');bub.classList.add('said');bub.innerHTML=`<span class="ar">${esc(it.ar)}</span>`;
   if(ok){const p=hint?5:10;score+=p;sfx.ok();popup('+'+p);$('#sc').textContent=score}else sfx.no();
   $('#fb').innerHTML=`<span style="color:var(${ok?'--ok':'--no'})">${ok?'Benar! أحسنت':'Belum tepat'}</span> · <i style="font-weight:500">${esc(it.id)}</i>`;
   speak(it).then(()=>timers.push(setTimeout(next,900)))});
  $('#hint').onclick=()=>{if(done||hint)return;hint=true;$('#fb').innerHTML=`<i style="font-weight:500">${esc(it.id)}</i>`}}
 next()}

/* ---------- GAME 9: JALAN-JALAN KE KOTA ARAB ---------- */
const STATIONS=[{n:'Bandara',e:'🛬',k:['✈️','🛫','🛬','🧳','🛂','🎫','🚕']},{n:'Hotel',e:'🏨',k:['🏨','🛏️','🔑','🚿','🧳','🛋️']},
 {n:'Restoran',e:'🍽️',k:['🍽️','🍗','🍚','☕','🍵','🧾','😋','🍲','🍞','🥤','🍱','🥐','🐟','🥩','🍎','🧑‍🍳','🍳']},{n:'Pasar',e:'🛍️',k:['🛒','🛍️','🏷️','💵','💳','👕','👗','👟','💸','🏪','👜']},
 {n:'Klinik',e:'🏥',k:['🤒','💊','🧑‍⚕️','🏥','🤕','👁️','🦷','😷','🤧','💉','🤢']},{n:'Sekolah',e:'🏫',k:['🏫','📚','📖','🧑‍🎓','👨‍🏫','📝','✏️','🎓','📘','✍️']}];
function stamps(){try{return JSON.parse(localStorage.getItem('fusha_'+CFG.key+'_stamps')||'[]')}catch(e){return[]}}
function saveStamps(s){try{localStorage.setItem('fusha_'+CFG.key+'_stamps',JSON.stringify(s))}catch(e){}setBest('kota',s.length)}
function gKota(){clearAll();const S=stamps(),POS=[[20,10],[72,25],[24,41],[74,57],[26,73],[70,89]];
 let path='M'+POS.map(p=>p[0]*6+' '+p[1]*7).join(' L');
 app.innerHTML=hud('🗺️ Jalan-jalan ke Kota Arab',`<span>🛂 ${S.length}/6</span>`)+`<p class="sub" style="margin:0 0 8px">Selesaikan tantangan di setiap tempat untuk mendapat stempel paspor!</p>
 <div class="map"><svg viewBox="0 0 600 700" preserveAspectRatio="none"><path d="${path}" class="road"/></svg>${STATIONS.map((s,i)=>{const done=S.includes(i),open=i===0||S.includes(i-1)||done;
  return `<button class="stn ${done?'done':''} ${open?'':'lock'}" data-i="${i}" style="left:${POS[i][0]}%;top:${POS[i][1]}%"><span class="se">${open?s.e:'🔒'}</span><b>${s.n}</b>${done?'<i>✅</i>':''}</button>`}).join('')}</div>
 <div class="pass"><b>🛂 Paspor</b><div>${STATIONS.map((s,i)=>`<span class="stp ${S.includes(i)?'on':''}">${S.includes(i)?s.e:'·'}</span>`).join('')}</div></div>
 ${S.length>=6?`<div class="panel" style="text-align:center;margin-top:10px"><b>🎉 Paspormu penuh! مُمْتَاز</b><div class="row" style="margin-top:8px"><button class="btn sm" id="reset">↻ Mulai perjalanan baru</button></div></div>`:''}`;
 app.querySelectorAll('.stn').forEach(b=>b.onclick=()=>{if(b.classList.contains('lock')){sfx.no();popup('🔒');return}sfx.tap();station(+b.dataset.i)});
 const rs=$('#reset');if(rs)rs.onclick=()=>{saveStamps([]);try{localStorage.setItem('fusha_'+CFG.key+'_kota','0')}catch(e){}gKota()}}
async function station(i){clearAll();const st=STATIONS[i],P=ITEMS.filter(x=>x.em&&st.k.some(k=>x.em.includes(k)));
 const src=shuffle(P.length>=4?P:picPool()).slice(0,4),modes=['pic','aud','mean','pic'];let ok=0;
 app.innerHTML=hud(st.e+' '+st.n,`<span id="ok">✅ 0/4</span>`)+`<div class="stcard fadein"><div class="bigem">${st.e}</div><h2>${st.n}</h2><p>Jawab minimal 3 dari 4 untuk mendapat stempel.</p></div>`;
 await sleep(700);
 for(let q=0;q<4;q++){const r=await ask(src[q],modes[q],`${st.e} ${st.n} · ${q+1}/4`,P.length>=4?P:null);if(r.ok)ok++;const e=$('#ok');if(e)e.textContent=`✅ ${ok}/4`}
 const pass=ok>=3,S=stamps();if(pass&&!S.includes(i)){S.push(i);saveStamps(S)}
 if(pass)sfx.win();else sfx.no();
 app.innerHTML=hud(st.e+' '+st.n,`<span>✅ ${ok}/4</span>`)+`<div class="panel end fadein"><div class="stampbig ${pass?'':'fail'}">${pass?st.e:'❌'}</div><h1>${pass?'Stempel didapat!':'Hampir!'}</h1><p class="sub">${pass?`Kamu lulus di ${st.n}. Lanjut ke tempat berikutnya!`:'Butuh 3 jawaban benar. Coba lagi ya!'}</p>
 <div class="row"><button class="btn" id="tomap">🗺️ Kembali ke peta</button>${pass?'':'<button class="btn ghost" id="retry">↻ Coba lagi</button>'}</div></div>`;
 $('#tomap').onclick=gKota;const rt=$('#retry');if(rt)rt.onclick=()=>station(i)}

/* background music (generated, no file) */
const MUS={on:true,gain:null,timer:null,next:0,step:0,bpm:96,vol:.055};
try{MUS.on=localStorage.getItem('fusha_music')!=='off'}catch(e){}
const N=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
function mnote(f,t,d,type,v,att){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+d+.05)}
function mstep(s,t){const e=60/MUS.bpm/2,ch=PROG[Math.floor(s/8)%4];
 if(s%8===0){ch.forEach(m=>mnote(N(m),t,e*8.5,'sine',.10,.4));mnote(N(ch[0]-12),t,e*7,'triangle',.16,.03)}
 const arp=[0,1,2,1,2,1,0,2][s%8];mnote(N(ch[arp]+12),t,.45,'sine',.09,.005);
 if(s%4===0)mnote(70,t,.18,'sine',.22,.002)}
function musSched(){while(MUS.next<AC.currentTime+.35){mstep(MUS.step,MUS.next);MUS.step++;MUS.next+=60/MUS.bpm/2}}
function musStart(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(MUS.timer)return;
 MUS.gain=AC.createGain();MUS.gain.gain.value=0;MUS.gain.connect(AC.destination);MUS.gain.gain.setTargetAtTime(MUS.vol,AC.currentTime,.6);
 MUS.next=AC.currentTime+.1;MUS.timer=setInterval(musSched,100)}catch(e){}}
function musStop(){if(!MUS.timer)return;clearInterval(MUS.timer);MUS.timer=null;const g=MUS.gain;try{g.gain.setTargetAtTime(0,AC.currentTime,.15)}catch(e){}setTimeout(()=>{try{g.disconnect()}catch(e){}},800)}
function duck(d){if(MUS.gain&&AC)try{MUS.gain.gain.setTargetAtTime(d?MUS.vol*.25:MUS.vol,AC.currentTime,.12)}catch(e){}}
function musUI(){const b=document.getElementById('musb');b.classList.toggle('off',!MUS.on);b.textContent=MUS.on?'🎵':'🔇';b.title=MUS.on?'Matikan musik':'Nyalakan musik'}
document.getElementById('musb').onclick=e=>{e.stopPropagation();MUS.on=!MUS.on;try{localStorage.setItem('fusha_music',MUS.on?'on':'off')}catch(x){}musUI();MUS.on?musStart():musStop()};
document.addEventListener('pointerdown',function f(){if(MUS.on)musStart();document.removeEventListener('pointerdown',f)},{once:false});
musUI();
setPool();home();
</script>
