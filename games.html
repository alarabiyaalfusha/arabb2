<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permainan Bahasa Arab · Level B2</title>
<meta name="description" content="Permainan bahasa Arab interaktif: tangkap arti, susun kalimat, tebak suara, kartu memori, ular tangga, pop balon, dan tebak gambar. AL-Arabiya AL-Fusha.">
<meta property="og:title" content="Permainan Bahasa Arab · Level B2">
<meta property="og:description" content="Main game bahasa Arab gratis. Bisa kalahkan skorku?">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#70452E;--cd:#352116;--gold:#D6A63C;--champ:#F4D98B;--ivory:#FFF9EB;--ink:#352116;--mut:#6b5a4c;--line:#eadfcb;--ok:#2e9e6a;--no:#d04545}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--ivory);color:var(--ink);overflow-x:hidden}
.ar{font-family:Amiri,'Noto Naskh Arabic',serif;direction:rtl}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bgc{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;min-height:100%;padding:14px 16px 40px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.brand b{display:block;font-family:Amiri,serif;font-size:1.15rem;line-height:1.1}
.brand small{display:block;font-size:.62rem;letter-spacing:.12em;font-weight:600;color:var(--mut)}
.badge{width:52px;height:58px;border-radius:12px 12px 26px 26px;background:var(--c);border:3px solid var(--gold);color:var(--champ);font-weight:800;font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex:none}
h1{font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.15;font-weight:800;text-align:center}
h1 span{color:var(--c)}
.sub{text-align:center;color:var(--mut);margin:6px 0 18px;font-size:.95rem}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 14px 14px;text-align:center;box-shadow:0 8px 20px rgba(53,33,22,.06);transition:transform .15s}
.gcard:hover{transform:translateY(-3px)}
.gcard .em{font-size:2.4rem;line-height:1.1}
.gcard h3{font-size:1rem;margin-top:6px}
.gcard .an{font-family:Amiri,serif;color:var(--c);font-size:1.15rem;font-weight:700}
.gcard p{font-size:.76rem;color:var(--mut);margin-top:4px;line-height:1.35}
.gcard .best{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:700;background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.sel{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 16px;font-size:.85rem;font-weight:600}
.sel select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;max-width:70vw}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin-top:14px}
.free{margin-top:16px;background:#fff;border:2px dashed var(--gold);border-radius:18px;padding:14px;text-align:center;font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;font-weight:700;border-radius:999px;padding:12px 22px;text-decoration:none;box-shadow:0 6px 16px rgba(53,33,22,.18);font-size:.95rem}
.btn.gold{background:var(--gold);color:#2a1a0f}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* game hud */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hud .back{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1.2rem;flex:none}
.hud .ttl{font-weight:800;font-size:1rem;flex:1;text-align:center}
.stat{display:flex;gap:6px}
.stat span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar b{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 26px rgba(53,33,22,.07)}
.prompt{text-align:center;font-weight:700;font-size:1.05rem}
.prompt small{display:block;font-weight:500;color:var(--mut);font-size:.8rem;margin-bottom:4px}
/* catcher */
.arena{position:relative;height:min(58vh,520px);border-radius:24px;background:linear-gradient(#fff,var(--ivory));border:1px solid var(--line);overflow:hidden;margin-top:12px;touch-action:manipulation}
.drop{position:absolute;width:31%;min-height:76px;padding:8px 6px;border-radius:18px;background:#fff;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 8px 16px rgba(53,33,22,.12);font-family:Amiri,serif;direction:rtl;font-weight:700;font-size:clamp(1.05rem,4.6vw,1.5rem);line-height:1.35;color:var(--cd)}
.drop.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.drop.no{background:var(--no);border-color:var(--no);color:#fff;animation:shake .3s}
.ground{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--c);opacity:.25}
.lives{letter-spacing:2px}
/* builder */
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;min-height:64px;padding:10px;border-radius:18px}
.ans{background:var(--ivory);border:2px dashed var(--c);margin:14px 0 10px}
.tok{font-family:Amiri,serif;font-weight:700;font-size:1.45rem;background:#fff;border:2px solid var(--c);border-radius:14px;padding:4px 14px;color:var(--cd);box-shadow:0 3px 0 rgba(53,33,22,.15)}
.ans .tok{background:var(--champ);border-color:var(--gold)}
.ans.ok{border-color:var(--ok);background:#e6f5ee}.ans.no{border-color:var(--no);background:#fbe9e9;animation:shake .3s}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.timer b{display:block;height:100%;background:var(--c);width:100%}
/* ear */
.big{width:96px;height:96px;border-radius:50%;background:var(--c);color:#fff;font-size:2.4rem;display:flex;align-items:center;justify-content:center;margin:6px auto 4px;box-shadow:0 0 0 8px rgba(214,166,60,.3)}
.big.play{animation:pulse .8s infinite}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-family:Amiri,serif;direction:rtl;font-weight:700;font-size:1.35rem;line-height:1.4;color:var(--cd);text-align:center}
.opt.lat{font-family:Poppins,sans-serif;direction:ltr;font-size:1rem;font-weight:600}
.opt.ok{background:#e6f5ee;border-color:var(--ok)}.opt.no{background:#fbe9e9;border-color:var(--no)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mc{position:relative;height:clamp(92px,22vw,130px);perspective:800px}
.mc .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.mc .fa{background:var(--c);border:3px solid var(--gold);color:var(--champ);font-size:1.8rem;font-weight:800}
.mc .ba{background:#fff;border:3px solid var(--c);transform:rotateY(180deg);font-size:.8rem;font-weight:600;line-height:1.25}
.mc .ba.ar{font-size:clamp(1rem,4vw,1.35rem);font-weight:700;line-height:1.35}
.mc.done .ba{background:#e6f5ee;border-color:var(--ok)}
/* feedback */
.fb{text-align:center;font-weight:700;min-height:1.6em;margin-top:10px}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:2rem;font-weight:800;color:var(--gold);pointer-events:none;animation:popup .8s ease-out both;z-index:50;text-shadow:0 2px 0 #fff}
/* end */
.end{text-align:center}
.end .stars{font-size:2.8rem;letter-spacing:6px;margin:6px 0}
.end .score{font-size:3rem;font-weight:800;color:var(--c);line-height:1}
.end .hs{color:var(--mut);font-size:.85rem;margin:4px 0 16px}
.cta{margin-top:18px;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;border-radius:22px;padding:18px;text-align:center}
.cta b{font-size:1.1rem}.cta p{font-size:.85rem;opacity:.9;margin:6px 0 12px}
.ctas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.musb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--gold);font-size:1.4rem;box-shadow:0 6px 16px rgba(53,33,22,.2)}
.musb.off{opacity:.55;filter:grayscale(1)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes popup{from{opacity:1;transform:translate(-50%,-30%) scale(.6)}to{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.fadein{animation:fadein .35s ease both}

/* new games */
.ov{position:fixed;inset:0;z-index:55;background:rgba(30,20,12,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.qcard{position:relative;width:min(560px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:24px;padding:18px 16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:8px solid var(--c)}
.qcard small{display:block;color:var(--mut);font-size:.82rem;margin-top:4px}
.qt{font-weight:800;margin:0 26px 6px}
.qx{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--ivory);font-size:1rem}
.pic{font-size:clamp(3.6rem,16vw,5.4rem);line-height:1.15;margin:8px 0;letter-spacing:.06em;animation:pop2 .45s cubic-bezier(.2,1.5,.4,1) both}
.qmean{font-weight:700;font-size:1.1rem;margin:10px 0}
.emg{grid-template-columns:1fr 1fr}
.opt.emo{font-family:inherit;font-size:2.6rem;padding:14px 6px;direction:ltr}
.streak{font-weight:800;color:#e67e22;align-self:center}
.players{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.pl{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.88rem;transition:.2s}
.pl.on{border-color:var(--c);background:var(--c);color:#fff}
.board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);border-radius:20px;overflow:hidden;border:3px solid var(--c);aspect-ratio:6/5;background:#fff}
.cell{position:relative;border:1px solid var(--line);background:var(--ivory);display:flex;align-items:center;justify-content:center}
.cell.alt{background:#fff}
.cell b{position:absolute;left:5px;top:3px;font-size:.7rem;color:var(--mut)}
.cell span{font-size:1.3rem;opacity:.8}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lr{stroke:#8a5a2b;stroke-width:6;stroke-linecap:round}.lg{stroke:#b07a43;stroke-width:5;stroke-linecap:round}
.sn{fill:none;stroke:#2e9e6a;stroke-width:13;stroke-linecap:round;opacity:.85}.sh{fill:#1f7a50}
.pc{position:absolute;font-size:clamp(1.5rem,6vw,2.1rem);transform:translate(0,-50%);transition:left .2s,top .2s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:3}
.dice{font-size:3rem;line-height:1;width:64px;text-align:center}
.sky{position:relative;height:min(56vh,480px);border-radius:24px;overflow:hidden;margin-top:12px;border:1px solid var(--line);background:linear-gradient(#bfe3ff,#eef8ff 70%,#fff)}
.sky::before{content:"☁️";position:absolute;left:8%;top:12%;font-size:2.6rem;opacity:.8}.sky::after{content:"☁️";position:absolute;right:10%;top:34%;font-size:2rem;opacity:.7}
.bal{position:absolute;bottom:-150px;width:22%;max-width:120px;aspect-ratio:4/5;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.7),transparent 30%),var(--bc);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;z-index:2}
.bal span{font-size:clamp(1.8rem,8vw,2.8rem);background:rgba(255,255,255,.85);border-radius:50%;width:72%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.bal::after{content:"";position:absolute;left:50%;bottom:-46px;width:2px;height:46px;background:rgba(0,0,0,.25)}
.bal.ok{outline:5px solid var(--ok);outline-offset:3px}
.bal.popd{animation:popb .35s ease-out forwards;pointer-events:none}
.bal.bad{--bc:#555}
@keyframes popb{60%{transform:scale(1.35);opacity:.8}100%{transform:scale(.1);opacity:0}}
@keyframes pop2{from{transform:scale(.3);opacity:0}}
.scene{position:relative;height:230px;border-radius:24px;overflow:hidden;margin-bottom:12px;background:linear-gradient(160deg,var(--champ),var(--ivory));border:1px solid var(--line)}
.bgem{position:absolute;right:-10px;bottom:-24px;font-size:9rem;opacity:.25}
.place{position:absolute;left:12px;top:10px;background:#fff;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.chr{position:absolute;left:12%;bottom:8px;font-size:5.4rem;line-height:1}
.prop{position:absolute;right:14%;bottom:18px;font-size:3rem}
.bub{position:absolute;left:34%;right:6%;top:42px;min-height:70px;background:#fff;border-radius:22px 22px 22px 6px;box-shadow:0 8px 20px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;padding:10px 14px;border:3px solid var(--c)}
.bub.said{animation:pop2 .4s both}
.bub .ar{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700;line-height:1.4;color:var(--cd)}
.dots3{display:flex;gap:6px}.dots3 i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.4;animation:pulse 1s infinite}.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
.map{position:relative;height:min(70vh,620px);border-radius:24px;overflow:hidden;background:radial-gradient(circle at 20% 15%,#fff 0,transparent 40%),linear-gradient(#f9efd6,#efe0bd);border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.road{fill:none;stroke:#fff;stroke-width:26;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 34;opacity:.95}
.stn{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
.stn .se{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 18px rgba(53,33,22,.2)}
.stn b{font-size:.78rem;background:#fff;border-radius:999px;padding:1px 10px}
.stn i{position:absolute;right:-4px;top:-4px;font-style:normal}
.stn.done .se{border-color:var(--ok)}.stn.lock{filter:grayscale(1);opacity:.6}
.stn:not(.lock):not(.done) .se{animation:pulse 1.4s infinite}
.pass{margin-top:10px;background:var(--c);color:#fff;border-radius:18px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pass div{display:flex;gap:6px}.stp{width:38px;height:38px;border-radius:50%;border:2px dashed rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.stp.on{background:#fff;border:2px solid var(--gold)}
.stcard{text-align:center;padding:40px 10px}.stcard .bigem{font-size:6rem}.stcard h2{font-size:1.6rem}
.stampbig{font-size:5rem;width:130px;height:130px;margin:0 auto 8px;border-radius:50%;border:6px double var(--ok);display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);animation:pop2 .5s both}
.stampbig.fail{border-color:var(--no)}
.gcard.new::after{content:"BARU";position:absolute;right:10px;top:10px;background:var(--gold);color:#2a1a0f;font-size:.62rem;font-weight:800;border-radius:999px;padding:2px 8px}

@media(min-width:620px){.games{grid-template-columns:repeat(3,1fr)}.mem{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgc" style="right:-140px;top:-140px;width:360px;height:360px;background:var(--champ);opacity:.35"></div>
<div class="bgc" style="left:-160px;bottom:-160px;width:380px;height:380px;border:2px solid var(--gold);opacity:.4"></div>
<div id="app"></div>

const ITEMS=[{"n": "2251", "ar": "أَرَى أَنَّ التَّعْلِيمَ الْمَجَّانِيَّ حَقٌّ لِكُلِّ مُوَاطِنٍ، وَذَلِكَ لِأَنَّهُ أَسَاسُ التَّنْمِيَةِ.", "tr": "Arā anna at-taʿlīma al-majjāniyya ḥaqqun li-kulli muwāṭinin, wa dhālika li-annahu asāsu at-tanmiyati.", "id": "Menurut saya pendidikan gratis adalah hak setiap warga, karena ia dasar pembangunan.", "t": 1, "em": ""}, {"n": "2252", "ar": "لَا أَنْكِرُ وُجُودَ مَشَاكِلَ، وَمَعَ ذَلِكَ أَعْتَقِدُ أَنَّ الْحَلَّ مُمْكِنٌ.", "tr": "Lā unkiru wujūda mashākila, wa maʿa dhālika aʿtaqidu anna al-ḥalla mumkinun.", "id": "Saya tidak menyangkal adanya masalah, namun saya yakin solusinya mungkin.", "t": 1, "em": ""}, {"n": "2253", "ar": "الْحُجَّةُ الْأَقْوَى فِي رَأْيِي هِيَ مَا تَدْعَمُهُ الْأَرْقَامُ.", "tr": "Al-ḥujjatu al-aqwā fī raʾyī hiya mā tadʿamuhu al-arqāmu.", "id": "Argumen yang paling kuat menurut saya adalah yang didukung oleh angka.", "t": 1, "em": ""}, {"n": "2254", "ar": "إِذَا نَظَرْنَا إِلَى الْمَوْضُوعِ مِنْ زَاوِيَةٍ أُخْرَى فَسَنَجِدُ نَتِيجَةً مُخْتَلِفَةً.", "tr": "Idhā naẓarnā ilā al-mawḍūʿi min zāwiyatin ukhrā fasanajidu natījatan mukhtalifatan.", "id": "Jika kita melihat masalahnya dari sudut lain, kita akan menemukan hasil yang berbeda.", "t": 1, "em": ""}, {"n": "2255", "ar": "لَيْسَ كُلُّ مَنْ يُخَالِفُنَا الرَّأْيَ عَدُوًّا لَنَا.", "tr": "Laysa kullu man yukhālifunā ar-raʾya ʿaduwwan lanā.", "id": "Tidak semua orang yang berbeda pendapat dengan kita adalah musuh kita.", "t": 1, "em": ""}, {"n": "2256", "ar": "يَبْدُو لِي أَنَّ هَذِهِ الْحُجَّةَ تَقُومُ عَلَى افْتِرَاضٍ خَاطِئٍ.", "tr": "Yabdū lī anna hādhihi al-ḥujjata taqūmu ʿalā iftirāḍin khāṭiʾin.", "id": "Menurut saya argumen ini bertumpu pada asumsi yang keliru.", "t": 1, "em": ""}, {"n": "2257", "ar": "لَوْ كَانَ هَذَا صَحِيحًا لَظَهَرَتْ نَتَائِجُهُ فِي السِّنِينَ الْمَاضِيَةِ.", "tr": "Law kāna hādhā ṣaḥīḥan lazaharat natāʾijuhu fī as-sinīna al-māḍiyati.", "id": "Seandainya ini benar, hasilnya sudah tampak pada tahun-tahun lalu.", "t": 1, "em": ""}, {"n": "2258", "ar": "أُوَافِقُكَ فِي الْمَبْدَإِ، وَأَخْتَلِفُ مَعَكَ فِي التَّفَاصِيلِ.", "tr": "Uwāfiquka fī al-mabdaʾi, wa akhtalifu maʿaka fī at-tafāṣīli.", "id": "Saya setuju denganmu dalam prinsip, tetapi berbeda pendapat dalam rinciannya.", "t": 1, "em": ""}, {"n": "2259", "ar": "بِنَاءً عَلَى مَا سَبَقَ، يُمْكِنُنَا أَنْ نَسْتَنْتِجَ مَا يَلِي.", "tr": "Bināʾan ʿalā mā sabaqa, yumkinunā an nastantija mā yalī.", "id": "Berdasarkan apa yang telah disebutkan, kita dapat menyimpulkan hal berikut.", "t": 1, "em": ""}, {"n": "2260", "ar": "لَا يَكْفِي أَنْ نَنْتَقِدَ، بَلْ يَجِبُ أَنْ نَقْتَرِحَ بَدَائِلَ.", "tr": "Lā yakfī an nantaqida, bal yajibu an naqtariḥa badāʾila.", "id": "Tidak cukup hanya mengkritik, tetapi kita harus mengusulkan alternatif.", "t": 1, "em": ""}, {"n": "2261", "ar": "مِنَ الْمُؤَكَّدِ أَنَّ لِكُلِّ قَرَارٍ ثَمَنًا، وَالسُّؤَالُ هُوَ مَنْ يَدْفَعُهُ.", "tr": "Mina al-muʾakkadi anna li-kulli qarārin thamanan, was-suʾālu huwa man yadfaʿuhu.", "id": "Yang pasti setiap keputusan ada harganya, dan pertanyaannya siapa yang membayarnya.", "t": 1, "em": "🏷️💳"}, {"n": "2262", "ar": "لَا يُمْكِنُ تَعْمِيمُ حَالَةٍ وَاحِدَةٍ عَلَى الْمُجْتَمَعِ كُلِّهِ.", "tr": "Lā yumkinu taʿmīmu ḥālatin wāḥidatin ʿalā al-mujtamaʿi kullihi.", "id": "Satu kasus tidak bisa digeneralisasi untuk seluruh masyarakat.", "t": 1, "em": ""}, {"n": "2263", "ar": "رَغْمَ أَهَمِّيَّةِ الْمَوْضُوعِ، فَإِنَّ النِّقَاشَ حَوْلَهُ مَحْدُودٌ.", "tr": "Raghma ahammiyyati al-mawḍūʿi, fa-inna an-niqāsha ḥawlahu maḥdūdun.", "id": "Meskipun topiknya penting, pembahasan tentangnya terbatas.", "t": 1, "em": ""}, {"n": "2264", "ar": "أُرِيدُ أَنْ أَسْمَعَ الْحُجَجَ الْمُضَادَّةَ قَبْلَ أَنْ أُكَوِّنَ رَأْيِي.", "tr": "Urīdu an asmaʿa al-ḥujaja al-muḍāddata qabla an ukawwina raʾyī.", "id": "Saya ingin mendengar argumen tandingan sebelum membentuk pendapat.", "t": 1, "em": ""}, {"n": "2265", "ar": "مَا تَقُولُهُ مَنْطِقِيٌّ، غَيْرَ أَنَّهُ لَا يُنَاسِبُ وَاقِعَنَا.", "tr": "Mā taqūluhu manṭiqiyyun, ghayra annahu lā yunāsibu wāqiʿanā.", "id": "Apa yang kamu katakan logis, hanya saja tidak sesuai dengan kenyataan kita.", "t": 1, "em": ""}, {"n": "2266", "ar": "يَنْبَغِي أَلَّا نَحْكُمَ عَلَى الْفِكْرَةِ قَبْلَ أَنْ نَفْهَمَهَا جَيِّدًا.", "tr": "Yanbaghī allā naḥkuma ʿalā al-fikrati qabla an nafhamahā jayyidan.", "id": "Kita sebaiknya tidak menilai suatu gagasan sebelum memahaminya dengan baik.", "t": 1, "em": ""}, {"n": "2267", "ar": "لَقَدْ أَقْنَعَتْنِي حُجَّتُكَ، وَسَأُغَيِّرُ مَوْقِفِي.", "tr": "Laqad aqnaʿat-nī ḥujjatuka, wa saʾughayyiru mawqifī.", "id": "Argumenmu telah meyakinkan saya, dan saya akan mengubah sikap saya.", "t": 1, "em": ""}, {"n": "2268", "ar": "يَرَى كَثِيرُونَ أَنَّ الْعَمَلَ عَنْ بُعْدٍ يُحَسِّنُ جَوْدَةَ الْحَيَاةِ.", "tr": "Yarā kathīrūna anna al-ʿamala ʿan buʿdin yuḥassinu jawdata al-ḥayāti.", "id": "Banyak orang berpendapat bahwa bekerja jarak jauh meningkatkan kualitas hidup.", "t": 2, "em": ""}, {"n": "2269", "ar": "مِنَ الْمُهِمِّ أَنْ نُعْطِيَ الشَّبَابَ فُرْصَةً لِلْمُشَارَكَةِ فِي الْقَرَارَاتِ.", "tr": "Mina al-muhimmi an nuʿṭiya ash-shababa furṣatan lil-mushārakati fī al-qarārāti.", "id": "Penting bagi kita memberi pemuda kesempatan ikut dalam pengambilan keputusan.", "t": 2, "em": ""}, {"n": "2270", "ar": "تَتَزَايَدُ الْفَجْوَةُ بَيْنَ الْأَغْنِيَاءِ وَالْفُقَرَاءِ عَامًا بَعْدَ عَامٍ.", "tr": "Tatazāyadu al-fajwatu bayna al-aghniyāʾi wal-fuqarāʾi ʿāman baʿda ʿāmin.", "id": "Kesenjangan antara kaya dan miskin semakin melebar dari tahun ke tahun.", "t": 2, "em": ""}, {"n": "2271", "ar": "لَا أُؤْمِنُ بِأَنَّ الْمَالَ وَحْدَهُ يَصْنَعُ السَّعَادَةَ.", "tr": "Lā uʾminu bi-anna al-māla waḥdahu yaṣnaʿu as-saʿādata.", "id": "Saya tidak percaya bahwa uang saja menciptakan kebahagiaan.", "t": 2, "em": "💵"}, {"n": "2272", "ar": "أَصْبَحَ الْوَالِدَانِ قَلِقَيْنِ مِنْ تَأْثِيرِ الشَّاشَاتِ عَلَى أَطْفَالِهِمَا.", "tr": "Aṣbaḥa al-wālidāni qaliqayni min taʾthīri ash-shāshāti ʿalā aṭfālihimā.", "id": "Para orang tua menjadi cemas akan pengaruh layar terhadap anak-anak mereka.", "t": 2, "em": "😟🧒"}, {"n": "2273", "ar": "أَعْتَقِدُ أَنَّ احْتِرَامَ كِبَارِ السِّنِّ مِقْيَاسٌ لِرُقِيِّ الْمُجْتَمَعِ.", "tr": "Aʿtaqidu anna iḥtirāma kibāri as-sinni miqyāsun li-ruqiyyi al-mujtamaʿi.", "id": "Saya yakin menghormati orang lanjut usia adalah ukuran kemajuan masyarakat.", "t": 2, "em": ""}, {"n": "2274", "ar": "هَلْ تُؤَيِّدُ فَرْضَ ضَرِيبَةٍ عَلَى الْمَشْرُوبَاتِ السُّكَّرِيَّةِ؟", "tr": "Hal tuʾayyidu farḍa ḍarībatin ʿalā al-mashrūbāti as-sukkariyyati?", "id": "Apakah kamu mendukung pengenaan pajak atas minuman manis?", "t": 2, "em": ""}, {"n": "2275", "ar": "الْعَمَلُ التَّطَوُّعِيُّ لَا يُغْنِي عَنْ دَوْرِ الدَّوْلَةِ.", "tr": "Al-ʿamalu at-taṭawwuʿiyyu lā yughnī ʿan dawri ad-dawlati.", "id": "Kerja sukarela tidak menggantikan peran negara.", "t": 2, "em": ""}, {"n": "2276", "ar": "يَتَغَيَّرُ مَفْهُومُ الْأُسْرَةِ مَعَ تَغَيُّرِ الْعَصْرِ.", "tr": "Yataghayyaru mafhūmu al-usrati maʿa taghayyuri al-ʿaṣri.", "id": "Konsep keluarga berubah seiring perubahan zaman.", "t": 2, "em": "👨‍👩‍👧"}, {"n": "2277", "ar": "مَنْ يَتَحَمَّلُ مَسْؤُولِيَّةَ تَرْبِيَةِ الطِّفْلِ: الْأُسْرَةُ أَمِ الْمَدْرَسَةُ؟", "tr": "Man yataḥammalu masʾūliyyata tarbiyati aṭ-ṭifli: al-usratu am al-madrasatu?", "id": "Siapa yang bertanggung jawab mendidik anak: keluarga atau sekolah?", "t": 2, "em": "🧒👨‍👩‍👧"}, {"n": "2278", "ar": "مِنَ الظُّلْمِ أَنْ نَحْكُمَ عَلَى النَّاسِ مِنْ مَظْهَرِهِمْ فَقَطْ.", "tr": "Mina aẓ-ẓulmi an naḥkuma ʿalā an-nāsi min maẓharihim faqaṭ.", "id": "Merupakan ketidakadilan menilai orang hanya dari penampilannya.", "t": 2, "em": ""}, {"n": "2279", "ar": "تُسَاهِمُ الْمَرْأَةُ فِي الِاقْتِصَادِ بِقَدْرِ مَا يُسَاهِمُ الرَّجُلُ.", "tr": "Tusāhimu al-marʾatu fī al-iqtiṣādi bi-qadri mā yusāhimu ar-rajulu.", "id": "Perempuan berkontribusi dalam ekonomi sebanyak laki-laki.", "t": 2, "em": "📊"}, {"n": "2280", "ar": "أَظُنُّ أَنَّ الْإِعْلَانَاتِ تُؤَثِّرُ فِي قَرَارَاتِنَا أَكْثَرَ مِمَّا نَعْتَرِفُ.", "tr": "Aẓunnu anna al-iʿlānāti tuʾaththiru fī qarārātinā akthara mimmā naʿtarifu.", "id": "Saya kira iklan memengaruhi keputusan kita lebih dari yang kita akui.", "t": 2, "em": "📣"}, {"n": "2281", "ar": "يَجِبُ أَنْ تَكُونَ الْمُوَاصَلَاتُ الْعَامَّةُ أَرْخَصَ وَأَسْرَعَ.", "tr": "Yajibu an takūna al-muwāṣalātu al-ʿāmmatu arkhaṣa wa asraʿa.", "id": "Transportasi umum harus lebih murah dan lebih cepat.", "t": 2, "em": "🏷️"}, {"n": "2282", "ar": "الْفَنُّ لَيْسَ تَرَفًا، بَلْ حَاجَةٌ إِنْسَانِيَّةٌ.", "tr": "Al-fannu laysa tarafan, bal ḥājatun insāniyyatun.", "id": "Seni bukanlah kemewahan, melainkan kebutuhan manusia.", "t": 2, "em": "🎨"}, {"n": "2283", "ar": "كُلَّمَا ازْدَادَ الْوَعْيُ قَلَّتِ الْمَشَاكِلُ الِاجْتِمَاعِيَّةُ.", "tr": "Kullamā izdāda al-wiʿyu qallati al-mashākilu al-ijtimāʿiyyatu.", "id": "Semakin tinggi kesadaran, semakin sedikit masalah sosial.", "t": 2, "em": ""}, {"n": "2284", "ar": "لَا أُحِبُّ أَنْ يَفْرِضَ عَلَيَّ أَحَدٌ طَرِيقَةَ حَيَاتِي.", "tr": "Lā uḥibbu an yafriḍa ʿalayya aḥadun ṭarīqata ḥayātī.", "id": "Saya tidak suka ada orang yang memaksakan cara hidup kepada saya.", "t": 2, "em": ""}, {"n": "2285", "ar": "اسْمَحُوا لِي أَنْ أُقَدِّمَ نَفْسِي قَبْلَ أَنْ أَبْدَأَ الْعَرْضَ.", "tr": "Ismaḥū lī an uqaddima nafsī qabla an abdaʾa al-ʿarḍa.", "id": "Izinkan saya memperkenalkan diri sebelum memulai presentasi.", "t": 3, "em": "📊"}, {"n": "2286", "ar": "يَتَنَاوَلُ هَذَا الْعَرْضُ ثَلَاثَةَ مَحَاوِرَ رَئِيسِيَّةٍ.", "tr": "Yatanāwalu hādhā al-ʿarḍu thalāthata maḥāwira raʾīsiyyatin.", "id": "Presentasi ini membahas tiga pokok utama.", "t": 3, "em": "📊"}, {"n": "2287", "ar": "كَمَا يَظْهَرُ فِي الرَّسْمِ الْبَيَانِيِّ، ارْتَفَعَتِ الْمَبِيعَاتُ بِنِسْبَةٍ كَبِيرَةٍ.", "tr": "Kamā yaẓharu fī ar-rasmi al-bayāniyyi, irtafaʿati al-mabīʿātu bi-nisbatin kabīratin.", "id": "Seperti tampak pada grafik, penjualan meningkat dengan persentase besar.", "t": 3, "em": ""}, {"n": "2288", "ar": "أَخْشَى أَنَّ الْوَقْتَ لَا يَكْفِي لِمُنَاقَشَةِ كُلِّ الْبُنُودِ.", "tr": "Akhshā anna al-waqta lā yakfī li-munāqashati kulli al-bunūdi.", "id": "Saya khawatir waktunya tidak cukup untuk membahas semua butir.", "t": 3, "em": "😟"}, {"n": "2289", "ar": "هَلْ لَدَى أَحَدٍ مُلَاحَظَةٌ أَوِ اعْتِرَاضٌ عَلَى هَذَا الْبَنْدِ؟", "tr": "Hal ladā aḥadin mulāḥaẓatun awi iʿtirāḍun ʿalā hādhā al-bandi?", "id": "Adakah yang punya catatan atau keberatan atas butir ini?", "t": 3, "em": ""}, {"n": "2290", "ar": "سَنُرْسِلُ مَحْضَرَ الِاجْتِمَاعِ خِلَالَ أَرْبَعٍ وَعِشْرِينَ سَاعَةً.", "tr": "Sanursilu maḥḍara al-ijtimāʿi khilāla arbaʿin wa ʿishrīna sāʿatan.", "id": "Kami akan mengirim notulen rapat dalam dua puluh empat jam.", "t": 3, "em": "👥⏰"}, {"n": "2291", "ar": "أُرِيدُ أَنْ أُؤَكِّدَ أَنَّ الْمَوْعِدَ النِّهَائِيَّ لَا يَقْبَلُ التَّأْجِيلَ.", "tr": "Urīdu an uʾakkida anna al-mawʿida an-nihāʾiyya lā yaqbalu at-taʾjīla.", "id": "Saya ingin menegaskan bahwa tenggat akhir tidak bisa ditunda.", "t": 3, "em": ""}, {"n": "2292", "ar": "مِنْ خِلَالِ هَذِهِ الدِّرَاسَةِ تَبَيَّنَ لَنَا أَنَّ السُّوقَ تَتَغَيَّرُ بِسُرْعَةٍ.", "tr": "Min khilāli hādhihi ad-dirāsati tabayyana lanā anna as-sūqa tataghayyaru bi-surʿatin.", "id": "Melalui kajian ini jelas bagi kami bahwa pasar berubah dengan cepat.", "t": 3, "em": "🛒"}, {"n": "2293", "ar": "أَشْكُرُكُمْ عَلَى حُسْنِ الْإِصْغَاءِ، وَأَنَا مُسْتَعِدٌّ لِلْإِجَابَةِ عَنْ أَسْئِلَتِكُمْ.", "tr": "Ashkurukum ʿalā ḥusni al-iṣghāʾi, wa anā mustaʿiddun lil-ijābati ʿan asʾilatikum.", "id": "Terima kasih atas perhatian Anda, dan saya siap menjawab pertanyaan Anda.", "t": 3, "em": ""}, {"n": "2294", "ar": "أُعِيدُ صِيَاغَةَ سُؤَالِكَ لِلتَّأَكُّدِ مِنْ أَنِّي فَهِمْتُهُ.", "tr": "Uʿīdu ṣiyāghata suʾālika lit-taʾakkudi min annī fahimtuhu.", "id": "Saya merumuskan ulang pertanyaanmu untuk memastikan saya memahaminya.", "t": 3, "em": ""}, {"n": "2295", "ar": "لَمْ نَتَوَصَّلْ إِلَى اتِّفَاقٍ، لِذَا سَنُؤَجِّلُ التَّصْوِيتَ.", "tr": "Lam natawaṣṣal ilā ittifāqin, li-dhā sanuʾajjilu at-taṣwīta.", "id": "Kami belum mencapai kesepakatan, karena itu pemungutan suara kita tunda.", "t": 3, "em": ""}, {"n": "2296", "ar": "يُرْجَى إِغْلَاقُ الْهَوَاتِفِ أَثْنَاءَ الِاجْتِمَاعِ.", "tr": "Yurjā ighlāqu al-hawātifi athnāʾa al-ijtimāʿi.", "id": "Mohon matikan ponsel selama rapat.", "t": 3, "em": "📱👥"}, {"n": "2297", "ar": "الْغَرَضُ مِنْ هَذَا الِاجْتِمَاعِ هُوَ تَقْيِيمُ مَا أُنْجِزَ حَتَّى الْآنَ.", "tr": "Al-gharaḍu min hādhā al-ijtimāʿi huwa taqyīmu mā unjiza ḥattā al-āna.", "id": "Tujuan rapat ini adalah menilai apa yang telah dicapai sejauh ini.", "t": 3, "em": "👥"}, {"n": "2298", "ar": "سَأَنْتَقِلُ الْآنَ إِلَى الشَّرِيحَةِ التَّالِيَةِ.", "tr": "Saʾantaqilu al-āna ilā ash-sharīḥati at-tāliyati.", "id": "Saya sekarang beralih ke slide berikutnya.", "t": 3, "em": ""}, {"n": "2299", "ar": "لِنُلَخِّصِ الْقَرَارَاتِ الَّتِي اتُّخِذَتْ فِي هَذَا الِاجْتِمَاعِ.", "tr": "Linulakhkhiṣi al-qarārāti allatī uttukhidhat fī hādhā al-ijtimāʿi.", "id": "Mari kita ringkas keputusan yang diambil dalam rapat ini.", "t": 3, "em": "👥"}, {"n": "2300", "ar": "نَحْنُ بِحَاجَةٍ إِلَى مَزِيدٍ مِنَ الشَّفَافِيَّةِ فِي إِدَارَةِ الْمَشْرُوعِ.", "tr": "Naḥnu bi-ḥājatin ilā mazīdin mina ash-shaffāfiyyati fī idārati al-mashrūʿi.", "id": "Kita membutuhkan lebih banyak transparansi dalam pengelolaan proyek.", "t": 3, "em": ""}, {"n": "2301", "ar": "نَرْغَبُ فِي مُرَاجَعَةِ بُنُودِ الْعَقْدِ قَبْلَ التَّوْقِيعِ النِّهَائِيِّ.", "tr": "Narghabu fī murājaʿati bunūdi al-ʿaqdi qabla at-tawqīʿi an-nihāʾiyyi.", "id": "Kami ingin meninjau butir-butir kontrak sebelum tanda tangan akhir.", "t": 4, "em": "📑✋"}, {"n": "2302", "ar": "السِّعْرُ الَّذِي تَعْرِضُونَهُ أَعْلَى مِنْ مِيزَانِيَّتِنَا.", "tr": "As-siʿru alladhī taʿriḍūnahu aʿlā min mīzāniyyatinā.", "id": "Harga yang Anda tawarkan lebih tinggi dari anggaran kami.", "t": 4, "em": "🏷️"}, {"n": "2303", "ar": "مَا هِيَ شُرُوطُ الدَّفْعِ وَمَوَاعِيدُ التَّسْلِيمِ؟", "tr": "Mā hiya shurūṭu ad-dafʿi wa mawāʿīdu at-taslīmi?", "id": "Apa saja syarat pembayaran dan jadwal pengiriman?", "t": 4, "em": ""}, {"n": "2304", "ar": "لَا نَسْتَطِيعُ قَبُولَ هَذَا الشَّرْطِ بِصِيغَتِهِ الْحَالِيَّةِ.", "tr": "Lā nastaṭīʿu qabūla hādhā ash-sharṭi bi-ṣīghatihi al-ḥāliyyati.", "id": "Kami tidak bisa menerima syarat ini dalam rumusannya yang sekarang.", "t": 4, "em": ""}, {"n": "2305", "ar": "نَحْنُ مُسْتَعِدُّونَ لِلتَّنَازُلِ عَنْ نُقْطَةٍ مُقَابِلَ نُقْطَةٍ أُخْرَى.", "tr": "Naḥnu mustaʿiddūna lit-tanāzuli ʿan nuqṭatin muqābila nuqṭatin ukhrā.", "id": "Kami bersedia mengalah pada satu poin dengan imbalan poin lain.", "t": 4, "em": ""}, {"n": "2306", "ar": "يَجِبُ أَنْ يَنُصَّ الْعَقْدُ صَرَاحَةً عَلَى الْعُقُوبَاتِ عِنْدَ التَّأْخِيرِ.", "tr": "Yajibu an yanuṣṣa al-ʿaqdu ṣarāḥatan ʿalā al-ʿuqūbāti ʿinda at-taʾkhīri.", "id": "Kontrak harus menyebutkan secara tegas sanksi jika terjadi keterlambatan.", "t": 4, "em": "📑"}, {"n": "2307", "ar": "مَا زِلْنَا نَدْرُسُ عَرْضَكُمْ وَسَنَرُدُّ عَلَيْكُمْ قَرِيبًا.", "tr": "Mā zilnā nadrusu ʿarḍakum wa sanaruddu ʿalaykum qarīban.", "id": "Kami masih mempelajari tawaran Anda dan akan segera menjawab.", "t": 4, "em": ""}, {"n": "2308", "ar": "نُقَدِّرُ هَذِهِ الْمَرُونَةَ وَنَأْمُلُ فِي شَرَاكَةٍ طَوِيلَةِ الْأَمَدِ.", "tr": "Nuqaddiru hādhihi al-maruwnata wa naʾmulu fī sharākatin ṭawīlati al-amadi.", "id": "Kami menghargai fleksibilitas ini dan berharap kemitraan jangka panjang.", "t": 4, "em": ""}, {"n": "2309", "ar": "إِذَا لَمْ تَلْتَزِمُوا بِالْمَوَاعِيدِ فَسَنُضْطَرُّ إِلَى فَسْخِ الْعَقْدِ.", "tr": "Idhā lam taltazimū bil-mawāʿīdi fasanuḍṭarru ilā faskhi al-ʿaqdi.", "id": "Jika Anda tidak menaati jadwal, kami terpaksa membatalkan kontrak.", "t": 4, "em": "📑"}, {"n": "2310", "ar": "هَلْ يُمْكِنُ إِدْرَاجُ ضَمَانٍ لِمُدَّةِ سَنَتَيْنِ؟", "tr": "Hal yumkinu idrāju ḍamānin li-muddati sanatayni?", "id": "Bisakah dimasukkan garansi selama dua tahun?", "t": 4, "em": ""}, {"n": "2311", "ar": "الْمُفَاوَضَاتُ نَاجِحَةٌ حِينَ يَرْبَحُ الطَّرَفَانِ مَعًا.", "tr": "Al-mufāwaḍātu nājiḥatun ḥīna yarbaḥu aṭ-ṭarafāni maʿan.", "id": "Negosiasi berhasil ketika kedua belah pihak sama-sama untung.", "t": 4, "em": ""}, {"n": "2312", "ar": "نُرِيدُ تَوْضِيحًا بِشَأْنِ الْمَسْؤُولِيَّةِ فِي حَالَةِ الْأَضْرَارِ.", "tr": "Nurīdu tawḍīḥan bi-shaʾni al-masʾūliyyati fī ḥālati al-aḍrāri.", "id": "Kami menginginkan penjelasan mengenai tanggung jawab bila terjadi kerusakan.", "t": 4, "em": ""}, {"n": "2313", "ar": "لِنَتَّفِقْ عَلَى مُسَوَّدَةٍ أَوَّلِيَّةٍ ثُمَّ نَبْدَأُ بِالتَّعْدِيلَاتِ.", "tr": "Linattafiq ʿalā musawwadatin awwaliyyatin thumma nabdaʾu bit-taʿdīlāti.", "id": "Mari kita sepakati draf awal lalu mulai dengan revisi.", "t": 4, "em": ""}, {"n": "2314", "ar": "تُعَدُّ هَذِهِ الْفُرْصَةُ مُنَاسِبَةً لِكِلَا الطَّرَفَيْنِ.", "tr": "Tuʿaddu hādhihi al-furṣatu munāsibatan li-kilā aṭ-ṭarafayni.", "id": "Kesempatan ini dianggap cocok bagi kedua belah pihak.", "t": 4, "em": ""}, {"n": "2315", "ar": "بَعْدَ الدِّرَاسَةِ وَالنِّقَاشِ، وَافَقْنَا عَلَى الصِّيغَةِ النِّهَائِيَّةِ.", "tr": "Baʿda ad-dirāsati wan-niqāshi, wāfaqnā ʿalā aṣ-ṣīghati an-nihāʾiyyati.", "id": "Setelah dikaji dan dibahas, kami menyetujui rumusan akhir.", "t": 4, "em": ""}, {"n": "2316", "ar": "إِنَّ الصَّبْرَ فِي الْمُفَاوَضَاتِ غَالِبًا مَا يُحَقِّقُ نَتَائِجَ أَفْضَلَ.", "tr": "Inna aṣ-ṣabra fī al-mufāwaḍāti ghāliban mā yuḥaqqiqu natāʾija afḍala.", "id": "Kesabaran dalam negosiasi sering kali menghasilkan hasil yang lebih baik.", "t": 4, "em": ""}, {"n": "2317", "ar": "نَحْتَاجُ إِلَى مُوَافَقَةٍ خَطِّيَّةٍ قَبْلَ أَنْ نَبْدَأَ التَّنْفِيذَ.", "tr": "Naḥtāju ilā muwāfaqatin khaṭṭiyyatin qabla an nabdaʾa at-tanfīdha.", "id": "Kami membutuhkan persetujuan tertulis sebelum memulai pelaksanaan.", "t": 4, "em": ""}, {"n": "2318", "ar": "لَا بُدَّ مِنَ الْإِشَارَةِ إِلَى أَنَّ الْأَسْعَارَ قَابِلَةٌ لِلتَّغْيِيرِ.", "tr": "Lā budda mina al-ishārati ilā anna al-asʿāra qābilatun lit-taghyīri.", "id": "Perlu ditegaskan bahwa harga dapat berubah.", "t": 4, "em": "🏷️"}, {"n": "2319", "ar": "لَمْ تَعُدِ الْأَخْبَارُ تَصِلُ إِلَيْنَا مِنَ الصُّحُفِ فَقَطْ، بَلْ مِنْ مَوَاقِعِ التَّوَاصُلِ أَيْضًا.", "tr": "Lam taʿudi al-akhbāru taṣilu ilaynā mina aṣ-ṣuḥufi faqaṭ, bal min mawāqiʿi at-tawāṣuli ayḍan.", "id": "Berita tidak lagi sampai kepada kita hanya dari surat kabar, tetapi juga dari media sosial.", "t": 5, "em": "📰✉️"}, {"n": "2320", "ar": "يَجِبُ أَنْ نَتَأَكَّدَ مِنْ مَصْدَرِ الْخَبَرِ قَبْلَ أَنْ نُشَارِكَهُ.", "tr": "Yajibu an nataʾakkada min maṣdari al-khabari qabla an nushārikahu.", "id": "Kita harus memastikan sumber berita sebelum membagikannya.", "t": 5, "em": "📰"}, {"n": "2321", "ar": "تَسْتَهْدِفُ الْمِنَصَّاتُ مَا نُحِبُّ لِتُبْقِيَنَا أَطْوَلَ وَقْتٍ مُمْكِنٍ.", "tr": "Tastahdifu al-minaṣṣātu mā nuḥibbu li-tubqiyanā aṭwala waqtin mumkinin.", "id": "Platform menargetkan apa yang kita sukai agar kita bertahan selama mungkin.", "t": 5, "em": ""}, {"n": "2322", "ar": "أُحَاوِلُ أَنْ أَقْرَأَ الْخَبَرَ مِنْ أَكْثَرِ مِنْ مَصْدَرٍ.", "tr": "Uḥāwilu an aqraʾa al-khabara min akthari min maṣdarin.", "id": "Saya berusaha membaca berita dari lebih dari satu sumber.", "t": 5, "em": "📖📰"}, {"n": "2323", "ar": "تَأْثِيرُ الْمَشَاهِيرِ عَلَى الشَّبَابِ يَفُوقُ تَأْثِيرَ الْمُعَلِّمِينَ أَحْيَانًا.", "tr": "Taʾthīru al-mashāhīri ʿalā ash-shababi yafūqu taʾthīra al-muʿallimīna aḥyānan.", "id": "Pengaruh selebritas pada anak muda terkadang melebihi pengaruh guru.", "t": 5, "em": "🧒👨‍🏫"}, {"n": "2324", "ar": "حَذَفْتُ التَّطْبِيقَ مِنْ هَاتِفِي لِأَنِّي أَضَعْتُ وَقْتًا كَثِيرًا.", "tr": "Ḥadhaftu at-taṭbīqa min hātifī li-annī aḍaʿtu waqtan kathīran.", "id": "Saya menghapus aplikasi itu dari ponsel karena banyak waktu terbuang.", "t": 5, "em": "📱"}, {"n": "2325", "ar": "لِلْإِعْلَامِ دَوْرٌ مُهِمٌّ فِي تَشْكِيلِ الرَّأْيِ الْعَامِّ.", "tr": "Lil-iʿlāmi dawrun muhimmun fī tashkīli ar-raʾyi al-ʿāmmi.", "id": "Media punya peran penting dalam membentuk opini publik.", "t": 5, "em": ""}, {"n": "2326", "ar": "الصُّورَةُ قَدْ تَكُونُ مُعَدَّلَةً، فَلَا تُصَدِّقْ كُلَّ مَا تَرَى.", "tr": "Aṣ-ṣūratu qad takūnu muʿaddalatan, falā tuṣaddiq kulla mā tarā.", "id": "Gambar bisa saja telah diedit, jadi jangan percaya semua yang kamu lihat.", "t": 5, "em": ""}, {"n": "2327", "ar": "يَكْتُبُ بَعْضُهُمْ تَعْلِيقَاتٍ جَارِحَةً لِأَنَّهُمْ يَخْتَبِئُونَ خَلْفَ أَسْمَاءٍ مُسْتَعَارَةٍ.", "tr": "Yaktubu baʿḍuhum taʿlīqātin jāriḥatan li-annahum yakhtabiʾūna khalfa asmāʾin mustaʿāratin.", "id": "Sebagian orang menulis komentar menyakitkan karena bersembunyi di balik nama samaran.", "t": 5, "em": "✍️"}, {"n": "2328", "ar": "أَصْبَحَ بِإِمْكَانِ أَيِّ شَخْصٍ أَنْ يَنْشُرَ رَأْيَهُ أَمَامَ الْمَلَايِينِ.", "tr": "Aṣbaḥa bi-imkāni ayyi shakhṣin an yanshura raʾyahu amāma al-malāyīni.", "id": "Kini siapa pun bisa menyebarkan pendapatnya di hadapan jutaan orang.", "t": 5, "em": ""}, {"n": "2329", "ar": "لَمْ أَقْرَأِ الْجَرِيدَةَ الْوَرَقِيَّةَ مُنْذُ سَنَوَاتٍ.", "tr": "Lam aqraʾi al-jarīdata al-waraqiyyata mundhu sanawātin.", "id": "Saya sudah bertahun-tahun tidak membaca koran cetak.", "t": 5, "em": "📖📰"}, {"n": "2330", "ar": "هَلْ تَعْتَقِدُ أَنَّ الْإِنْتَرْنِتَ جَعَلَنَا أَقْرَبَ أَمْ أَبْعَدَ عَنْ بَعْضِنَا؟", "tr": "Hal taʿtaqidu anna al-intirnita jaʿalanā aqraba am abʿada ʿan baʿḍinā?", "id": "Menurutmu, apakah internet membuat kita lebih dekat atau lebih jauh satu sama lain?", "t": 5, "em": "🌐"}, {"n": "2331", "ar": "يَجِبُ حِمَايَةُ الْخُصُوصِيَّةِ عِنْدَ نَشْرِ صُوَرِ الْأَطْفَالِ.", "tr": "Yajibu ḥimāyatu al-khuṣūṣiyyati ʿinda nashri ṣuwari al-aṭfāli.", "id": "Privasi harus dilindungi saat mengunggah foto anak-anak.", "t": 5, "em": "📸🧒"}, {"n": "2332", "ar": "تَصْنَعُ الْإِعْلَانَاتُ حَاجَاتٍ جَدِيدَةً لَمْ نَكُنْ نَشْعُرُ بِهَا.", "tr": "Taṣnaʿu al-iʿlānātu ḥājātin jadīdatan lam nakun nashʿuru bihā.", "id": "Iklan menciptakan kebutuhan baru yang tadinya tidak kita rasakan.", "t": 5, "em": "📣"}, {"n": "2333", "ar": "الْفَرْقُ بَيْنَ الْخَبَرِ وَالرَّأْيِ يَجِبُ أَنْ يَكُونَ وَاضِحًا لِلْقَارِئِ.", "tr": "Al-farqu bayna al-khabari war-raʾyi yajibu an yakūna wāḍiḥan lil-qāriʾi.", "id": "Perbedaan antara berita dan opini harus jelas bagi pembaca.", "t": 5, "em": "📰"}, {"n": "2334", "ar": "تَابَعْتُ الْمُؤْتَمَرَ الصُّحُفِيَّ مُبَاشَرَةً عَلَى الْإِنْتَرْنِتِ.", "tr": "Tābaʿtu al-muʾtamara aṣ-ṣuḥufiyya mubāsharatan ʿalā al-intirniti.", "id": "Saya menyaksikan konferensi pers secara langsung di internet.", "t": 5, "em": "🌐"}, {"n": "2335", "ar": "نَشَرَتِ الصَّحِيفَةُ تَصْحِيحًا لِلْخَبَرِ الْخَاطِئِ.", "tr": "Nasharati aṣ-ṣaḥīfatu taṣḥīḥan lil-khabari al-khāṭiʾi.", "id": "Surat kabar menerbitkan koreksi atas berita yang keliru.", "t": 5, "em": "✉️📰"}, {"n": "2336", "ar": "يَتَطَلَّبُ سُوقُ الْعَمَلِ الْيَوْمَ مَهَارَاتٍ لَمْ تَكُنْ مَوْجُودَةً مِنْ قَبْلُ.", "tr": "Yataṭallabu sūqu al-ʿamali al-yawma mahārātin lam takun mawjūdatan min qablu.", "id": "Pasar kerja saat ini membutuhkan keterampilan yang dulu belum ada.", "t": 6, "em": "🛒"}, {"n": "2337", "ar": "لَا يَكْفِي أَنْ نَحْفَظَ الْمَعْلُومَاتِ، بَلْ يَجِبُ أَنْ نَفْهَمَهَا وَنُطَبِّقَهَا.", "tr": "Lā yakfī an naḥfaẓa al-maʿlūmāti, bal yajibu an nafhamahā wa nuṭabbiqahā.", "id": "Tidak cukup menghafal informasi, kita harus memahami dan menerapkannya.", "t": 6, "em": ""}, {"n": "2338", "ar": "الدِّرَاسَةُ فِي الْخَارِجِ تُوَسِّعُ الْمَدَارِكَ وَتُعَلِّمُ الِاسْتِقْلَالَ.", "tr": "Ad-dirāsatu fī al-khāriji tuwassiʿu al-madārika wa tuʿallimu al-istiqlāla.", "id": "Belajar di luar negeri memperluas wawasan dan mengajarkan kemandirian.", "t": 6, "em": "📚"}, {"n": "2339", "ar": "أَرْغَبُ فِي إِكْمَالِ الدِّرَاسَاتِ الْعُلْيَا بَعْدَ التَّخَرُّجِ.", "tr": "Arghabu fī ikmāli ad-dirāsāti al-ʿulyā baʿda at-takharruji.", "id": "Saya ingin melanjutkan studi pascasarjana setelah lulus.", "t": 6, "em": ""}, {"n": "2340", "ar": "الْمُعَلِّمُ الْجَيِّدُ يُلْهِمُ طُلَّابَهُ وَلَا يَكْتَفِي بِالشَّرْحِ.", "tr": "Al-muʿallimu al-jayyidu yulhimu ṭullābahu wa lā yaktafī bish-sharḥi.", "id": "Guru yang baik menginspirasi murid-muridnya, tidak hanya menjelaskan.", "t": 6, "em": "👨‍🏫🧑‍🎓"}, {"n": "2341", "ar": "يُمْكِنُ لِلتَّعَلُّمِ عَنْ بُعْدٍ أَنْ يَنْجَحَ إِذَا الْتَزَمَ الطَّالِبُ بِجَدْوَلٍ.", "tr": "Yumkinu lit-taʿallumi ʿan buʿdin an yanjaḥa idhā iltazama aṭ-ṭālibu bi-jadwalin.", "id": "Belajar jarak jauh bisa berhasil jika siswa menaati jadwal.", "t": 6, "em": "📚🧑‍🎓"}, {"n": "2342", "ar": "اكْتَسَبْتُ الْخِبْرَةَ مِنْ التَّدْرِيبِ الْعَمَلِيِّ أَكْثَرَ مِنَ الْمُحَاضَرَاتِ.", "tr": "Iktasabtu al-khibrata min at-tadrībi al-ʿamaliyyi akthara mina al-muḥāḍarāti.", "id": "Saya mendapat pengalaman dari magang lebih banyak daripada dari kuliah.", "t": 6, "em": ""}, {"n": "2343", "ar": "مِنَ الضَّرُورِيِّ أَنْ تَتَعَلَّمَ لُغَةً أَجْنَبِيَّةً إِلَى جَانِبِ لُغَتِكَ.", "tr": "Mina aḍ-ḍarūriyyi an tataʿallama lughatan ajnabiyyatan ilā jānibi lughatika.", "id": "Penting bagi kamu untuk belajar bahasa asing selain bahasa sendiri.", "t": 6, "em": "📚🗣️"}, {"n": "2344", "ar": "لَيْسَ هُنَاكَ عُمْرٌ مُحَدَّدٌ لِلتَّعَلُّمِ، فَالْعِلْمُ لَا يَنْتَهِي.", "tr": "Laysa hunāka ʿumrun muḥaddadun lit-taʿallumi, fal-ʿilmu lā yantahī.", "id": "Tidak ada usia tertentu untuk belajar, sebab ilmu tidak berujung.", "t": 6, "em": "📚"}, {"n": "2345", "ar": "يَتَغَيَّرُ شَكْلُ الْوَظَائِفِ بِسُرْعَةٍ بِسَبَبِ التِّقْنِيَةِ.", "tr": "Yataghayyaru shaklu al-waẓāʾifi bi-surʿatin bi-sababi at-tiqniyyati.", "id": "Bentuk pekerjaan berubah cepat karena teknologi.", "t": 6, "em": ""}, {"n": "2346", "ar": "حَصَلْتُ عَلَى مِنْحَةٍ لِدِرَاسَةِ الْمَاجِسْتِيرِ فِي الْقَاهِرَةِ.", "tr": "Ḥaṣaltu ʿalā minḥatin li-dirāsati al-mājistīri fī al-Qāhirati.", "id": "Saya mendapat beasiswa untuk studi magister di Kairo.", "t": 6, "em": ""}, {"n": "2347", "ar": "عَلَى الْمَدَارِسِ أَنْ تُدَرِّسَ التَّفْكِيرَ النَّقْدِيَّ لَا الْحِفْظَ فَقَطْ.", "tr": "ʿAlā al-madārisi an tudarrisa at-tafkīra an-naqdiyya lā al-ḥifẓa faqaṭ.", "id": "Sekolah seharusnya mengajarkan berpikir kritis, bukan sekadar menghafal.", "t": 6, "em": "🏫"}, {"n": "2348", "ar": "بَدَأْتُ دَوْرَةً عَلَى الْإِنْتَرْنِتِ لِأُحَسِّنَ مَهَارَاتِي فِي الْكِتَابَةِ.", "tr": "Badaʾtu dawratan ʿalā al-intirniti li-uḥassina mahārātī fī al-kitābati.", "id": "Saya mulai kursus daring untuk meningkatkan keterampilan menulis.", "t": 6, "em": "✍️"}, {"n": "2349", "ar": "يُسَاعِدُ الْعَمَلُ الْجَمَاعِيُّ الطُّلَّابَ عَلَى تَعَلُّمِ الْقِيَادَةِ.", "tr": "Yusāʿidu al-ʿamalu al-jamāʿiyyu aṭ-ṭullāba ʿalā taʿallumi al-qiyādati.", "id": "Kerja kelompok membantu para siswa belajar kepemimpinan.", "t": 6, "em": "🧑‍🎓📚"}, {"n": "2350", "ar": "مَا أَهَمُّ مَهَارَةٍ تَنْصَحُ بِتَعَلُّمِهَا لِلْمُسْتَقْبَلِ؟", "tr": "Mā ahammu mahāratin tanṣaḥu bi-taʿallumihā lil-mustaqbali?", "id": "Keterampilan terpenting apa yang kamu sarankan untuk masa depan?", "t": 6, "em": ""}, {"n": "2351", "ar": "يَحْتَاجُ الطَّالِبُ إِلَى بِيئَةٍ هَادِئَةٍ لِيُذَاكِرَ بِتَرْكِيزٍ.", "tr": "Yaḥtāju aṭ-ṭālibu ilā bīʾatin hādiʾatin li-yudhākira bi-tarkīzin.", "id": "Siswa membutuhkan lingkungan yang tenang untuk belajar dengan fokus.", "t": 6, "em": "🧑‍🎓😌"}, {"n": "2352", "ar": "الِامْتِحَانَاتُ لَيْسَتِ الْمِقْيَاسَ الْوَحِيدَ لِلْفَهْمِ.", "tr": "Al-imtiḥānātu laysati al-miqyāsa al-waḥīda lil-fahmi.", "id": "Ujian bukan satu-satunya ukuran pemahaman.", "t": 6, "em": "📝"}, {"n": "2353", "ar": "يُسَاعِدُنَا الذَّكَاءُ الِاصْطِنَاعِيُّ فِي إِنْجَازِ الْأَعْمَالِ الرُّوتِينِيَّةِ بِسُرْعَةٍ.", "tr": "Yusāʿidunā adh-dhakāʾu al-iṣṭināʿiyyu fī injāzi al-aʿmāli ar-rūtīniyyati bi-surʿatin.", "id": "Kecerdasan buatan membantu kita menyelesaikan pekerjaan rutin dengan cepat.", "t": 7, "em": "🤖"}, {"n": "2354", "ar": "لَا يَجُوزُ أَنْ نَثِقَ بِإِجَابَةِ الْآلَةِ دُونَ مُرَاجَعَةٍ.", "tr": "Lā yajūzu an nathiqa bi-ijābati al-ālati dūna murājaʿatin.", "id": "Tidak boleh kita memercayai jawaban mesin tanpa memeriksanya.", "t": 7, "em": ""}, {"n": "2355", "ar": "تُثِيرُ الْبَيَانَاتُ الشَّخْصِيَّةُ تَسَاؤُلَاتٍ حَوْلَ الْأَمَانِ وَالْخُصُوصِيَّةِ.", "tr": "Tuthīru al-bayānātu ash-shakhṣiyyatu tasāʾulātin ḥawla al-amāni wal-khuṣūṣiyyati.", "id": "Data pribadi menimbulkan pertanyaan tentang keamanan dan privasi.", "t": 7, "em": "📊"}, {"n": "2356", "ar": "سَتُغَيِّرُ السَّيَّارَاتُ ذَاتِيَّةُ الْقِيَادَةِ شَكْلَ الْمُدُنِ.", "tr": "Satughayyiru as-sayyārātu dhātiyyatu al-qiyādati shakla al-mudūni.", "id": "Mobil swakemudi akan mengubah wajah kota-kota.", "t": 7, "em": "🚗🏙️"}, {"n": "2357", "ar": "الِاعْتِمَادُ الزَّائِدُ عَلَى التِّقْنِيَةِ يُضْعِفُ بَعْضَ مَهَارَاتِنَا.", "tr": "Al-iʿtimādu az-zāʾidu ʿalā at-tiqniyyati yuḍʿifu baʿḍa mahāratinā.", "id": "Ketergantungan berlebihan pada teknologi melemahkan sebagian keterampilan kita.", "t": 7, "em": ""}, {"n": "2358", "ar": "اسْتَخْدَمْتُ تَرْجَمَةً آلِيَّةً ثُمَّ رَاجَعْتُهَا بِنَفْسِي.", "tr": "Istakhdamtu tarjamatan āliyyatan thumma rājaʿtuhā bi-nafsī.", "id": "Saya memakai terjemahan mesin lalu memeriksanya sendiri.", "t": 7, "em": ""}, {"n": "2359", "ar": "يُمْكِنُ لِلتَّقْنِيَةِ أَنْ تُسَاعِدَ ذَوِي الِاحْتِيَاجَاتِ الْخَاصَّةِ.", "tr": "Yumkinu lit-tiqniyyati an tusāʿida dhawī al-iḥtiyājāti al-khāṣṣati.", "id": "Teknologi dapat membantu penyandang kebutuhan khusus.", "t": 7, "em": ""}, {"n": "2360", "ar": "مَنْ يَتَحَمَّلُ الْمَسْؤُولِيَّةَ إِذَا أَخْطَأَ النِّظَامُ الذَّكِيُّ؟", "tr": "Man yataḥammalu al-masʾūliyyata idhā akhṭaʾa an-niẓāmu adh-dhakiyyu?", "id": "Siapa yang bertanggung jawab jika sistem cerdas itu membuat kesalahan?", "t": 7, "em": ""}, {"n": "2361", "ar": "احْرِصْ عَلَى تَحْدِيثِ بَرَامِجِكَ لِتَسُدَّ الثَّغَرَاتِ الْأَمْنِيَّةَ.", "tr": "Iḥriṣ ʿalā taḥdīthi barāmijika li-tasudda ath-thaghrāti al-amniyyata.", "id": "Pastikan memperbarui perangkat lunakmu untuk menutup celah keamanan.", "t": 7, "em": ""}, {"n": "2362", "ar": "تَجْمَعُ الشَّرِكَاتُ بَيَانَاتِنَا لِتُقَدِّمَ لَنَا إِعْلَانَاتٍ مُنَاسِبَةً.", "tr": "Tajmaʿu ash-sharikātu bayānātinā li-tuqaddima lanā iʿlānātin munāsibatan.", "id": "Perusahaan mengumpulkan data kita untuk menampilkan iklan yang cocok.", "t": 7, "em": "📊📣"}, {"n": "2363", "ar": "أَدَّتِ الْأَتْمَتَةُ إِلَى فُقْدَانِ بَعْضِ الْوَظَائِفِ وَخَلْقِ وَظَائِفَ جَدِيدَةٍ.", "tr": "Addati al-atmatatu ilā fuqdāni baʿḍi al-waẓāʾifi wa khalqi waẓāʾifa jadīdatin.", "id": "Otomasi menyebabkan hilangnya sebagian pekerjaan dan menciptakan pekerjaan baru.", "t": 7, "em": "🔍"}, {"n": "2364", "ar": "أَعْتَمِدُ عَلَى التَّطْبِيقَاتِ لِتَنْظِيمِ وَقْتِي وَمَهَامِّي.", "tr": "Aʿtamidu ʿalā at-taṭbīqāti li-tanẓīmi waqtī wa mahāmmī.", "id": "Saya mengandalkan aplikasi untuk mengatur waktu dan tugas saya.", "t": 7, "em": ""}, {"n": "2365", "ar": "لَنْ تَسْتَطِيعَ الْآلَةُ أَنْ تَفْهَمَ الْمَشَاعِرَ كَمَا يَفْهَمُهَا الْإِنْسَانُ.", "tr": "Lan tastaṭīʿa al-ālatu an tafhama al-mashāʿira kamā yafhamuhā al-insānu.", "id": "Mesin tidak akan mampu memahami perasaan sebagaimana manusia memahaminya.", "t": 7, "em": ""}, {"n": "2366", "ar": "تَعَلَّمْتُ الْبَرْمَجَةَ لِأَنِّي أَرَدْتُ فَهْمَ كَيْفَ تَعْمَلُ التَّطْبِيقَاتِ.", "tr": "Taʿallamtu al-barmajata li-annī aradtu fahma kayfa taʿmalu at-taṭbīqātu.", "id": "Saya belajar pemrograman karena ingin tahu cara kerja aplikasi.", "t": 7, "em": "📚"}, {"n": "2367", "ar": "يَجِبُ عَلَيْنَا أَنْ نَسْتَخْدِمَ التَّقْنِيَةَ بِوَعْيٍ وَلَيْسَ بِإِدْمَانٍ.", "tr": "Yajibu ʿalaynā an nastakhdima at-tiqniyyata bi-waʿyin wa laysa bi-idmānin.", "id": "Kita harus menggunakan teknologi dengan sadar, bukan dengan kecanduan.", "t": 7, "em": ""}, {"n": "2368", "ar": "كَثِيرٌ مِنَ الْمَهَامِّ يُمْكِنُ أَتْمَتَتُهَا لَكِنَّ الْإِبْدَاعَ يَبْقَى لِلْإِنْسَانِ.", "tr": "Kathīrun mina al-mahāmmi yumkinu atmatatuhā lākinna al-ibdāʿa yabqā lil-insāni.", "id": "Banyak tugas bisa diotomatisasi tetapi kreativitas tetap milik manusia.", "t": 7, "em": ""}, {"n": "2369", "ar": "يُحْفَظُ الْكَثِيرُ مِنَ الْمَعْلُومَاتِ فِي السَّحَابَةِ الْإِلِكْتُرُونِيَّةِ.", "tr": "Yuḥfaẓu al-kathīru mina al-maʿlūmāti fī as-saḥābati al-iliktrūniyyati.", "id": "Banyak informasi disimpan di penyimpanan awan.", "t": 7, "em": "☁️"}, {"n": "2370", "ar": "ارْتَفَعَ التَّضَخُّمُ هَذَا الْعَامَ مِمَّا أَثَّرَ فِي الْقُدْرَةِ الشِّرَائِيَّةِ.", "tr": "Irtafaʿa at-taḍakhkhumu hādhā al-ʿāma mimmā aththara fī al-qudrati ash-shirāʾiyyati.", "id": "Inflasi naik tahun ini sehingga memengaruhi daya beli.", "t": 8, "em": "🛍️"}, {"n": "2371", "ar": "يَقْتَرِضُ كَثِيرٌ مِنَ النَّاسِ لِشِرَاءِ بُيُوتٍ ثُمَّ يَجِدُونَ الْأَقْسَاطَ ثَقِيلَةً.", "tr": "Yaqtariḍu kathīrun mina an-nāsi li-shirāʾi buyūtin thumma yajidūna al-aqsāṭa thaqīlatan.", "id": "Banyak orang berutang untuk membeli rumah lalu mendapati cicilannya berat.", "t": 8, "em": "🛍️🏠"}, {"n": "2372", "ar": "تَعْتَمِدُ الْأَسْوَاقُ عَلَى الثِّقَةِ بَيْنَ الْبَائِعِ وَالْمُشْتَرِي.", "tr": "Taʿtamidu al-aswāqu ʿalā ath-thiqati bayna al-bāʾiʿi wal-mushtarī.", "id": "Pasar bergantung pada kepercayaan antara penjual dan pembeli.", "t": 8, "em": "🛒"}, {"n": "2373", "ar": "قَرَّرَتِ الْحُكُومَةُ دَعْمَ الْمَشَارِيعِ الصَّغِيرَةِ لِخَلْقِ فُرَصِ عَمَلٍ.", "tr": "Qarrarat al-ḥukūmatu daʿma al-mashārīʿi aṣ-ṣaghīrati li-khalqi furaṣi ʿamalin.", "id": "Pemerintah memutuskan mendukung usaha kecil untuk menciptakan lapangan kerja.", "t": 8, "em": "🏟️"}, {"n": "2374", "ar": "لَا أُفَضِّلُ الِاسْتِثْمَارَ فِي شَيْءٍ لَا أَفْهَمُهُ جَيِّدًا.", "tr": "Lā ufaḍḍilu al-istithmāra fī shayʾin lā afhamuhu jayyidan.", "id": "Saya tidak suka berinvestasi pada sesuatu yang tidak saya pahami dengan baik.", "t": 8, "em": ""}, {"n": "2375", "ar": "انْخَفَضَتْ أَسْعَارُ النِّفْطِ، فَتَأَثَّرَتْ مِيزَانِيَّاتُ الدُّوَلِ الْمُصَدِّرَةِ.", "tr": "Inkhafaḍat asʿāru an-nifṭi, fa-taʾaththarat mīzāniyyātu ad-duwali al-muṣaddirati.", "id": "Harga minyak turun, sehingga anggaran negara pengekspor terpengaruh.", "t": 8, "em": "🏷️"}, {"n": "2376", "ar": "التَّنَوُّعُ فِي الِاقْتِصَادِ يَحْمِي الْبَلَدَ مِنَ الْأَزَمَاتِ.", "tr": "At-tanawwuʿu fī al-iqtiṣādi yaḥmī al-balada mina al-azamāti.", "id": "Keragaman ekonomi melindungi negara dari krisis.", "t": 8, "em": "📊"}, {"n": "2377", "ar": "يَدْفَعُ الْمُسْتَهْلِكُ فِي النِّهَايَةِ ثَمَنَ ارْتِفَاعِ التَّكَالِيفِ.", "tr": "Yadfaʿu al-mustahliku fī an-nihāyati thamana irtifāʿi at-takālīfi.", "id": "Pada akhirnya konsumenlah yang membayar kenaikan biaya.", "t": 8, "em": "💳"}, {"n": "2378", "ar": "يُعَدُّ التَّعْلِيمُ أَفْضَلَ اسْتِثْمَارٍ طَوِيلِ الْأَمَدِ.", "tr": "Yuʿaddu at-taʿlīmu afḍala istithmārin ṭawīli al-amadi.", "id": "Pendidikan dianggap sebagai investasi jangka panjang terbaik.", "t": 8, "em": "📈"}, {"n": "2379", "ar": "هَلْ تَعْتَقِدُ أَنَّ الْعُمْلَةَ الرَّقْمِيَّةَ سَتَحُلُّ مَحَلَّ النَّقْدِ؟", "tr": "Hal taʿtaqidu anna al-ʿumlata ar-raqmiyyata sataḥullu maḥalla an-naqdi?", "id": "Apakah kamu kira mata uang digital akan menggantikan uang tunai?", "t": 8, "em": "👁️💵"}, {"n": "2380", "ar": "تَرْتَفِعُ الْأَسْعَارُ عِنْدَمَا يَزِيدُ الطَّلَبُ عَلَى الْعَرْضِ.", "tr": "Tartafiʿu al-asʿāru ʿindamā yazīdu aṭ-ṭalabu ʿalā al-ʿarḍi.", "id": "Harga naik ketika permintaan melebihi penawaran.", "t": 8, "em": "🏷️"}, {"n": "2381", "ar": "أَنَا أُفَضِّلُ دَعْمَ الْمُنْتَجَاتِ الْمَحَلِّيَّةِ حَتَّى لَوْ كَانَتْ أَغْلَى.", "tr": "Anā ufaḍḍilu daʿma al-muntajāti al-maḥalliyyati ḥattā law kānat aghlā.", "id": "Saya lebih suka mendukung produk lokal meskipun lebih mahal.", "t": 8, "em": "💸"}, {"n": "2382", "ar": "لَا أَحَدَ يَعْرِفُ بِدِقَّةٍ مَا سَيَحْدُثُ لِلْأَسْوَاقِ الْعَامَ الْقَادِمَ.", "tr": "Lā aḥada yaʿrifu bi-diqqatin mā sayaḥduthu lil-aswāqi al-ʿāma al-qādima.", "id": "Tidak ada yang tahu persis apa yang akan terjadi pada pasar tahun depan.", "t": 8, "em": "🛒"}, {"n": "2383", "ar": "رَبِحَتِ الشَّرِكَةُ هَذَا الْعَامَ بِفَضْلِ التَّوَسُّعِ فِي الْأَسْوَاقِ الْخَارِجِيَّةِ.", "tr": "Rabiḥati ash-sharikatu hādhā al-ʿāma bi-faḍli at-tawassuʿi fī al-aswāqi al-khārijiyyati.", "id": "Perusahaan itu untung tahun ini berkat ekspansi ke pasar luar negeri.", "t": 8, "em": "🛒"}, {"n": "2384", "ar": "يُعَانِي الْمُزَارِعُونَ مِنْ تَقَلُّبِ الْأَسْعَارِ بَيْنَ مَوْسِمٍ وَآخَرَ.", "tr": "Yuʿānī al-muzāriʿūna min taqallubi al-asʿāri bayna mawsimin wa ākhara.", "id": "Para petani menderita akibat naik-turunnya harga dari musim ke musim.", "t": 8, "em": "🏷️"}, {"n": "2385", "ar": "مِنَ الصَّعْبِ أَنْ تَبْنِيَ تِجَارَةً دُونَ رَأْسِ مَالٍ كَافٍ.", "tr": "Mina aṣ-ṣaʿbi an tabniya tijāratan dūna raʾsi mālin kāfin.", "id": "Sulit membangun usaha tanpa modal yang cukup.", "t": 8, "em": ""}, {"n": "2386", "ar": "تَعْمَلُ الْعَوْلَمَةُ عَلَى رَبْطِ الْأَسْوَاقِ، لَكِنَّهَا تَزِيدُ الْمُنَافَسَةَ.", "tr": "Taʿmalu al-ʿawlamatu ʿalā rabṭi al-aswāqi, lākinnahā tazīdu al-munāfasata.", "id": "Globalisasi menghubungkan pasar, tetapi menambah persaingan.", "t": 8, "em": "🛒"}, {"n": "2387", "ar": "يُنْصَحُ بِتَحْدِيدِ مِيزَانِيَّةٍ شَهْرِيَّةٍ وَالِالْتِزَامِ بِهَا.", "tr": "Yunṣaḥu bi-taḥdīdi mīzāniyyatin shahriyyatin wal-iltizāmi bihā.", "id": "Dianjurkan menetapkan anggaran bulanan dan menaatinya.", "t": 8, "em": ""}, {"n": "2388", "ar": "الْوِقَايَةُ مِنَ الْأَمْرَاضِ تَبْدَأُ مِنَ الْغِذَاءِ وَالنَّوْمِ وَالْحَرَكَةِ.", "tr": "Al-wiqāyatu mina al-amrāḍi tabdaʾu mina al-ghidhāʾi wan-nawmi wal-ḥarakati.", "id": "Pencegahan penyakit dimulai dari makanan, tidur, dan gerak.", "t": 9, "em": "🍽️😴"}, {"n": "2389", "ar": "يَجِبُ عَلَى الْجَمِيعِ تَلَقِّي اللَّقَاحَاتِ فِي مَوَاعِيدِهَا.", "tr": "Yajibu ʿalā al-jamīʿi talaqqī al-laqāḥāti fī mawāʿīdihā.", "id": "Semua orang wajib menerima vaksin sesuai jadwalnya.", "t": 9, "em": "💉"}, {"n": "2390", "ar": "قِلَّةُ النَّوْمِ تُضْعِفُ التَّرْكِيزَ وَالْمَنَاعَةَ مَعًا.", "tr": "Qillatu an-nawmi tuḍʿifu at-tarkīza wal-manāʿata maʿan.", "id": "Kurang tidur melemahkan konsentrasi dan kekebalan tubuh sekaligus.", "t": 9, "em": "😴"}, {"n": "2391", "ar": "يُوصِي الْأَطِبَّاءُ بِتَقْلِيلِ السُّكَّرِ وَالْمِلْحِ فِي الطَّعَامِ.", "tr": "Yūṣī al-aṭibbāʾu bi-taqlīli as-sukkari wal-milḥi fī aṭ-ṭaʿāmi.", "id": "Para dokter menganjurkan mengurangi gula dan garam dalam makanan.", "t": 9, "em": "🧑‍⚕️🍬"}, {"n": "2392", "ar": "الْفَحْصُ الدَّوْرِيُّ يَكْشِفُ الْأَمْرَاضَ قَبْلَ أَنْ تَتَفَاقَمَ.", "tr": "Al-faḥṣu ad-dawriyyu yakshifu al-amrāḍa qabla an tatafāqama.", "id": "Pemeriksaan berkala mendeteksi penyakit sebelum bertambah parah.", "t": 9, "em": ""}, {"n": "2393", "ar": "الضَّغْطُ النَّفْسِيُّ الْمُسْتَمِرُّ قَدْ يُسَبِّبُ أَمْرَاضًا جَسَدِيَّةً.", "tr": "Aḍ-ḍaghṭu an-nafsiyyu al-mustamirru qad yusabbibu amrāḍan jasadiyyatan.", "id": "Stres yang terus-menerus bisa menyebabkan penyakit fisik.", "t": 9, "em": ""}, {"n": "2394", "ar": "رَغْمَ أَنَّهُ يَعْلَمُ ضَرَرَ التَّدْخِينِ، لَمْ يَسْتَطِعْ أَنْ يُقْلِعَ عَنْهُ.", "tr": "Raghma annahu yaʿlamu ḍarara at-tadkhīni, lam yastaṭiʿ an yuqliʿa ʿanhu.", "id": "Meskipun ia tahu bahaya merokok, ia belum mampu berhenti.", "t": 9, "em": ""}, {"n": "2395", "ar": "اغْسِلْ يَدَيْكَ جَيِّدًا قَبْلَ تَنَاوُلِ الطَّعَامِ وَبَعْدَ الْعَوْدَةِ مِنَ الْخَارِجِ.", "tr": "Ighsil yadayka jayyidan qabla tanāwuli aṭ-ṭaʿāmi wa baʿda al-ʿawdati mina al-khāriji.", "id": "Cucilah tanganmu dengan baik sebelum makan dan setelah pulang dari luar.", "t": 9, "em": "✋🍽️"}, {"n": "2396", "ar": "يَحْتَاجُ الْجِسْمُ إِلَى مَاءٍ كَافٍ خُصُوصًا فِي الطَّقْسِ الْحَارِّ.", "tr": "Yaḥtāju al-jismu ilā māʾin kāfin khuṣūṣan fī aṭ-ṭaqsi al-ḥārri.", "id": "Tubuh membutuhkan air yang cukup terutama di cuaca panas.", "t": 9, "em": "💧☀️"}, {"n": "2397", "ar": "عَلَيْنَا أَنْ نَهْتَمَّ بِالصِّحَّةِ النَّفْسِيَّةِ كَاهْتِمَامِنَا بِالصِّحَّةِ الْجَسَدِيَّةِ.", "tr": "ʿAlaynā an nahtamma bis-ṣiḥḥati an-nafsiyyati ka-ihtimāminā bis-ṣiḥḥati al-jasadiyyati.", "id": "Kita harus memperhatikan kesehatan mental seperti halnya kesehatan fisik.", "t": 9, "em": ""}, {"n": "2398", "ar": "يُفَضَّلُ أَنْ نَتَنَاوَلَ الْغَدَاءَ الرَّئِيسِيَّ قَبْلَ الْعَصْرِ.", "tr": "Yufaḍḍalu an natanāwala al-ghadāʾa ar-raʾīsiyya qabla al-ʿaṣri.", "id": "Sebaiknya kita makan siang utama sebelum waktu asar.", "t": 9, "em": "🍱"}, {"n": "2399", "ar": "ارْتَفَعَتْ نِسْبَةُ السِّمْنَةِ بَيْنَ الْأَطْفَالِ بِسَبَبِ قِلَّةِ الْحَرَكَةِ.", "tr": "Irtafaʿat nisbatu as-sumnati bayna al-aṭfāli bi-sababi qillati al-ḥarakati.", "id": "Angka obesitas di kalangan anak meningkat karena kurang gerak.", "t": 9, "em": "🧒"}, {"n": "2400", "ar": "الْمَشْيُ نِصْفُ سَاعَةٍ يَوْمِيًّا يُحَسِّنُ الْقَلْبَ وَالْمِزَاجَ.", "tr": "Al-mashyu niṣfa sāʿatin yawmiyyan yuḥassinu al-qalba wal-mizāja.", "id": "Berjalan setengah jam setiap hari memperbaiki jantung dan suasana hati.", "t": 9, "em": "⏰❤️"}, {"n": "2401", "ar": "لَا تَتَنَاوَلْ دَوَاءً بِدُونِ اسْتِشَارَةِ الطَّبِيبِ.", "tr": "Lā tatanāwal dawāʾan bi-dūni istishārati aṭ-ṭabībi.", "id": "Jangan minum obat tanpa berkonsultasi dengan dokter.", "t": 9, "em": "🥤💊"}, {"n": "2402", "ar": "صِحَّتُنَا هِيَ أَثْمَنُ مَا نَمْلِكُ، وَلَا نَعْرِفُ قِيمَتَهَا إِلَّا إِذَا فَقَدْنَاهَا.", "tr": "Ṣiḥḥatunā hiya athmanu mā namliku, wa lā naʿrifu qīmatahā illā idhā faqadnāhā.", "id": "Kesehatan adalah milik kita yang paling berharga, dan kita baru tahu nilainya ketika kehilangannya.", "t": 9, "em": ""}, {"n": "2403", "ar": "يُنْصَحُ بِتَنَاوُلِ الْخُضَارِ وَالْفَوَاكِهِ يَوْمِيًّا.", "tr": "Yunṣaḥu bi-tanāwuli al-khuḍāri wal-fawākihi yawmiyyan.", "id": "Dianjurkan makan sayur dan buah setiap hari.", "t": 9, "em": "🍽️🥦"}, {"n": "2404", "ar": "يَزُورُ الْمَرِيضَ أَهْلُهُ وَيُشْعِرُونَهُ بِالدَّعْمِ.", "tr": "Yazūru al-marīḍa ahluhu wa yushʿirūnahu bid-daʿmi.", "id": "Keluarga mengunjungi si sakit dan membuatnya merasa didukung.", "t": 9, "em": "👨‍👩‍👧🤒"}, {"n": "2405", "ar": "تَحْتَاجُ الْحَوَامِلُ إِلَى مُتَابَعَةٍ طِبِّيَّةٍ مُنْتَظِمَةٍ.", "tr": "Taḥtāju al-ḥawāmilu ilā mutābaʿatin ṭibbiyyatin muntaẓimatin.", "id": "Ibu hamil membutuhkan pemantauan medis secara teratur.", "t": 9, "em": "👩"}, {"n": "2406", "ar": "انْتَقَلْتُ إِلَى بَلَدٍ جَدِيدٍ وَاحْتَجْتُ وَقْتًا لِأَتَأَقْلَمَ مَعَ نَمَطِ الْحَيَاةِ.", "tr": "Intaqaltu ilā baladin jadīdin wa iḥtajtu waqtan li-ataʾaqlama maʿa namaṭi al-ḥayāti.", "id": "Saya pindah ke negara baru dan butuh waktu untuk menyesuaikan diri dengan pola hidup.", "t": 10, "em": ""}, {"n": "2407", "ar": "الْحَنِينُ إِلَى الْوَطَنِ يَزْدَادُ فِي الْأَعْيَادِ.", "tr": "Al-ḥanīnu ilā al-waṭani yazdādu fī al-aʿyādi.", "id": "Rindu kepada tanah air bertambah di hari-hari raya.", "t": 10, "em": "🥺💧"}, {"n": "2408", "ar": "أُحَافِظُ عَلَى لُغَتِي وَثَقَافَتِي حَتَّى فِي الْغُرْبَةِ.", "tr": "Uḥāfiẓu ʿalā lughatī wa thaqāfatī ḥattā fī al-ghurbati.", "id": "Saya menjaga bahasa dan budaya saya bahkan di perantauan.", "t": 10, "em": "🗣️"}, {"n": "2409", "ar": "الِانْدِمَاجُ فِي الْمُجْتَمَعِ الْجَدِيدِ لَا يَعْنِي نِسْيَانَ الْأَصْلِ.", "tr": "Al-indimāju fī al-mujtamaʿi al-jadīdi lā yaʿnī nisyāna al-aṣli.", "id": "Berbaur dengan masyarakat baru tidak berarti melupakan asal.", "t": 10, "em": ""}, {"n": "2410", "ar": "وَاجَهْتُ صُعُوبَةً فِي إِيجَادِ عَمَلٍ لِأَنَّ شَهَادَتِي لَمْ تُعْتَمَدْ.", "tr": "Wājahtu ṣuʿūbatan fī ījādi ʿamalin li-anna shahādatī lam tuʿtamad.", "id": "Saya kesulitan mendapat pekerjaan karena ijazah saya belum diakui.", "t": 10, "em": ""}, {"n": "2411", "ar": "أَشْعُرُ أَنَّ لِي وَطَنَيْنِ: الْأَوَّلُ وُلِدْتُ فِيهِ وَالثَّانِي اخْتَرْتُهُ.", "tr": "Ashʿuru anna lī waṭanayni: al-awwalu wulidtu fīhi wath-thānī ikhtartuhu.", "id": "Saya merasa punya dua tanah air: yang pertama tempat saya lahir dan yang kedua saya pilih.", "t": 10, "em": "💧"}, {"n": "2412", "ar": "يَسْهُلُ تَكْوِينُ الصَّدَاقَاتِ عِنْدَمَا نَتَعَلَّمُ لُغَةَ الْبَلَدِ.", "tr": "Yashulu takwīnu aṣ-ṣadāqāti ʿindamā nataʿallamu lughata al-baladi.", "id": "Menjalin persahabatan menjadi mudah saat kita belajar bahasa negeri itu.", "t": 10, "em": "📚🗣️"}, {"n": "2413", "ar": "لَقِيتُ تَرْحِيبًا كَبِيرًا مِنْ جِيرَانِي الْجُدُدِ.", "tr": "Laqītu tarḥīban kabīran min jīrānī al-judidi.", "id": "Saya disambut hangat oleh tetangga-tetangga baru saya.", "t": 10, "em": "🏘️"}, {"n": "2414", "ar": "يَجِبُ عَلَى الْمُجْتَمَعَاتِ أَنْ تَحْتَرِمَ التَّنَوُّعَ الثَّقَافِيَّ.", "tr": "Yajibu ʿalā al-mujtamaʿāti an taḥtarima at-tanawwuʿa ath-thaqāfiyya.", "id": "Masyarakat harus menghormati keragaman budaya.", "t": 10, "em": ""}, {"n": "2415", "ar": "يَزُورُنِي أَهْلِي كُلَّ صَيْفٍ وَنُسَافِرُ مَعًا.", "tr": "Yazūrunī ahlī kulla ṣayfin wa nusāfiru maʿan.", "id": "Keluarga saya mengunjungi saya setiap musim panas dan kami bepergian bersama.", "t": 10, "em": "👨‍👩‍👧☀️"}, {"n": "2416", "ar": "لَا أُرِيدُ أَنْ أَفْقِدَ جُذُورِي مَهْمَا ابْتَعَدْتُ.", "tr": "Lā urīdu an afqida judhūrī mahmā ibtaʿadtu.", "id": "Saya tidak ingin kehilangan akar saya sejauh apa pun saya pergi.", "t": 10, "em": ""}, {"n": "2417", "ar": "يَتَعَلَّمُ أَبْنَاؤُنَا لُغَتَيْنِ، وَهَذَا مَكْسَبٌ كَبِيرٌ لَهُمْ.", "tr": "Yataʿallamu abnāʾunā lughatayni, wa hādhā maksabun kabīrun lahum.", "id": "Anak-anak kami belajar dua bahasa, dan itu keuntungan besar bagi mereka.", "t": 10, "em": "🧒📚"}, {"n": "2418", "ar": "أَحْيَانًا أُحِسُّ بِأَنِّي غَرِيبٌ فِي الْمَكَانَيْنِ.", "tr": "Aḥyānan uḥissu bi-annī gharībun fī al-makānayni.", "id": "Kadang saya merasa asing di kedua tempat.", "t": 10, "em": ""}, {"n": "2419", "ar": "انْضَمَمْتُ إِلَى جَمْعِيَّةٍ لِلْمُغْتَرِبِينَ مِنْ بَلَدِي.", "tr": "Inḍamamtu ilā jamʿiyyatin lil-mughtaribīna min baladī.", "id": "Saya bergabung dengan perkumpulan perantau dari negara saya.", "t": 10, "em": ""}, {"n": "2420", "ar": "أَشْعُرُ بِالْفَخْرِ لِأَنِّي أُمَثِّلُ بَلَدِي فِي الْخَارِجِ.", "tr": "Ashʿuru bil-fakhri li-annī umaththilu baladī fī al-khāriji.", "id": "Saya merasa bangga karena mewakili negara saya di luar negeri.", "t": 10, "em": "🥹"}, {"n": "2421", "ar": "عِنْدَمَا عُدْتُ إِلَى الْوَطَنِ بَعْدَ سَنَوَاتٍ وَجَدْتُ كُلَّ شَيْءٍ قَدْ تَغَيَّرَ.", "tr": "ʿIndamā ʿudtu ilā al-waṭani baʿda sanawātin wajadtu kulla shayʾin qad taghayyara.", "id": "Ketika saya pulang ke tanah air setelah bertahun-tahun, saya mendapati segalanya telah berubah.", "t": 10, "em": "💧"}, {"n": "2422", "ar": "الْغُرْبَةُ تُعَلِّمُ الْإِنْسَانَ الِاعْتِمَادَ عَلَى نَفْسِهِ.", "tr": "Al-ghurbatu tuʿallimu al-insāna al-iʿtimāda ʿalā nafsihi.", "id": "Hidup di perantauan mengajari manusia mengandalkan dirinya sendiri.", "t": 10, "em": ""}, {"n": "2423", "ar": "اللُّغَةُ لَيْسَتْ مُجَرَّدَ كَلِمَاتٍ، بَلْ هِيَ طَرِيقَةٌ فِي التَّفْكِيرِ.", "tr": "Al-lughatu laysat mujarrada kalimātin, bal hiya ṭarīqatun fī at-tafkīri.", "id": "Bahasa bukan sekadar kata-kata, tetapi cara berpikir.", "t": 11, "em": "🗣️"}, {"n": "2424", "ar": "لَا تُوجَدُ دَائِمًا كَلِمَةٌ مُطَابِقَةٌ تَمَامًا فِي لُغَتَيْنِ مُخْتَلِفَتَيْنِ.", "tr": "Lā tūjadu dāʾiman kalimatun muṭābiqatun tamāman fī lughatayni mukhtalifatayni.", "id": "Tidak selalu ada kata yang persis sama di dua bahasa yang berbeda.", "t": 11, "em": "🗣️"}, {"n": "2425", "ar": "تُرْجِمَ الْكِتَابُ إِلَى أَكْثَرَ مِنْ عِشْرِينَ لُغَةً.", "tr": "Turjima al-kitābu ilā akthara min ʿishrīna lughatan.", "id": "Buku itu telah diterjemahkan ke lebih dari dua puluh bahasa.", "t": 11, "em": "📖🗣️"}, {"n": "2426", "ar": "أَسْتَطِيعُ فَهْمَ الْكَلَامِ لَكِنِّي أُوَاجِهُ صُعُوبَةً فِي الْكِتَابَةِ.", "tr": "Astaṭīʿu fahma al-kalāmi lākinnī uwājihu ṣuʿūbatan fī al-kitābati.", "id": "Saya bisa memahami percakapan tetapi kesulitan dalam menulis.", "t": 11, "em": "✍️"}, {"n": "2427", "ar": "يَخْتَلِفُ نُطْقُ الْكَلِمَةِ الْوَاحِدَةِ مِنْ لَهْجَةٍ إِلَى أُخْرَى.", "tr": "Yakhtalifu nuṭqu al-kalimati al-wāḥidati min lahjatin ilā ukhrā.", "id": "Pelafalan satu kata berbeda dari satu dialek ke dialek lain.", "t": 11, "em": ""}, {"n": "2428", "ar": "مِنَ الْأَفْضَلِ أَنْ نَتَعَلَّمَ الْعِبَارَاتِ كَامِلَةً وَلَيْسَ كَلِمَاتٍ مُنْفَرِدَةً.", "tr": "Mina al-afḍali an nataʿallama al-ʿibārāti kāmilatan wa laysa kalimātin munfaridatan.", "id": "Sebaiknya kita belajar ungkapan secara utuh, bukan kata-kata terpisah.", "t": 11, "em": "📚"}, {"n": "2429", "ar": "تَعَلُّمُ لُغَةٍ جَدِيدَةٍ يَفْتَحُ أَبْوَابًا لَا نَتَوَقَّعُهَا.", "tr": "Taʿallumu lughatin jadīdatin yaftaḥu abwāban lā natawaqqaʿuhā.", "id": "Belajar bahasa baru membuka pintu-pintu yang tidak kita duga.", "t": 11, "em": "📚🗣️"}, {"n": "2430", "ar": "أَخْطَأْتُ فِي الْإِعْرَابِ لَكِنَّهُمْ فَهِمُوا قَصْدِي.", "tr": "Akhṭaʾtu fī al-iʿrābi lākinnahum fahimū qaṣdī.", "id": "Saya salah dalam tata bahasa i'rab, tetapi mereka memahami maksud saya.", "t": 11, "em": "🗣️"}, {"n": "2431", "ar": "يُحَدِّثُنِي مُعَلِّمِي بِبُطْءٍ وَوُضُوحٍ لِأَفْهَمَ.", "tr": "Yuḥaddithunī muʿallimī bi-buṭʾin wa wuḍūḥin li-afhama.", "id": "Guru saya berbicara kepada saya pelan dan jelas supaya saya paham.", "t": 11, "em": "👨‍🏫"}, {"n": "2432", "ar": "هَلْ تَقْصِدُ الْمَعْنَى الْحَرْفِيَّ أَمِ الْمَعْنَى الْمَجَازِيَّ؟", "tr": "Hal taqṣidu al-maʿnā al-ḥarfiyya ami al-maʿnā al-majāziyya?", "id": "Apakah kamu maksud arti harfiah atau arti kiasan?", "t": 11, "em": ""}, {"n": "2433", "ar": "لِلْمُتَرْجِمِ دَوْرٌ مُهِمٌّ فِي نَقْلِ الثَّقَافَاتِ لَا اللُّغَاتِ فَقَطْ.", "tr": "Lil-mutarjimi dawrun muhimmun fī naqli ath-thaqāfāti lā al-lughāti faqaṭ.", "id": "Penerjemah punya peran penting dalam memindahkan budaya, bukan hanya bahasa.", "t": 11, "em": "🗣️"}, {"n": "2434", "ar": "يُمْكِنُكَ أَنْ تُعَبِّرَ عَنْ نَفْسِكَ بِطُرُقٍ مُخْتَلِفَةٍ إِذَا عَرَفْتَ مُرَادِفَاتٍ كَثِيرَةً.", "tr": "Yumkinuka an tuʿabbira ʿan nafsika bi-ṭuruqin mukhtalifatin idhā ʿarafta murādifātin kathīratan.", "id": "Kamu bisa mengekspresikan diri dengan cara berbeda jika tahu banyak sinonim.", "t": 11, "em": ""}, {"n": "2435", "ar": "لَمْ أَفْهَمِ الْمَثَلَ لِأَنَّ تَرْجَمَتَهُ الْحَرْفِيَّةَ لَا مَعْنَى لَهَا.", "tr": "Lam afhami al-mathala li-anna tarjamatahu al-ḥarfiyyata lā maʿnā lahā.", "id": "Saya tidak paham peribahasa itu karena terjemahan harfiahnya tidak bermakna.", "t": 11, "em": ""}, {"n": "2436", "ar": "الْحُرُوفُ الْعَرَبِيَّةُ تَتَغَيَّرُ أَشْكَالُهَا بِحَسَبِ مَوْضِعِهَا فِي الْكَلِمَةِ.", "tr": "Al-ḥurūfu al-ʿarabiyyatu tataghayyaru ashkāluhā bi-ḥasabi mawḍiʿihā fī al-kalimati.", "id": "Bentuk huruf Arab berubah sesuai posisinya dalam kata.", "t": 11, "em": ""}, {"n": "2437", "ar": "كُلَّمَا مَارَسْتُ الْكَلَامَ أَكْثَرَ زَادَتْ ثِقَتِي بِنَفْسِي.", "tr": "Kullamā mārastu al-kalāma akthara zādat thiqatī bi-nafsī.", "id": "Semakin banyak saya berlatih berbicara, semakin percaya diri saya.", "t": 11, "em": ""}, {"n": "2438", "ar": "سَأُتْقِنُ الْعَرَبِيَّةَ بِإِذْنِ اللَّهِ إِذَا وَاصَلْتُ التَّدْرِيبَ.", "tr": "Saʾutqinu al-ʿarabiyyata bi-idhni Allāhi idhā wāṣaltu at-tadrība.", "id": "Saya akan menguasai bahasa Arab, insya Allah, jika terus berlatih.", "t": 11, "em": "🗣️"}, {"n": "2439", "ar": "تَرْجَمَةُ الشِّعْرِ أَصْعَبُ مِنْ تَرْجَمَةِ النَّثْرِ لِأَنَّ الْإِيقَاعَ يَضِيعُ.", "tr": "Tarjamatu ash-shiʿri aṣʿabu min tarjamati an-nathri li-anna al-īqāʿa yaḍīʿu.", "id": "Menerjemahkan puisi lebih sulit daripada prosa karena iramanya hilang.", "t": 11, "em": "🔍"}, {"n": "2440", "ar": "يَنُصُّ الدُّسْتُورُ عَلَى أَنَّ الْمُوَاطِنِينَ مُتَسَاوُونَ أَمَامَ الْقَانُونِ.", "tr": "Yanuṣṣu ad-dustūru ʿalā anna al-muwāṭinīna mutasāwūna amāma al-qānūni.", "id": "Konstitusi menyatakan bahwa warga negara setara di hadapan hukum.", "t": 12, "em": "⚖️"}, {"n": "2441", "ar": "لِكُلِّ مُتَّهَمٍ الْحَقُّ فِي مُحَامٍ يُدَافِعُ عَنْهُ.", "tr": "Li-kulli muttahamin al-ḥaqqu fī muḥāmin yudāfiʿu ʿanhu.", "id": "Setiap terdakwa berhak mendapat pengacara yang membelanya.", "t": 12, "em": ""}, {"n": "2442", "ar": "رَفَعَ الْعُمَّالُ دَعْوَى ضِدَّ الشَّرِكَةِ بِسَبَبِ تَأَخُّرِ الْأُجُورِ.", "tr": "Rafaʿa al-ʿummālu daʿwā ḍidda ash-sharikati bi-sababi taʾakhkhuri al-ujūri.", "id": "Para pekerja mengajukan gugatan terhadap perusahaan karena keterlambatan gaji.", "t": 12, "em": "💰"}, {"n": "2443", "ar": "لَا يُعْفِي جَهْلُ الْقَانُونِ أَحَدًا مِنَ الْمَسْؤُولِيَّةِ.", "tr": "Lā yuʿfī jahlu al-qānūni aḥadan mina al-masʾūliyyati.", "id": "Ketidaktahuan akan hukum tidak membebaskan siapa pun dari tanggung jawab.", "t": 12, "em": "⚖️"}, {"n": "2444", "ar": "تَحْمِي قَوَانِينُ الْعَمَلِ حُقُوقَ الْعَامِلِينَ مِنَ التَّعَسُّفِ.", "tr": "Taḥmī qawānīnu al-ʿamali ḥuqūqa al-ʿāmilīna mina at-taʿassufi.", "id": "Undang-undang ketenagakerjaan melindungi hak pekerja dari kesewenang-wenangan.", "t": 12, "em": ""}, {"n": "2445", "ar": "قَدَّمْتُ شَكْوَى رَسْمِيَّةً وَأَنْتَظِرُ الرَّدَّ.", "tr": "Qaddamtu shakwā rasmiyyatan wa antaẓiru ar-radda.", "id": "Saya mengajukan pengaduan resmi dan menunggu jawaban.", "t": 12, "em": ""}, {"n": "2446", "ar": "يَجِبُ أَنْ يَكُونَ الْقَاضِي مُحَايِدًا وَلَا يَتَأَثَّرَ بِالضُّغُوطِ.", "tr": "Yajibu an yakūna al-qāḍī muḥāyidan wa lā yataʾaththara biḍ-ḍughūṭi.", "id": "Hakim harus netral dan tidak terpengaruh tekanan.", "t": 12, "em": ""}, {"n": "2447", "ar": "مِنْ حَقِّ الْمُسْتَهْلِكِ أَنْ يَسْتَرِدَّ ثَمَنَ السِّلْعَةِ الْمَعِيبَةِ.", "tr": "Min ḥaqqi al-mustahliki an yastaridda thamana as-silʿati al-maʿībati.", "id": "Konsumen berhak mengembalikan harga barang yang cacat.", "t": 12, "em": "🏷️"}, {"n": "2448", "ar": "اخْتَلَفَ الْجَارَانِ عَلَى حُدُودِ الْأَرْضِ فَلَجَأَا إِلَى الْمَحْكَمَةِ.", "tr": "Ikhtalafa al-jārāni ʿalā ḥudūdi al-arḍi falajaʾā ilā al-maḥkamati.", "id": "Dua tetangga berselisih soal batas tanah lalu mengadu ke pengadilan.", "t": 12, "em": "🏘️⚖️"}, {"n": "2449", "ar": "حُرِّيَّةُ التَّعْبِيرِ حَقٌّ، لَكِنَّهَا لَا تَعْنِي الْإِسَاءَةَ لِلْآخَرِينَ.", "tr": "Ḥurriyyatu at-taʿbīri ḥaqqun, lākinnahā lā taʿnī al-isāʾata lil-ākharīna.", "id": "Kebebasan berpendapat adalah hak, tetapi bukan berarti menghina orang lain.", "t": 12, "em": ""}, {"n": "2450", "ar": "يُعَاقَبُ كُلُّ مَنْ يُخَالِفُ الْأَنْظِمَةَ الْمَرُورِيَّةِ بِغَرَامَةٍ.", "tr": "Yuʿāqabu kullu man yukhālifu al-anẓimata al-marūriyyata bi-gharāmatin.", "id": "Setiap pelanggar aturan lalu lintas dikenai denda.", "t": 12, "em": ""}, {"n": "2451", "ar": "مِنْ حَقِّكَ أَنْ تَعْرِفَ سَبَبَ الْقَرَارِ وَأَنْ تَعْتَرِضَ عَلَيْهِ.", "tr": "Min ḥaqqika an taʿrifa sababa al-qarāri wa an taʿtariḍa ʿalayhi.", "id": "Kamu berhak mengetahui alasan keputusan dan mengajukan keberatan.", "t": 12, "em": ""}, {"n": "2452", "ar": "لَا يُدَانُ الشَّخْصُ حَتَّى تَثْبُتَ إِدَانَتُهُ بِحُكْمٍ نِهَائِيٍّ.", "tr": "Lā yudānu ash-shakhṣu ḥattā tathbuta idānatuhu bi-ḥukmin nihāʾiyyin.", "id": "Seseorang tidak dinyatakan bersalah hingga terbukti dengan putusan final.", "t": 12, "em": ""}, {"n": "2453", "ar": "شَهِدَ الْجَمِيعُ بِأَنَّهُ كَانَ فِي الْمَكَانِ نَفْسِهِ وَقْتَ الْحَادِثِ.", "tr": "Shahida al-jamīʿu bi-annahu kāna fī al-makāni nafsihi waqta al-ḥādithi.", "id": "Semua orang bersaksi bahwa ia berada di tempat yang sama saat kejadian.", "t": 12, "em": ""}, {"n": "2454", "ar": "يُسَاعِدُ مَرْكَزُ الْمُسَاعَدَةِ الْقَانُونِيَّةِ الْفُقَرَاءَ مَجَّانًا.", "tr": "Yusāʿidu markazu al-musāʿadati al-qānūniyyati al-fuqarāʾa majjānan.", "id": "Pusat bantuan hukum membantu orang miskin secara gratis.", "t": 12, "em": "⚖️"}, {"n": "2455", "ar": "حَقُّكَ يَنْتَهِي حَيْثُ يَبْدَأُ حَقُّ الْآخَرِينَ.", "tr": "Ḥaqquka yantahī ḥaythu yabdaʾu ḥaqqu al-ākharīna.", "id": "Hakmu berakhir di mana hak orang lain dimulai.", "t": 12, "em": ""}, {"n": "2456", "ar": "مِنَ الْمُهِمِّ أَنْ نَقْرَأَ الْعَقْدَ كَامِلًا قَبْلَ أَنْ نُوَقِّعَهُ.", "tr": "Mina al-muhimmi an naqraʾa al-ʿaqda kāmilan qabla an nuwaqqiʿahu.", "id": "Penting bagi kita membaca kontrak secara utuh sebelum menandatanganinya.", "t": 12, "em": "📖📑"}, {"n": "2457", "ar": "تُعَدُّ الْعَدَالَةُ الْبَطِيئَةُ نَوْعًا مِنَ الظُّلْمِ.", "tr": "Tuʿaddu al-ʿadālatu al-baṭīʾatu nawʿan mina aẓ-ẓulmi.", "id": "Keadilan yang lambat dianggap sebagai salah satu bentuk ketidakadilan.", "t": 12, "em": ""}, {"n": "2458", "ar": "الْعَيْشُ فِي الْمَدِينَةِ أَسْرَعُ إِيقَاعًا مِنَ الْعَيْشِ فِي الرِّيفِ، لَكِنَّهُ أَغْلَى كَثِيرًا.", "tr": "Al-ʿayshu fī al-madīnati asraʿu īqāʿan mina al-ʿayshi fī ar-rīfi, lākinnahu aghlā kathīran.", "id": "Hidup di kota lebih cepat temponya daripada di desa, tetapi jauh lebih mahal.", "t": 13, "em": "🏙️🏡"}, {"n": "2459", "ar": "كِلَا الْخِيَارَيْنِ لَهُ مَزَايَا، غَيْرَ أَنَّ الثَّانِيَ أَنْسَبُ لِظُرُوفِي.", "tr": "Kilā al-khiyārayni lahu mazāyā, ghayra anna ath-thāniya anṣabu li-ẓurūfī.", "id": "Kedua pilihan itu ada kelebihannya, hanya saja yang kedua lebih sesuai dengan keadaan saya.", "t": 13, "em": ""}, {"n": "2460", "ar": "عَلَى عَكْسِ مَا كُنْتُ أَظُنُّ، الْعَمَلُ فِي فَرِيقٍ أَسْهَلُ مِنَ الْعَمَلِ الْفَرْدِيِّ.", "tr": "ʿAlā ʿaksi mā kuntu aẓunnu, al-ʿamalu fī farīqin ashalu mina al-ʿamali al-fardiyyi.", "id": "Berbeda dari dugaan saya, bekerja dalam tim lebih mudah daripada bekerja sendiri.", "t": 13, "em": "👥"}, {"n": "2461", "ar": "مَقَارَنَةً بِالْعَامِ الْمَاضِي، انْخَفَضَتْ تَكَالِيفُ الْإِنْتَاجِ بِنِسْبَةِ عَشَرَةٍ بِالْمِئَةِ.", "tr": "Muqāranatan bil-ʿāmi al-māḍī, inkhafaḍat takālīfu al-intāji bi-nisbati ʿasharatin bil-miʾati.", "id": "Dibandingkan tahun lalu, biaya produksi turun sepuluh persen.", "t": 13, "em": ""}, {"n": "2462", "ar": "تَتَشَابَهُ الْأَسْعَارُ فِي الْمَحَلَّيْنِ، وَتَخْتَلِفُ الْخِدْمَةُ كَثِيرًا.", "tr": "Tatashābahu al-asʿāru fī al-maḥallayni, wa takhtalifu al-khidmatu kathīran.", "id": "Harga di kedua toko mirip, tetapi layanannya sangat berbeda.", "t": 13, "em": "🏷️🏪"}, {"n": "2463", "ar": "لَيْسَ هُنَاكَ خِيَارٌ مِثَالِيٌّ، فَعَلَيْنَا أَنْ نَزِنَ الْإِيجَابِيَّاتِ وَالسَّلْبِيَّاتِ.", "tr": "Laysa hunāka khiyārun mithāliyyun, faʿalaynā an nazina al-ījābiyyāti was-salbiyyāti.", "id": "Tidak ada pilihan yang sempurna, jadi kita harus menimbang sisi positif dan negatifnya.", "t": 13, "em": ""}, {"n": "2464", "ar": "كُلَّمَا قَارَنْتُ بَيْنَ الْعُرُوضِ ازْدَدْتُ حَيْرَةً.", "tr": "Kullamā qārantu bayna al-ʿurūḍi izdadtu ḥayratan.", "id": "Semakin saya membandingkan tawaran-tawaran itu, semakin bingung saya.", "t": 13, "em": ""}, {"n": "2465", "ar": "إِنَّ الْقِطَارَ أَسْرَعُ مِنَ الْحَافِلَةِ وَإِنْ كَانَ أَغْلَى قَلِيلًا.", "tr": "Inna al-qiṭāra asraʿu mina al-ḥāfilati wa in kāna aghlā qalīlan.", "id": "Kereta lebih cepat daripada bus meskipun sedikit lebih mahal.", "t": 13, "em": "🚆🚌"}, {"n": "2466", "ar": "فِي حِينِ يُفَضِّلُ بَعْضُهُمُ الِادِّخَارَ، يَنْفِقُ آخَرُونَ كُلَّ مَا يَكْسِبُونَ.", "tr": "Fī ḥīni yufaḍḍilu baʿḍuhumu al-iddikhāra, yunfiqu ākharūna kulla mā yaksibūna.", "id": "Sementara sebagian orang lebih suka menabung, yang lain menghabiskan semua penghasilannya.", "t": 13, "em": "🐷"}, {"n": "2467", "ar": "هَذَا الْهَاتِفُ لَيْسَ أَفْضَلَ مِنَ الْآخَرِ، إِنَّمَا يَخْتَلِفُ فِي الْمَزَايَا.", "tr": "Hādhā al-hātifu laysa afḍala mina al-ākhari, innamā yakhtalifu fī al-mazāyā.", "id": "Ponsel ini tidak lebih baik dari yang lain, hanya berbeda dalam fitur.", "t": 13, "em": "📱"}, {"n": "2468", "ar": "مِنْ جِهَةٍ الْمُرَتَّبُ جَيِّدٌ، وَمِنْ جِهَةٍ أُخْرَى سَاعَاتُ الْعَمَلِ طَوِيلَةٌ.", "tr": "Min jihatin al-murattabu jayyidun, wa min jihatin ukhrā sāʿātu al-ʿamali ṭawīlatun.", "id": "Di satu sisi gajinya bagus, di sisi lain jam kerjanya panjang.", "t": 13, "em": "💰⏰"}, {"n": "2469", "ar": "لَا يُمْكِنُ مُقَارَنَةُ بَلَدَيْنِ مُخْتَلِفَيْنِ فِي الظُّرُوفِ التَّارِيخِيَّةِ بِسُهُولَةٍ.", "tr": "Lā yumkinu muqāranatu baladayni mukhtalifayni fī aẓ-ẓurūfi at-tārīkhiyyati bi-suhūlatin.", "id": "Dua negara yang berbeda kondisi sejarahnya tidak mudah dibandingkan.", "t": 13, "em": ""}, {"n": "2470", "ar": "يُعَدُّ هَذَا الْمَطْعَمُ الْأَفْضَلَ فِي الْمِنْطَقَةِ مِنْ حَيْثُ الطَّعْمُ وَالنَّظَافَةُ.", "tr": "Yuʿaddu hādhā al-maṭʿamu al-afḍala fī al-minṭaqati min ḥaythu aṭ-ṭaʿmu wan-naẓāfatu.", "id": "Restoran ini dianggap yang terbaik di daerah itu dari segi rasa dan kebersihan.", "t": 13, "em": "🍽️"}, {"n": "2471", "ar": "بَدَلًا مِنْ شِرَاءِ سَيَّارَةٍ جَدِيدَةٍ، قَرَّرْتُ إِصْلَاحَ الْقَدِيمَةِ.", "tr": "Badalan min shirāʾi sayyāratin jadīdatin, qarrartu iṣlāḥa al-qadīmati.", "id": "Daripada membeli mobil baru, saya memutuskan memperbaiki yang lama.", "t": 13, "em": "🛍️🚗"}, {"n": "2472", "ar": "كِلَاهُمَا يَسْتَحِقُّ الثَّنَاءَ، وَإِنْ كَانَتْ جُهُودُ الْأَوَّلِ أَكْبَرَ.", "tr": "Kilāhumā yastaḥiqqu ath-thanāʾa, wa in kānat juhūdu al-awwali akbara.", "id": "Keduanya layak dipuji, meskipun usaha yang pertama lebih besar.", "t": 13, "em": ""}, {"n": "2473", "ar": "كُلُّ طَرِيقَةٍ فِي التَّدْرِيسِ لَهَا نِقَاطُ قُوَّةٍ وَضَعْفٍ.", "tr": "Kullu ṭarīqatin fī at-tadrīsi lahā niqāṭu quwwatin wa ḍaʿfin.", "id": "Setiap metode mengajar memiliki kekuatan dan kelemahan.", "t": 13, "em": ""}, {"n": "2474", "ar": "الشِّتَاءُ هُنَا أَبْرَدُ بِكَثِيرٍ مِمَّا كُنْتُ أَتَوَقَّعُ.", "tr": "Ash-shitāʾu hunā abradu bi-kathīrin mimmā kuntu atawaqqaʿu.", "id": "Musim dingin di sini jauh lebih dingin dari yang saya duga.", "t": 13, "em": "❄️"}, {"n": "2475", "ar": "مَا الْفَرْقُ بَيْنَ الْوَظِيفَتَيْنِ مِنْ حَيْثُ الْفُرَصُ وَالرَّاتِبُ؟", "tr": "Mā al-farqu bayna al-waẓīfatayni min ḥaythu al-furaṣu war-rātibu?", "id": "Apa perbedaan kedua pekerjaan itu dari segi peluang dan gaji?", "t": 13, "em": "💰"}, {"n": "2476", "ar": "أَعْتَقِدُ أَنَّ الْخِبْرَةَ تَتَفَوَّقُ عَلَى الشَّهَادَةِ فِي بَعْضِ الْمِهَنِ.", "tr": "Aʿtaqidu anna al-khibrata tatafawwaqu ʿalā ash-shahādati fī baʿḍi al-mihani.", "id": "Saya yakin pengalaman mengungguli ijazah dalam beberapa profesi.", "t": 13, "em": ""}, {"n": "2477", "ar": "كَانَتِ الْحَيَاةُ أَبْسَطَ قَبْلَ عِشْرِينَ عَامًا، لَكِنَّهَا الْآنَ أَسْهَلُ.", "tr": "Kānati al-ḥayātu absaṭa qabla ʿishrīna ʿāman, lākinnahā al-āna ashalu.", "id": "Hidup dulu lebih sederhana dua puluh tahun lalu, tetapi sekarang lebih mudah.", "t": 13, "em": ""}, {"n": "2478", "ar": "مِنَ الْمُفِيدِ أَنْ نَسْأَلَ أَكْثَرَ مِنْ شَخْصٍ قَبْلَ أَنْ نُقَرِّرَ.", "tr": "Mina al-mufīdi an nasʾala akthara min shakhṣin qabla an nuqarrira.", "id": "Berguna jika kita bertanya kepada lebih dari satu orang sebelum memutuskan.", "t": 13, "em": ""}, {"n": "2479", "ar": "هَذَا الْحَلُّ أَرْخَصُ، لَكِنَّ ذَاكَ أَدْوَمُ.", "tr": "Hādhā al-ḥallu arkhaṣu, lākinna dhāka adwamu.", "id": "Solusi ini lebih murah, tetapi yang itu lebih awet.", "t": 13, "em": "🏷️"}, {"n": "2480", "ar": "الْقَائِدُ النَّاجِحُ هُوَ مَنْ يَسْتَمِعُ قَبْلَ أَنْ يَأْمُرَ.", "tr": "Al-qāʾidu an-nājiḥu huwa man yastamiʿu qabla an yaʾmura.", "id": "Pemimpin yang berhasil adalah yang mendengar sebelum memerintah.", "t": 14, "em": ""}, {"n": "2481", "ar": "عِنْدَمَا تَقَعُ الْأَزْمَةُ يَجِبُ أَنْ نَحْتَفِظَ بِهُدُوئِنَا وَنُحَدِّدَ الْأَوْلَوِيَّاتِ.",
