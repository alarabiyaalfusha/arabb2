<script>
const D={"topics": {"1": {"ar": "النقاش والحجج", "id": "Diskusi dan Argumen", "items": [{"n": "2251", "v": [{"l": "", "ar": "أَرَى أَنَّ التَّعْلِيمَ الْمَجَّانِيَّ حَقٌّ لِكُلِّ مُوَاطِنٍ، وَذَلِكَ لِأَنَّهُ أَسَاسُ التَّنْمِيَةِ.", "tr": "Arā anna at-taʿlīma al-majjāniyya ḥaqqun li-kulli muwāṭinin, wa dhālika li-annahu asāsu at-tanmiyati."}], "id": "Menurut saya pendidikan gratis adalah hak setiap warga, karena ia dasar pembangunan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2252", "v": [{"l": "", "ar": "لَا أَنْكِرُ وُجُودَ مَشَاكِلَ، وَمَعَ ذَلِكَ أَعْتَقِدُ أَنَّ الْحَلَّ مُمْكِنٌ.", "tr": "Lā unkiru wujūda mashākila, wa maʿa dhālika aʿtaqidu anna al-ḥalla mumkinun."}], "id": "Saya tidak menyangkal adanya masalah, namun saya yakin solusinya mungkin.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2253", "v": [{"l": "", "ar": "الْحُجَّةُ الْأَقْوَى فِي رَأْيِي هِيَ مَا تَدْعَمُهُ الْأَرْقَامُ.", "tr": "Al-ḥujjatu al-aqwā fī raʾyī hiya mā tadʿamuhu al-arqāmu."}], "id": "Argumen yang paling kuat menurut saya adalah yang didukung oleh angka.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2254", "v": [{"l": "", "ar": "إِذَا نَظَرْنَا إِلَى الْمَوْضُوعِ مِنْ زَاوِيَةٍ أُخْرَى فَسَنَجِدُ نَتِيجَةً مُخْتَلِفَةً.", "tr": "Idhā naẓarnā ilā al-mawḍūʿi min zāwiyatin ukhrā fasanajidu natījatan mukhtalifatan."}], "id": "Jika kita melihat masalahnya dari sudut lain, kita akan menemukan hasil yang berbeda.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2255", "v": [{"l": "", "ar": "لَيْسَ كُلُّ مَنْ يُخَالِفُنَا الرَّأْيَ عَدُوًّا لَنَا.", "tr": "Laysa kullu man yukhālifunā ar-raʾya ʿaduwwan lanā."}], "id": "Tidak semua orang yang berbeda pendapat dengan kita adalah musuh kita.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2256", "v": [{"l": "", "ar": "يَبْدُو لِي أَنَّ هَذِهِ الْحُجَّةَ تَقُومُ عَلَى افْتِرَاضٍ خَاطِئٍ.", "tr": "Yabdū lī anna hādhihi al-ḥujjata taqūmu ʿalā iftirāḍin khāṭiʾin."}], "id": "Menurut saya argumen ini bertumpu pada asumsi yang keliru.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2257", "v": [{"l": "", "ar": "لَوْ كَانَ هَذَا صَحِيحًا لَظَهَرَتْ نَتَائِجُهُ فِي السِّنِينَ الْمَاضِيَةِ.", "tr": "Law kāna hādhā ṣaḥīḥan lazaharat natāʾijuhu fī as-sinīna al-māḍiyati."}], "id": "Seandainya ini benar, hasilnya sudah tampak pada tahun-tahun lalu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2258", "v": [{"l": "", "ar": "أُوَافِقُكَ فِي الْمَبْدَإِ، وَأَخْتَلِفُ مَعَكَ فِي التَّفَاصِيلِ.", "tr": "Uwāfiquka fī al-mabdaʾi, wa akhtalifu maʿaka fī at-tafāṣīli."}], "id": "Saya setuju denganmu dalam prinsip, tetapi berbeda pendapat dalam rinciannya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2259", "v": [{"l": "", "ar": "بِنَاءً عَلَى مَا سَبَقَ، يُمْكِنُنَا أَنْ نَسْتَنْتِجَ مَا يَلِي.", "tr": "Bināʾan ʿalā mā sabaqa, yumkinunā an nastantija mā yalī."}], "id": "Berdasarkan apa yang telah disebutkan, kita dapat menyimpulkan hal berikut.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2260", "v": [{"l": "", "ar": "لَا يَكْفِي أَنْ نَنْتَقِدَ، بَلْ يَجِبُ أَنْ نَقْتَرِحَ بَدَائِلَ.", "tr": "Lā yakfī an nantaqida, bal yajibu an naqtariḥa badāʾila."}], "id": "Tidak cukup hanya mengkritik, tetapi kita harus mengusulkan alternatif.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2261", "v": [{"l": "", "ar": "مِنَ الْمُؤَكَّدِ أَنَّ لِكُلِّ قَرَارٍ ثَمَنًا، وَالسُّؤَالُ هُوَ مَنْ يَدْفَعُهُ.", "tr": "Mina al-muʾakkadi anna li-kulli qarārin thamanan, was-suʾālu huwa man yadfaʿuhu."}], "id": "Yang pasti setiap keputusan ada harganya, dan pertanyaannya siapa yang membayarnya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2262", "v": [{"l": "", "ar": "لَا يُمْكِنُ تَعْمِيمُ حَالَةٍ وَاحِدَةٍ عَلَى الْمُجْتَمَعِ كُلِّهِ.", "tr": "Lā yumkinu taʿmīmu ḥālatin wāḥidatin ʿalā al-mujtamaʿi kullihi."}], "id": "Satu kasus tidak bisa digeneralisasi untuk seluruh masyarakat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2263", "v": [{"l": "", "ar": "رَغْمَ أَهَمِّيَّةِ الْمَوْضُوعِ، فَإِنَّ النِّقَاشَ حَوْلَهُ مَحْدُودٌ.", "tr": "Raghma ahammiyyati al-mawḍūʿi, fa-inna an-niqāsha ḥawlahu maḥdūdun."}], "id": "Meskipun topiknya penting, pembahasan tentangnya terbatas.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2264", "v": [{"l": "", "ar": "أُرِيدُ أَنْ أَسْمَعَ الْحُجَجَ الْمُضَادَّةَ قَبْلَ أَنْ أُكَوِّنَ رَأْيِي.", "tr": "Urīdu an asmaʿa al-ḥujaja al-muḍāddata qabla an ukawwina raʾyī."}], "id": "Saya ingin mendengar argumen tandingan sebelum membentuk pendapat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2265", "v": [{"l": "", "ar": "مَا تَقُولُهُ مَنْطِقِيٌّ، غَيْرَ أَنَّهُ لَا يُنَاسِبُ وَاقِعَنَا.", "tr": "Mā taqūluhu manṭiqiyyun, ghayra annahu lā yunāsibu wāqiʿanā."}], "id": "Apa yang kamu katakan logis, hanya saja tidak sesuai dengan kenyataan kita.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2266", "v": [{"l": "", "ar": "يَنْبَغِي أَلَّا نَحْكُمَ عَلَى الْفِكْرَةِ قَبْلَ أَنْ نَفْهَمَهَا جَيِّدًا.", "tr": "Yanbaghī allā naḥkuma ʿalā al-fikrati qabla an nafhamahā jayyidan."}], "id": "Kita sebaiknya tidak menilai suatu gagasan sebelum memahaminya dengan baik.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2267", "v": [{"l": "", "ar": "لَقَدْ أَقْنَعَتْنِي حُجَّتُكَ، وَسَأُغَيِّرُ مَوْقِفِي.", "tr": "Laqad aqnaʿat-nī ḥujjatuka, wa saʾughayyiru mawqifī."}], "id": "Argumenmu telah meyakinkan saya, dan saya akan mengubah sikap saya.", "aid": "", "aar": "", "bid": "", "bar": ""}]}, "2": {"ar": "الرأي في القضايا الاجتماعية", "id": "Opini tentang Isu Sosial", "items": [{"n": "2268", "v": [{"l": "", "ar": "يَرَى كَثِيرُونَ أَنَّ الْعَمَلَ عَنْ بُعْدٍ يُحَسِّنُ جَوْدَةَ الْحَيَاةِ.", "tr": "Yarā kathīrūna anna al-ʿamala ʿan buʿdin yuḥassinu jawdata al-ḥayāti."}], "id": "Banyak orang berpendapat bahwa bekerja jarak jauh meningkatkan kualitas hidup.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2269", "v": [{"l": "", "ar": "مِنَ الْمُهِمِّ أَنْ نُعْطِيَ الشَّبَابَ فُرْصَةً لِلْمُشَارَكَةِ فِي الْقَرَارَاتِ.", "tr": "Mina al-muhimmi an nuʿṭiya ash-shababa furṣatan lil-mushārakati fī al-qarārāti."}], "id": "Penting bagi kita memberi pemuda kesempatan ikut dalam pengambilan keputusan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2270", "v": [{"l": "", "ar": "تَتَزَايَدُ الْفَجْوَةُ بَيْنَ الْأَغْنِيَاءِ وَالْفُقَرَاءِ عَامًا بَعْدَ عَامٍ.", "tr": "Tatazāyadu al-fajwatu bayna al-aghniyāʾi wal-fuqarāʾi ʿāman baʿda ʿāmin."}], "id": "Kesenjangan antara kaya dan miskin semakin melebar dari tahun ke tahun.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2271", "v": [{"l": "", "ar": "لَا أُؤْمِنُ بِأَنَّ الْمَالَ وَحْدَهُ يَصْنَعُ السَّعَادَةَ.", "tr": "Lā uʾminu bi-anna al-māla waḥdahu yaṣnaʿu as-saʿādata."}], "id": "Saya tidak percaya bahwa uang saja menciptakan kebahagiaan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2272", "v": [{"l": "", "ar": "أَصْبَحَ الْوَالِدَانِ قَلِقَيْنِ مِنْ تَأْثِيرِ الشَّاشَاتِ عَلَى أَطْفَالِهِمَا.", "tr": "Aṣbaḥa al-wālidāni qaliqayni min taʾthīri ash-shāshāti ʿalā aṭfālihimā."}], "id": "Para orang tua menjadi cemas akan pengaruh layar terhadap anak-anak mereka.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2273", "v": [{"l": "", "ar": "أَعْتَقِدُ أَنَّ احْتِرَامَ كِبَارِ السِّنِّ مِقْيَاسٌ لِرُقِيِّ الْمُجْتَمَعِ.", "tr": "Aʿtaqidu anna iḥtirāma kibāri as-sinni miqyāsun li-ruqiyyi al-mujtamaʿi."}], "id": "Saya yakin menghormati orang lanjut usia adalah ukuran kemajuan masyarakat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2274", "v": [{"l": "", "ar": "هَلْ تُؤَيِّدُ فَرْضَ ضَرِيبَةٍ عَلَى الْمَشْرُوبَاتِ السُّكَّرِيَّةِ؟", "tr": "Hal tuʾayyidu farḍa ḍarībatin ʿalā al-mashrūbāti as-sukkariyyati?"}], "id": "Apakah kamu mendukung pengenaan pajak atas minuman manis?", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2275", "v": [{"l": "", "ar": "الْعَمَلُ التَّطَوُّعِيُّ لَا يُغْنِي عَنْ دَوْرِ الدَّوْلَةِ.", "tr": "Al-ʿamalu at-taṭawwuʿiyyu lā yughnī ʿan dawri ad-dawlati."}], "id": "Kerja sukarela tidak menggantikan peran negara.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2276", "v": [{"l": "", "ar": "يَتَغَيَّرُ مَفْهُومُ الْأُسْرَةِ مَعَ تَغَيُّرِ الْعَصْرِ.", "tr": "Yataghayyaru mafhūmu al-usrati maʿa taghayyuri al-ʿaṣri."}], "id": "Konsep keluarga berubah seiring perubahan zaman.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2277", "v": [{"l": "", "ar": "مَنْ يَتَحَمَّلُ مَسْؤُولِيَّةَ تَرْبِيَةِ الطِّفْلِ: الْأُسْرَةُ أَمِ الْمَدْرَسَةُ؟", "tr": "Man yataḥammalu masʾūliyyata tarbiyati aṭ-ṭifli: al-usratu am al-madrasatu?"}], "id": "Siapa yang bertanggung jawab mendidik anak: keluarga atau sekolah?", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2278", "v": [{"l": "", "ar": "مِنَ الظُّلْمِ أَنْ نَحْكُمَ عَلَى النَّاسِ مِنْ مَظْهَرِهِمْ فَقَطْ.", "tr": "Mina aẓ-ẓulmi an naḥkuma ʿalā an-nāsi min maẓharihim faqaṭ."}], "id": "Merupakan ketidakadilan menilai orang hanya dari penampilannya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2279", "v": [{"l": "", "ar": "تُسَاهِمُ الْمَرْأَةُ فِي الِاقْتِصَادِ بِقَدْرِ مَا يُسَاهِمُ الرَّجُلُ.", "tr": "Tusāhimu al-marʾatu fī al-iqtiṣādi bi-qadri mā yusāhimu ar-rajulu."}], "id": "Perempuan berkontribusi dalam ekonomi sebanyak laki-laki.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2280", "v": [{"l": "", "ar": "أَظُنُّ أَنَّ الْإِعْلَانَاتِ تُؤَثِّرُ فِي قَرَارَاتِنَا أَكْثَرَ مِمَّا نَعْتَرِفُ.", "tr": "Aẓunnu anna al-iʿlānāti tuʾaththiru fī qarārātinā akthara mimmā naʿtarifu."}], "id": "Saya kira iklan memengaruhi keputusan kita lebih dari yang kita akui.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2281", "v": [{"l": "", "ar": "يَجِبُ أَنْ تَكُونَ الْمُوَاصَلَاتُ الْعَامَّةُ أَرْخَصَ وَأَسْرَعَ.", "tr": "Yajibu an takūna al-muwāṣalātu al-ʿāmmatu arkhaṣa wa asraʿa."}], "id": "Transportasi umum harus lebih murah dan lebih cepat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "2282", "v": [{"l": "", "ar": "الْفَنُّ لَيْسَ تَرَفًا، بَ let token=0,curAudio=null,voice=null,rate=0.85,auto=true;

function tts(text){return new Promise(res=>{
  if(!('speechSynthesis' in window)){res();return}
  const u=new SpeechSynthesisUtterance(text.replace(/[،؟]/g,' '));u.lang='ar-SA';if(voice)u.voice=voice;u.rate=rate;

})}
function playKey(key,text){return new Promise(res=>{
  let fell=false;const fb=()=>{if(fell)return;fell=true;tts(text).then(res)};
  const a=new Audio('audio/'+key+'.mp3');a.playbackRate=rate;curAudio=a;a.onerror=fb;a.onended=()=>res();
  const p=a.play();if(p&&p.catch)p.catch(fb);
})}
async function speak(key,text,btn){stopAudio();const my=token;if(btn)btn.classList.add('play');await playKey(key,text);if(btn&&my===token)btn.classList.remove('play')}

/* ---------- state ---------- */
let S={v:'hub',t:0,i:0};
function slides(t){
  const T=D.topics[t],L=[{k:'cover'}];
  T.items.forEach((it,j)=>{L.push({k:'s',j});if(it.aar)L.push({k:'d',j})});
  L.push({k:'end'});return L;
}
function go(h){location.hash=h}
function parse(){
  const h=location.hash.slice(1)||'hub';
  if(h==='hub'||h==='lessons'||h==='quizzes')S={v:h};
  else{const m=h.match(/^t(\d+)\/(\d+)$/);if(m)S={v:'t',t:+m[1],i:+m[2]};else S={v:'hub'}}
  render();
}
addEventListener('hashchange',parse);

        const id='sp'+q,key=it.n+(q?'f':'');
        autoList.push([key,v.ar,id]);
        cols+=`<div class="col ${two?'':'one'}">${v.l?`<span class="lab">${v.l}</span>`:''}<div class="ar" style="font-size:${arSize(v.ar,!two)}px">${v.ar}</div><div class="tr" style="font-size:${two?Math.min(28,trSize(v.tr)):trSize(v.tr)}px">${esc(v.tr)}</div>${speaker(id,key,v.ar)}</div>`;
      });
      h+=`<div class="card fade"><div class="numb">${it.n}</div><div class="cols">${cols}</div><div class="mean" style="font-size:${mSize(it.id)}px">${esc(it.id)}</div></div>`;
      window._al=autoList;
    }else if(s.k==='d'){
      const it=T.items[s.j];
      autoList=[[it.n+'a',it.aar,'sa'],[it.n+'b',it.bar,'sb']];
      h+=`<div class="card fade"><div class="numb">${it.n}</div><div class="dlg">
       <div class="bub a"><div class="who">أ</div><div class="txt"><div class="ar" style="font-size:${dSize(it.aar)}px">${it.aar.replace(/^أ:\s*/,'')}</div><div class="idn">${esc(it.aid)}</div></div>${speaker('sa',it.n+'a',it.aar.replace(/^أ:\s*/,''))}</div>
       <div class="bub b"><div class="who">ب</div><div class="txt"><div class="ar" style="font-size:${dSize(it.bar)}px">${it.bar.replace(/^ب:\s*/,'')}</div><div class="idn">${esc(it.bid)}</div></div>${speaker('sb',it.n+'b',it.bar.replace(/^ب:\s*/,''))}</div></div>
       <button class="pdlg" onclick="seq(window._al)">▶ Putar dialog · شغّل الحوار</button></div>`;
      autoList=[[it.n+'a',it.aar.replace(/^أ:\s*/,''),'sa'],[it.n+'b',it.bar.replace(/^ب:\s*/,''),'sb']];
      window._al=autoList;
    }else{
      let rows='';T.items.forEach((it,j)=>{rows+=`<a href="#t${S.t}/${slides(S.t).findIndex(x=>x.k==='s'&&x.j===j)}" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:2px 12px"><b style="color:var(--g);width:46px;font-size:20px">${it.n}</b><span class="ar" style="font-size:26px;font-weight:700;flex:1;min-width:0;color:var(--gd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.v[0].ar}</span></a>`});
      h+=`<div class="card fade" style="overflow:auto;padding:26px 30px"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${rows}</div></div>
      ${QUIZ[S.t]?`<a class="go" style="position:absolute;left:1560px;top:300px;width:320px;text-align:center;font-size:30px;padding:18px 10px;line-height:1.3;text-decoration:none" href="${QUIZ[S.t]}">Kuis topik ${S.t}<br>الاختبار ←</a>`:''}`;
    }
    const pv=S.i>0?`go('t${S.t}/${S.i-1}')`:"go('lessons')";
    const nx=S.i<last?`go('t${S.t}/${S.i+1}')`:`go('lessons')`;
    h+=`<a class="homeb" href="#hub" title="Menu Utama"><svg viewBox="0 0 64 64"><path d="M8 32L32 10l24 22h-7v22H39V40H25v14H15V32z" fill="#f2c651"/></svg>Menu Utama</a>`;
    h+=`<div id="cnt">${S.i+1} / ${L.length}</div><div id="prog"><b style="width:${(S.i/last)*100}%"></b></div>`;
    h+=nav(pv,nx,S.i>0?'Sebelumnya':'Daftar isi',S.i<last?'Selanjutnya':'Selesai');
    if(s.k==='s'||s.k==='d')h+=tools();
    ui.innerHTML=h;
    if((s.k==='s'||s.k==='d')&&auto&&!keep)setTimeout(()=>seq(window._al),450);
    if(!('speechSynthesis' in window))$('#warn').textContent='Browser tidak mendukung suara · المتصفح لا يدعم الصوت';
    return;
  }
  ui.innerHTML=h;
}
addEventListener('keydown',e=>{
  if(S.v!=='t')return;const L=slides(S.t);
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go('t'+S.t+'/'+Math.min(S.i+1,L.length-1));
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go('t'+S.t+'/'+Math.max(S.i-1,0));
  else if(e.key==='p')seq(window._al||[]);
});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null||S.v!=='t')return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<90)return;const L=slides(S.t);
  go('t'+S.t+'/'+(dx<0?Math.min(S.i+1,L.length-1):Math.max(S.i-1,0)))},{passive:true});
parse();
</script>
</body>
</html>
